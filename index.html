    '<div class="lijst">' + (items || '<div class="leegtekst">De lijst is leeg.</div>') + '</div>' +
    (heeftGedaan ? '<button type="button" class="knop2" data-act="wis">Afgevinkte items wissen</button>' : '') +
    '</section></main>';
}

function brood() {
  if (!D.dagen.length) {
    var v = D.schoolVrij || {};
    return '<main><section class="card vakantie">' + '<span style="color:#9CC2FF">' + svg('tas', 48) + '</span>' +
      '<b>' + (v.naam ? 'Het is ' + esc(v.naam.toLowerCase().indexOf('vakantie') >= 0 ? v.naam.toLowerCase() : v.naam) + '!' : 'Geen schooldag') + '</b>' +
      '<div class="klein" style="font-size:16px">Er hoeft nu niets klaargezet te worden.' + (v.weer ? ' De school begint weer op <b style="font-size:16px">' + esc(v.weer) + '</b>.' : '') + '</div>' +
      '<div class="klein">Vanaf het weekend ervoor kun je hier weer brood, fruit en spullen kiezen.</div></section></main>';
  }
  if (broodDag >= D.dagen.length) broodDag = D.dagen.length - 1;
  var dag = D.dagen[broodDag];
  var data = D.brood[dag.datum] || {};
  var schakel = '<div class="chips" role="group" aria-label="Dag kiezen">' + D.dagen.map(function (d, i) {
    return '<button type="button" class="tab" aria-pressed="' + (i === broodDag) + '" data-act="broodDag" data-id="' + i + '">' +
      esc(d.label) + ' · ' + esc(d.dag) + ' ' + d.nr + '</button>';
  }).join('') + '</div>';

  var M = ['ontbijt', 'lunch', 'fruit'];
  var telling = { ontbijt: {}, lunch: {}, fruit: {} }, totaal = { ontbijt: 0, lunch: 0, fruit: 0 }, nog = [];
  var mee = (D.meenemen || []).filter(function (x) { return x.datum === dag.datum; });
  var kaarten = zichtbareKinderen().map(function (k) {
    var b = data[k.id] || { ontbijt: [], lunch: [], fruit: [] };
    M.forEach(function (m) {
      b[m] = b[m] || [];
      if (!b[m].length) nog.push(k.naam + ' (' + m + ')');
      b[m].forEach(function (x) { telling[m][x] = (telling[m][x] || 0) + 1; totaal[m]++; });
    });
    var spullen = mee.filter(function (x) { return x.kind === k.id; }).map(function (x) {
      return '<div class="mee' + (x.ingepakt ? ' ingepakt' : '') + '">' +
        '<button type="button" class="vakknop" data-act="meeWissel" data-id="' + esc(x.id) + '" aria-label="' + esc(x.wat) + (x.ingepakt ? ', ingepakt' : ', nog inpakken') + '">' +
        '<span class="vak"' + (x.ingepakt ? ' style="border-color:var(--ja);background:rgba(74,222,128,.16)"' : '') + '>' + (x.ingepakt ? svg('vink', 16, 3) : '') + '</span></button>' +
        '<span class="mtekst">' + esc(x.wat) + '</span>' +
        '<button type="button" class="wis" data-act="meeWeg" data-id="' + esc(x.id) + '" aria-label="' + esc(x.wat) + ' weghalen">×</button></div>';
    }).join('');
    return '<section class="card" style="padding:18px"><div class="rij" style="gap:10px">' + av(k, 44) +
      '<div style="font-size:18px;font-weight:900">' + esc(k.naam) + '</div></div>' +
      maal(k, 'ontbijt', 'Ontbijt', b.ontbijt) + maal(k, 'lunch', 'Lunch op school', b.lunch) + maal(k, 'fruit', 'Fruit', b.fruit) +
      '<div class="maal"><div class="kop"><span class="mtitel">Mee naar school</span></div>' + spullen +
      '<button type="button" class="snee plus" data-act="meeNieuw" data-id="' + esc(k.id) + '" aria-label="Iets mee naar school voor ' + esc(k.naam) + '">+ iets meenemen</button></div>' +
      '</section>';
  }).join('');

  var titels = { ontbijt: 'Ontbijt', lunch: 'Lunch op school', fruit: 'Fruit' };
  var overzicht = M.map(function (m) {
    var delen = Object.keys(telling[m]).sort(function (a, b) { return telling[m][b] - telling[m][a]; })
      .map(function (x) { return telling[m][x] + '× ' + esc(x); }).join(' · ');
    var eenheid = m === 'fruit' ? (totaal[m] === 1 ? ' stuk' : ' stuks') : (totaal[m] === 1 ? ' boterham' : ' boterhammen');
    return '<div><span style="font-size:17px;font-weight:900">' + titels[m] + ': ' + totaal[m] + eenheid +
      '</span><div class="klein" style="font-size:15px;margin-top:2px">' + (delen || 'nog niets gekozen') + '</div></div>';
  }).join('');
  var meeTekst = mee.map(function (x) { var p = persoon(x.kind); return (p ? p.naam : x.kind) + ': ' + x.wat + (x.ingepakt ? ' ✓' : ''); });
  overzicht += '<div><span style="font-size:17px;font-weight:900">Mee naar school: ' + mee.length + '</span><div class="klein" style="font-size:15px;margin-top:2px">' +
    (meeTekst.length ? esc(meeTekst.join(' · ')) : 'niets extra') + '</div></div>';

  return '<main style="display:flex;flex-direction:column;gap:16px">' +
    '<div class="kop" style="align-items:center">' + schakel + '<span class="klein" style="font-size:15px">Kies je brood en fruit, en zet erbij wat er mee moet</span></div>' +
    (function () {
      var w = weerVoor(dag.datum);
      return w ? '<div class="weerbalk"><span class="nu" style="font-size:16px">' + svg(w.icoon, 22) + esc(w.tekst) + ' · ' + w.min + '–' + w.max + '°</span>' +
        (w.tips.length ? w.tips.map(function (t) { return '<span class="weertip">' + esc(t) + '</span>'; }).join('') : '<span>Geen bijzonderheden voor onderweg</span>') + '</div>' : '';
    })() +
    '<div class="kids">' + kaarten + '</div>' +
    '<section class="card"><div class="kop"><h2>Klaarzetten voor ' + esc(dag.label === 'Vandaag' || dag.label === 'Morgen' ? dag.label.toLowerCase() : dag.dag) + '</h2>' +
    '<span class="klein">Staat ook in de mail van ' + D.meldingOverig + ':00 de avond ervoor</span></div>' +
    '<div class="grid-eten" style="gap:12px 20px">' + overzicht + '</div>' +
    (nog.length ? '<div class="melding">Nog niet gekozen: ' + esc(nog.join(', ')) + '</div>' : '') + '</section></main>';
}

function maal(k, m, label, lijst) {
  var fruit = m === 'fruit';
  var stuk = fruit ? 'stuk fruit' : 'boterham';
  var sneden = lijst.map(function (bel, i) {
    return '<button type="button" class="snee" data-act="snee" data-id="' + esc(k.id + '|' + m + '|' + i) + '" style="border-color:' + esc(k.kleur) + '66"' +
      ' aria-label="' + esc(label) + ', ' + stuk + ' ' + (i + 1) + ': ' + esc(bel) + ', tik om te wijzigen">' +
      '<span style="color:' + esc(k.kleur) + ';display:inline-flex">' + svg(fruit ? 'fruit' : 'brood', 20) + '</span><span>' + esc(bel) + '</span></button>';
  }).join('');
  var plus = lijst.length < (fruit ? 2 : 4) ? '<button type="button" class="snee plus" data-act="snee" data-id="' + esc(k.id + '|' + m + '|' + lijst.length) +
    '" aria-label="' + esc(label) + ': ' + stuk + ' toevoegen voor ' + esc(k.naam) + '">' + (fruit ? '+ fruit' : '+ boterham') + '</button>' : '';
  var aantal = fruit ? lijst.length + (lijst.length === 1 ? ' stuk' : ' stuks') : lijst.length + (lijst.length === 1 ? ' boterham' : ' boterhammen');
  return '<div class="maal"><div class="kop"><span class="mtitel">' + esc(label) + '</span><span class="klein">' +
    (lijst.length ? aantal : 'nog kiezen') + '</span></div>' + sneden + plus + '</div>';
}

function broodLijst(kind, m) {
  var dag = D.dagen[broodDag];
  D.brood[dag.datum] = D.brood[dag.datum] || {};
  D.brood[dag.datum][kind] = D.brood[dag.datum][kind] || { ontbijt: [], lunch: [], fruit: [] };
  D.brood[dag.datum][kind][m] = D.brood[dag.datum][kind][m] || [];
  return D.brood[dag.datum][kind][m];
}

function renderKeuze(laag) {
  var k = persoon(keuze.kind) || { naam: '?', kleur: '#ECEEF3' };
  var lijst = broodLijst(keuze.kind, keuze.maaltijd);
  var huidig = lijst[keuze.index];
  var fruit = keuze.maaltijd === 'fruit';
  var opties = fruit ? (D.fruit || []).map(function (f) { return { naam: f }; }) :
    D.beleg.filter(function (b) { return b.voor === 'beide' || b.voor === keuze.maaltijd; });
  var maaltijd = keuze.maaltijd === 'ontbijt' ? 'ontbijt' : fruit ? 'fruit mee naar school' : 'lunch op school';
  laag.innerHTML = '<div class="overlay"><div class="kiesbox" role="dialog" aria-modal="true" aria-label="' + (fruit ? 'Fruit kiezen' : 'Beleg kiezen') + '">' +
    av(k, 56) + '<h2>' + (fruit ? 'Fruit' : 'Boterham ' + (keuze.index + 1)) + ' voor ' + esc(k.naam) + '</h2>' +
    '<div class="klein" style="font-size:15px">' + esc(hoofdletter(maaltijd)) + ' · ' + esc(D.dagen[broodDag].label.toLowerCase()) + '</div>' +
    '<div class="kiesgrid">' + (opties.map(function (b) {
      var gekozen = b.naam === huidig;
      return '<button type="button" class="kies" data-act="kies" data-id="' + esc(b.naam) + '" aria-pressed="' + gekozen + '"' +
        (gekozen ? ' style="border-color:' + esc(k.kleur) + ';background:' + esc(k.kleur) + '33"' : '') + '>' + esc(b.naam) + '</button>';
    }).join('') || '<div class="leegtekst">' + (fruit ? 'Nog geen fruit. Vul het tabblad Fruit in de Sheet.' : 'Nog geen beleg. Vul het tabblad Beleg in de Sheet.') + '</div>') + '</div>' +
    '<div class="kiesknoppen">' + (huidig ? '<button type="button" class="knop2" data-act="weg">' + (fruit ? 'Fruit weghalen' : 'Boterham weghalen') + '</button>' : '') +
    '<button type="button" class="knop2" data-act="sluit">Annuleren</button></div></div></div>';
}

var MEE_IDEEEN = ['Gymspullen', 'Zwemspullen', 'Bibliotheekboek', 'Briefje terug', 'Traktatie', 'Knutselspullen', 'Laptop/tablet', 'Regenkleding'];

function renderMee(laag) {
  var k = persoon(meeForm.kind) || { naam: '?', kleur: '#ECEEF3' };
  var dag = D.dagen[broodDag];
  laag.innerHTML = '<div class="overlay"><form class="detailbox" data-form="mee" role="dialog" aria-modal="true" aria-label="Iets mee naar school">' +
    '<div class="rij" style="gap:12px">' + av(k, 48) + '<h2>Wat moet ' + esc(k.naam) + ' meenemen?</h2></div>' +
    '<div class="klein" style="font-size:15px">' + esc(dag.label) + ' · ' + esc(dag.dag + ' ' + dag.nr + ' ' + dag.maand) + '</div>' +
    '<div class="chips">' + MEE_IDEEEN.map(function (t) {
      return '<button type="button" class="keuze" data-act="meeIdee" data-id="' + esc(t) + '">' + esc(t) + '</button>';
    }).join('') + '</div>' +
    '<div class="invoer"><label class="sr" for="meeveld">Iets anders</label><input id="meeveld" type="text" maxlength="50" autocomplete="off" placeholder="Of typ zelf iets"></div>' +
    '<div class="chips"><button type="submit" class="knop">Toevoegen</button><button type="button" class="knop2" data-act="meeSluit" style="align-self:center">Annuleren</button></div>' +
    '</form></div>';
}

function voegMeeToe(wat) {
  wat = String(wat || '').trim().slice(0, 50);
  if (!wat || !meeForm) return;
  var dag = D.dagen[broodDag], kind = meeForm.kind;
  D.meenemen = (D.meenemen || []).concat([{ id: 'tijdelijk' + Date.now(), datum: dag.datum, kind: kind, wat: wat, ingepakt: false }]);
  meeForm = null; render();
  bewaar('voegMeenemenToe', [dag.datum, kind, wat]);
}

function zetBroodLijst(kind, m, lijst) {
  var dag = D.dagen[broodDag];
  D.brood[dag.datum][kind][m] = lijst;
  keuze = null; render();
  bewaar('zetBrood', [dag.datum, kind, m, lijst]);
}

function isoWeek(datum) {
  var p = datum.split('-').map(Number);
  var dt = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
  var dag = dt.getUTCDay() || 7;
  dt.setUTCDate(dt.getUTCDate() + 4 - dag);
  return Math.ceil(((dt - new Date(Date.UTC(dt.getUTCFullYear(), 0, 1))) / 86400000 + 1) / 7);
}

function mini(kleur, tekst) {
  return '<span style="color:' + esc(kleur) + ';border-color:' + esc(kleur) + '66">' + esc(tekst) + '</span>';
}

function gaatChip(e) {
  var s = ST[e.status];
  return '<button type="button" class="chip" data-act="gaat" data-id="' + esc(e.sleutel) + '" style="color:' + s.c + ';border-color:' + s.c + ';background:' + s.bg +
    '" aria-label="' + esc(e.titel) + ': ' + esc(GAAT_L[e.status].slice(2)) + ', tik om te wijzigen">' + GAAT_L[e.status] + '</button>';
}

function week() {
  var a = D.agenda || {};
  var dagen = (a.dagen || []).slice(weekNr * 7, weekNr * 7 + 7).filter(function (d) { return !isMobiel() || weekNr > 0 || d.datum >= D.vandaag; });
  if (!dagen.length) return '<main><div class="melding">De weekagenda kon niet geladen worden.</div></main>';
  var schakel = '<div class="chips" role="group" aria-label="Week kiezen">' + ['Deze week', 'Volgende week'].map(function (l, i) {
    return '<button type="button" class="tab" aria-pressed="' + (i === weekNr) + '" data-act="weekNr" data-id="' + i + '">' + l + '</button>';
  }).join('') + '</div>';
  var eerste = dagen[0], laatste = dagen[dagen.length - 1];
  var bereik = eerste.nr + (eerste.maand !== laatste.maand ? ' ' + eerste.maand : '') + ' – ' + laatste.nr + ' ' + laatste.maand;
  var open = 0;

  var kolommen = dagen.map(function (d) {
    var voorbij = d.datum < D.vandaag;
    var items = d.events.map(function (e) {
      var wie = e.wie.map(persoon).filter(Boolean);
      var dots = wie.map(function (p) { return '<span class="dot" style="width:8px;height:8px;background:' + esc(p.kleur) + '"></span>'; }).join('');
      var regel = '';
      if (e.kind && !e.heleDag) {
        var b = e.breng && persoon(e.breng), h = e.haal && persoon(e.haal);
        if (!voorbij) open += (b ? 0 : 1) + (h ? 0 : 1);
        regel = '<span class="r">' + mini(ST[e.status].c, GAAT_L[e.status].charAt(0)) +
          mini(b ? b.kleur : '#F2C14E', 'B: ' + (b ? b.naam : '?')) + mini(h ? h.kleur : '#F2C14E', 'H: ' + (h ? h.naam : '?')) + '</span>';
      }
      return '<button type="button" class="wev" data-act="detail" data-id="' + esc(e.sleutel) + '" aria-label="' + esc(e.tijd + ', ' + e.titel) + ', details openen">' +
        '<span class="t">' + (e.categorie ? svg(e.categorie, 12) : '') + esc(e.tijd) + (e.eind ? '–' + esc(e.eind) : '') + (e.notitie ? svg('notitie', 12) : '') + '</span><span class="n">' + esc(e.titel) + '</span>' +
        (dots ? '<span style="display:flex;gap:3px">' + dots + '</span>' : '') + regel + '</button>';
    }).join('');
    return '<section class="dagkol' + (d.vandaag ? ' nu' : '') + (voorbij ? ' voorbij' : '') + '" aria-label="' + esc(d.dag + ' ' + d.nr + ' ' + d.maand) + '">' +
      '<div class="dagkop"><b>' + esc(d.dag) + ' ' + d.nr + '</b><span>' + (d.vandaag ? 'vandaag' : '') + '</span>' +
      dagWeer(d) + '</div>' +
      (items || '<div class="klein" style="padding:2px">Niets gepland</div>') + '</section>';
  }).join('');

  return '<main style="display:flex;flex-direction:column;gap:14px">' +
    '<div class="weekkop">' + schakel + '<span class="klein" style="font-size:15px">Week ' + isoWeek(eerste.datum) + ' · ' + esc(bereik) +
    ' · ' + open + (open === 1 ? ' rit' : ' ritten') + ' zonder chauffeur</span></div>' +
    (a.fout ? '<div class="melding">' + esc(a.fout) + '</div>' : '') +
    '<div class="weekgrid">' + kolommen + '</div>' +
    '<div class="klein" style="font-size:14px">Tik op een afspraak om hem te bewerken: gaat het kind, wie brengt (B) en haalt (H), categorie en notitie.</div></main>';
}

function renderDetail(laag) {
  var e = vindEvent(detail);
  if (!e) { detail = null; bewerkA = null; laag.innerHTML = ''; return; }
  if (!bewerkA) bewerkA = { status: e.status, breng: e.breng || '', haal: e.haal || '', notitie: e.notitie || '', categorie: e.categorie || '' };
  var f = bewerkA;
  var dag = ((D.agenda || {}).dagen || []).filter(function (d) { return d.datum === e.datum; })[0] || { dag: '', nr: '', maand: '' };
  var wie = e.wie.map(persoon).filter(Boolean);
  var kids = wie.filter(function (p) { return p.rol === 'kind'; });
  var wieHtml = wie.length ? wie.map(function (p) { return '<span class="dot" style="background:' + esc(p.kleur) + '"></span>'; }).join('') +
    '<span>' + esc(wie.map(function (p) { return p.naam; }).join(' & ')) + '</span>' : '<span>Gezin</span>';
  var keuzes = function (act, opties, huidig) {

function renderSlot() {
  document.getElementById('app').innerHTML = '<main class="slotscherm"><section class="card">' +
    '<span class="av" style="width:72px;height:72px;background:#9CC2FF">' + svg('slot', 34) + '</span>' +

    (slotAuto ? '<div class="klein" style="font-size:17px;font-weight:800;margin-top:6px">Dashboard laden…</div>' :
    '<form data-form="slot"><label class="sr" for="slotcode">Gezinscode</label>' +

    '<button type="submit" class="knop"' + (slotBezig ? ' disabled' : '') + '>' + (slotBezig ? 'Even controleren…' : 'Openen') + '</button></form>') +
    '<div class="fout" aria-live="assertive">' + esc(slotFout) + '</div></section></main>';
  document.getElementById('laag').innerHTML = '';
  var veld = document.getElementById('slotcode');

}

var slotAuto = false;   // de bewaarde code wordt automatisch gecontroleerd (geen invoer nodig)
function probeerCode(code, auto) {
  slotBezig = true; slotAuto = !!auto; slotFout = ''; render();
  google.script.run
    .withSuccessHandler(function (res) {
      slotBezig = false; slotAuto = false;
      if (!res || res.slot) {
        slotFout = (res && res.fout) || '';
        if (codeEchtFout(res) || !auto) vergeetCode();
        else if (auto) { slotFout = (slotFout ? slotFout + ' ' : '') + 'Ik probeer het zo opnieuw…'; setTimeout(function () { if (vergrendeld && gezinscode) probeerCode(gezinscode, true); }, 15000); }
        render(); return;
      }
      gezinscode = code; try { localStorage.setItem('gezinsdashboard-code', code); } catch (e) {}
      nieuweData(res); vergrendeld = false;
      if (isMobiel() && !ik) wieKiezen = true;
      render();
    })
    .withFailureHandler(function (err) {
      slotBezig = false; slotAuto = false;
      slotFout = err && err.toonbaar ? err.message : 'Geen verbinding. Probeer het opnieuw.';
      if (auto) { slotFout = 'Geen verbinding, ik probeer het zo opnieuw…'; setTimeout(function () { if (vergrendeld && gezinscode) probeerCode(gezinscode, true); }, 10000); }
      render();
    })
    .api(code, 'getData', []);
}

/** Het script gaf { slot: true } terug: de code is gewijzigd of ontbreekt. Terug naar het codescherm. */
function toonSlot(res) {
  var fout = res && res.fout;
  // Tijdelijk probleem (te veel foute pogingen door iemand anders, instelling even niet leesbaar):
  // dit apparaat houdt zijn code en blijft gewoon werken.
  if (gezinscode && !codeEchtFout(res) && !(res && res.reden === 'leeg')) { if (fout) zegt(fout, '#FF8A7A'); return; }
  vergrendeld = true; slotFout = fout || 'Typ de (nieuwe) gezinscode.';
  pin = null; keuze = null; detail = null; bewerkA = null; menuEdit = null; klusForm = null; helpDag = null;
  meeForm = null; wieKiezen = false; extraForm = null; beoordeel = null; spaarForm = null;
  vergeetCode();
  render();
}

/* ---------------- opslaan ---------------- */

function bewaar(fn, args) {
  bezig++;
  var run = google.script.run
    .withSuccessHandler(function (res) {
      bezig--;
      if (res && res.slot) { toonSlot(res); return; }
      if (res && res.fout) { ouderSessie = null; zegt(res.fout, '#FF8A7A'); ververs(); return; }
      if (bezig === 0 && res && res.gezin) { nieuweData(res); render(); }
    })
    .withFailureHandler(function () { bezig--; zegt('Opslaan mislukt, probeer opnieuw', '#FF8A7A'); ververs(); });
  run.api(gezinscode, fn, args);
}

function ververs() {
  if (vergrendeld || pin || keuze || detail || menuEdit || klusForm || helpDag || meeForm || wieKiezen || extraForm || beoordeel || spaarForm || bezig) return;
  google.script.run.withSuccessHandler(function (res) {
    if (res && res.slot) { toonSlot(res); return; }
    if (!pin && !keuze && !detail && !menuEdit && !klusForm && !helpDag && !meeForm && !wieKiezen && !extraForm && !beoordeel && !spaarForm && !bezig && res && res.gezin) { nieuweData(res); render(); }
  }).api(gezinscode, 'getData', []);
}

function alleEvents() {
  return ((D.agenda || {}).dagen || []).reduce(function (alle, d) { return alle.concat(d.events); }, []);
}
function vandaagEvents() {
  var dag = ((D.agenda || {}).dagen || []).filter(function (d) { return d.vandaag; })[0];
  return dag ? dag.events : [];
}
function vindEvent(sleutel) { return alleEvents().filter(function (e) { return e.sleutel === sleutel; })[0]; }

function volgendeChauffeur(huidig) {
  var opties = [''].concat(ouders().map(function (p) { return p.id; }), [OPA_OMA.id]);
  return opties[(opties.indexOf(huidig || '') + 1) % opties.length];
}

/* Pincode meteen op het scherm controleren met de vingerafdrukken uit de data (de server controleert bij het
   opslaan altijd nog een keer). Geeft de persoon terug bij een goede pincode, false bij een foute, en null als
   het hier niet kan (oude browser of oude serverversie): dan gaat het zoals vroeger via de server. */
var pinHashGeheugen = {};
function pinHash(id, digits, klaar) {
  var tekst = D.pinZout + '|' + id + '|' + digits;
  if (pinHashGeheugen[tekst]) { klaar(pinHashGeheugen[tekst]); return; }
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(tekst)).then(function (buf) {
    var hex = Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    pinHashGeheugen[tekst] = hex; klaar(hex);
  }, function () { klaar(null); });
}
function controleerLokaal(ids, digits, klaar) {
  var mensen = ids.map(persoon).filter(Boolean);
  if (!D.pinZout || !window.crypto || !crypto.subtle || !window.TextEncoder || !mensen.some(function (p) { return p.ph; })) { klaar(null); return; }
  var open = mensen.length, gevonden = false, kapot = false;
  mensen.forEach(function (p) {
    pinHash(p.id, digits, function (h) {
      if (h === null) kapot = true;
      if (!gevonden && h && p.ph && h === p.ph) gevonden = p;
      if (--open === 0) klaar(gevonden || (kapot ? null : false));
    });
  });
}
function ouderIds() { return ouders().map(function (o) { return o.id; }); }

function druk(t) {
  if (!pin || pin.bezig) return;
  if (t === 'Annuleer') { pin = null; render(); return; }
  if (t === 'Wis') { pin.digits = pin.digits.slice(0, -1); renderPin(); return; }
  if (pin.digits.length >= 4) return;
  pin.digits += t; pin.fout = '';
  if (pin.digits.length < 4) { renderPin(); return; }
  pin.bezig = true;
  var p1 = pin, digits = pin.digits;
  var wie = pin.ouder ? ouderIds() : [pin.server ? pin.kind : pin.klus.kind].concat(ouderIds());
  controleerLokaal(wie, digits, function (wieGoed) {
    if (pin !== p1) return;
    if (wieGoed === null) { renderPin(); drukServer(); return; }
    if (wieGoed === false) {
      pin.bezig = false; pin.digits = ''; pin.schud = true; pin.fout = 'Verkeerde pincode, probeer het nog eens';
      renderPin(); return;
    }
    pinMeteenGoed(wieGoed, digits);
  });
}

/** Pincode klopt: venster meteen dicht, opslaan gebeurt op de achtergrond. */
function pinMeteenGoed(wieGoed, digits) {
  var p0 = pin;
  pin = null;
  if (p0.ouder) {
    ouderSessie = { pin: digits, naam: wieGoed.naam, tot: Date.now() + 5 * 60000 };
    render();
    if (p0.daarna) p0.daarna(); else zegt('Hoi ' + wieGoed.naam + '!', '#9CC2FF');
    return;
  }
  if (p0.server) {
    render();
    zegt(p0.gelukt, (persoon(p0.kind) || {}).kleur || '#9CC2FF');
    bewaar(p0.server.fn, p0.server.args.concat([digits]));
    return;
  }
  var klus = p0.klus;
  var c = D.klusjes.filter(function (x) { return x.id === klus.id; })[0];
  if (c && !c.gedaan) {
    c.gedaan = true;
    if (D.punten) D.punten[klus.kind] = (D.punten[klus.kind] || 0) + klus.punten;
    if (D.verdiend) D.verdiend[klus.kind] = (D.verdiend[klus.kind] || 0) + klus.punten;
  }
  render();
  var k = persoon(klus.kind) || { naam: '', kleur: '#ECEEF3' };
  zegt('+' + klus.punten + (klus.punten === 1 ? ' punt' : ' punten') + ' voor ' + k.naam + '!', k.kleur);
  bewaar('vinkAf', [klus.id, digits]);
}

/** Zoals vroeger: de server controleert de pincode (als het op het scherm zelf niet kan). */
function drukServer() {
  if (pin.server) {
    var p0 = pin;
    var runner = google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.slot) { toonSlot(res); return; }
        if (res && res.fout) {
          p0.bezig = false; p0.digits = ''; p0.schud = res.fout === 'Verkeerde pincode';
          p0.fout = res.fout === 'Verkeerde pincode' ? 'Verkeerde pincode, probeer het nog eens' : res.fout;
          renderPin(); return;
        }
        pin = null; if (res && res.gezin) nieuweData(res);
        zegt(p0.gelukt, (persoon(p0.kind) || {}).kleur || '#9CC2FF');
      })
      .withFailureHandler(function (err) { p0.bezig = false; p0.digits = ''; p0.fout = (err && err.message) || 'Opslaan mislukt, probeer opnieuw'; renderPin(); });
    runner.api(gezinscode, p0.server.fn, p0.server.args.concat([p0.digits]));
    return;
  }
  if (pin.ouder) {
    var code = pin.digits;
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.slot) { toonSlot(res); return; }
        if (!res || !res.ok) {
          pin.bezig = false; pin.digits = ''; pin.schud = true;
          pin.fout = res && res.fout && res.fout !== 'Verkeerde pincode' ? res.fout : 'Verkeerde pincode, probeer het nog eens';
          renderPin(); return;
        }
        var daarna = pin.daarna;
        ouderSessie = { pin: code, naam: res.naam, tot: Date.now() + 5 * 60000 };
        pin = null;
        if (daarna) daarna(); else zegt('Hoi ' + res.naam + '!', '#9CC2FF');
      })
      .withFailureHandler(function () { pin.bezig = false; pin.digits = ''; pin.fout = 'Controleren mislukt, probeer opnieuw'; renderPin(); })
      .api(gezinscode, 'controleerOuderPin', [code]);
    return;
  }
  var klus = pin.klus;
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.slot) { toonSlot(res); return; }
      if (res && res.fout) {
        pin.bezig = false; pin.digits = ''; pin.fout = res.fout === 'Verkeerde pincode' ? 'Verkeerde pincode, probeer het nog eens' : res.fout; pin.schud = true;
        renderPin(); return;
      }
      pin = null; nieuweData(res);
      var k = persoon(klus.kind) || { naam: '', kleur: '#ECEEF3' };
      zegt('+' + klus.punten + (klus.punten === 1 ? ' punt' : ' punten') + ' voor ' + k.naam + '!', k.kleur);
    })
    .withFailureHandler(function () { pin.bezig = false; pin.digits = ''; pin.fout = 'Opslaan mislukt, probeer opnieuw'; renderPin(); })
    .api(gezinscode, 'vinkAf', [klus.id, pin.digits]);
}

/* ---------------- bediening ---------------- */

document.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
  if (act === 'tab') { tab = id; toast = null; render(); window.scrollTo(0, 0); return; }
  if (act === 'key') { druk(id); return; }
  if (act === 'nachtWakker') { wakkerTot = Date.now() + WAKKER_MS; render(); return; }
  if (act === 'tabletStand') { zetTabletStand(!tabletStand); return; }
  if (act === 'weekNr') { weekNr = Number(id); render(); return; }
  if (act === 'detail') { detail = id; bewerkA = null; render(); return; }
  if (bewerkA && (act === 'aStatus' || act === 'aBreng' || act === 'aHaal' || act === 'aCat')) {
    var veldA = { aStatus: 'status', aBreng: 'breng', aHaal: 'haal', aCat: 'categorie' }[act];
    bewerkA[veldA] = act === 'aCat' && bewerkA.categorie === id ? '' : id;
    render(); return;
  }
  if (act === 'sluitDetail') { detail = null; bewerkA = null; render(); return; }
  if (act === 'ikOpen') { wieKiezen = true; render(); return; }
  if (act === 'ikKies') { zetIk(id); wieKiezen = false; render(); window.scrollTo(0, 0); return; }
  if (act === 'broodDag') { broodDag = Number(id); render(); return; }
  if (act === 'meeNieuw') { meeForm = { kind: id }; render(); document.getElementById('meeveld').focus(); return; }
  if (act === 'meeSluit') { meeForm = null; render(); return; }
  if (act === 'meeIdee') { voegMeeToe(id); return; }
  if (act === 'meeWissel') {
    (D.meenemen || []).forEach(function (x) { if (x.id === id) x.ingepakt = !x.ingepakt; });
    render(); bewaar('wisselMeenemen', [id]); return;
  }
  if (act === 'meeWeg') {
    D.meenemen = (D.meenemen || []).filter(function (x) { return x.id !== id; });
    render(); bewaar('verwijderMeenemen', [id]); return;
  }
  if (act === 'snee') {
    var deel = id.split('|');
    keuze = { kind: deel[0], maaltijd: deel[1], index: Number(deel[2]) }; render(); return;
  }
  if (act === 'kies' && keuze) {
    var nieuweLijst = broodLijst(keuze.kind, keuze.maaltijd).slice();
    nieuweLijst[keuze.index] = id;
    zetBroodLijst(keuze.kind, keuze.maaltijd, nieuweLijst.filter(Boolean)); return;
  }
  if (act === 'weg' && keuze) {
    var rest = broodLijst(keuze.kind, keuze.maaltijd).slice();
    rest.splice(keuze.index, 1);
    zetBroodLijst(keuze.kind, keuze.maaltijd, rest); return;
  }
  if (act === 'sluit') { keuze = null; render(); return; }
  if (act === 'helpDag') { helpDag = id; render(); return; }
  if (act === 'helpSluit') { helpDag = null; render(); return; }
  if (act === 'helpKind' && helpDag) {
    D.helpers = D.helpers || {};
    var lijstH = (D.helpers[helpDag] || []).slice();
    var plek = lijstH.indexOf(id), aanH = plek < 0;
    if (aanH) lijstH.push(id); else lijstH.splice(plek, 1);
    D.helpers[helpDag] = lijstH; render();
    bewaar('zetHelpen', [helpDag, id, aanH]); return;
  }
  if (act === 'wensKind') { wensKind = wensKind === id ? null : id; render(); if (wensKind) document.getElementById('wens').focus(); return; }
  if (act === 'wensWeg') {
    var weg = function () {
      ouderSessie.tot = Date.now() + 5 * 60000;
      D.wensen = (D.wensen || []).filter(function (w) { return w.id !== id; }); render();
      bewaar('verwijderWens', [id, ouderSessie.pin]);
    };
    if (ouderActief()) weg(); else vraagOuderPin(weg, 'Wens weghalen');
    return;
  }
  if (act === 'rMoment') { routineMoment = id; render(); return; }
  if (act === 'rStap') {
    var rp = id.split('|'), rk = rp[0], rs = rp[1];
    var rl = ((D.routines.stappen[rk] || {})[routineMoment] || []);
    var stap = rl.filter(function (s) { return s.id === rs; })[0]; if (!stap) return;
    stap.gedaan = !stap.gedaan;
    var klaar = rl.every(function (s) { return s.gedaan; });
    if (stap.gedaan && klaar) zegt((routineMoment === 'ochtend' ? 'Ochtendroutine' : 'Avondroutine') + ' klaar! Goed zo ' + (persoon(rk) || {}).naam + '!', (persoon(rk) || {}).kleur);
    else render();
    bewaar('zetRoutine', [rk, rs, stap.gedaan]); return;
  }
  if (act === 'doelOpen') {
    var dd = ((D.spaardoelen || {}).doelen || {})[id];
    spaarForm = { kind: id, doel: dd ? dd.doel : '', punten: dd ? dd.punten : 250, fout: '', focus: true }; render(); return;
  }
  if (act === 'doelSluit') { spaarForm = null; render(); return; }
  if (act === 'doelWeg' && spaarForm) { bewaarSpaar('', 0); return; }
  if (act === 'extraNieuw') { extraForm = { kind: id, wat: '', datum: 'vandaag', voorstel: 2, fout: '', focus: true }; render(); return; }
  if (act === 'xSluit') { extraForm = null; render(); return; }
  if (act === 'xDatum' && extraForm) { extraForm.datum = id; render(); return; }
  if (act === 'xPunt' && extraForm) { extraForm.voorstel = Number(id.split('|')[1]); render(); return; }
  if (act === 'extraIntrek') {
    var xi = (D.extra || []).filter(function (x) { return x.id === id; })[0];
    if (!xi) return;
    if (ouderActief()) { D.extra = D.extra.filter(function (x) { return x.id !== id; }); render(); bewaar('trekExtraIn', [id, ouderSessie.pin]); return; }
    vraagKindPin(xi.kind, 'Aanmelding intrekken: ' + xi.wat, 'trekExtraIn', [id], 'Aanmelding ingetrokken');
    return;
  }
  if (act === 'beoordeelOpen') { openBeoordeel(); return; }
  if (act === 'bSluit') { beoordeel = null; render(); return; }
  if (beoordeel && act === 'bPunt') { var bp = id.split('|'); beoordeel.punten[bp[0]] = Number(bp[1]); render(); return; }
  if (beoordeel && (act === 'bGoed' || act === 'bAf')) {
    if (!ouderActief()) { var nu = beoordeel; beoordeel = null; vraagOuderPin(function () { beoordeel = nu; render(); }, 'Extra klusjes'); return; }
    var x = wachtend().filter(function (y) { return y.id === id; })[0];
    if (!x) return;
    var n = beoordeel.punten[id] !== undefined ? beoordeel.punten[id] : x.voorstel;
    if (act === 'bGoed' && !(n >= 1 && n <= 50)) { beoordeel.fout = 'Kies 1 tot 50 punten'; render(); return; }
    ouderSessie.tot = Date.now() + 5 * 60000;
    x.status = act === 'bGoed' ? 'goed' : 'afgewezen'; x.punten = act === 'bGoed' ? n : 0; x.reden = beoordeel.reden[id] || '';
    beoordeel.fout = '';
    zegt(act === 'bGoed' ? '+' + n + ' punten voor ' + (persoon(x.kind) || {}).naam : 'Afgewezen', act === 'bGoed' ? (persoon(x.kind) || {}).kleur : '#FF8A7A');
    bewaar('beoordeelExtra', [id, act === 'bGoed', n, x.reden, ouderSessie.pin]); return;
  }
  if (beoordeel && act === 'gKind') { beoordeel.geef.kind = id; render(); return; }
  if (beoordeel && act === 'gGeef') {
    var g = beoordeel.geef;
    g.wat = (g.wat || '').trim();
    beoordeel.fout = !g.kind ? 'Kies een kind' : !g.wat ? 'Vul in waarvoor de punten zijn' : !(g.punten >= 1 && g.punten <= 50) ? 'Kies 1 tot 50 punten' : '';
    if (beoordeel.fout) { render(); return; }
    if (!ouderActief()) { var nu2 = beoordeel; beoordeel = null; vraagOuderPin(function () { beoordeel = nu2; render(); }, 'Extra klusjes'); return; }
    ouderSessie.tot = Date.now() + 5 * 60000;
    var gk = persoon(g.kind) || {};
    zegt('+' + g.punten + ' punten voor ' + gk.naam, gk.kleur);
    bewaar('geefExtra', [g.kind, g.wat, g.punten, ouderSessie.pin]);
    beoordeel.geef = { kind: '', wat: '', punten: 5 }; render(); return;
  }
  if (act === 'beheerAan') {
    if (ouderActief()) { beheer = true; render(); } else vraagOuderPin(function () { beheer = true; render(); }, 'Klusjes beheren');
    return;
  }
  if (act === 'beheerUit') { beheer = false; render(); return; }
  if (act === 'klusNieuw') { openKlusForm(null); return; }
  if (act === 'klusEdit') { openKlusForm((D.alleKlusjes || []).filter(function (c) { return c.id === id; })[0]); return; }
  if (klusForm && act.indexOf('kf') === 0) {
    var f = klusForm;
    if (act === 'kfSluit') { klusForm = null; render(); return; }
    if (act === 'kfKind') { var i = f.kinderen.indexOf(id); if (i >= 0) f.kinderen.splice(i, 1); else f.kinderen.push(id); }
    if (act === 'kfPunten') f.punten = Number(id);
    if (act === 'kfIcoon') f.icoon = id;
    if (act === 'kfWanneer') f.wanneer = id;
    if (act === 'kfDag') { var j = f.dagen.indexOf(id); if (j >= 0) f.dagen.splice(j, 1); else f.dagen.push(id); }
    if (act === 'kfVerwijder') {
      if (!f.bevestig) { f.bevestig = true; render(); return; }
      if (!ouderActief()) { vraagOuderPin(function () { render(); }, 'Klusjes beheren'); return; }
      ouderSessie.tot = Date.now() + 5 * 60000;
      klusForm = null; zegt('Klus verwijderd', '#9CC2FF');
      bewaar('verwijderKlus', [f.id, ouderSessie.pin]); return;
    }
    f.fout = ''; f.bevestig = act === 'kfVerwijder' ? f.bevestig : false; render(); return;
  }
  if (act === 'menuAan') { if (ouderActief()) render(); else vraagOuderPin(null, 'Weekmenu aanpassen'); return; }
  if (act === 'menuKlaar') { ouderSessie = null; render(); return; }
  if (act === 'menuDag') {
    var m = D.menu.filter(function (x) { return x.dag === id; })[0];
    var open = function () { menuEdit = { dag: id, waarde: m ? m.gerecht : '' }; render(); };
    if (ouderActief()) open(); else vraagOuderPin(open);
    return;
  }
  if (act === 'menuLeeg' && menuEdit) { opslaanMenu(menuEdit.dag, ''); return; }
  if (act === 'menuSluit') { menuEdit = null; render(); return; }
  if (act === 'eet') {
    var nieuw = VOLGENDE[D.eten[id] || 'onb'];
    D.eten[id] = nieuw; render(); bewaar('zetEten', [id, nieuw]); return;
  }
  if (act === 'gaat' || act === 'breng' || act === 'haal') {
    var e = vindEvent(id); if (!e) return;
    var veld = act === 'gaat' ? 'status' : act;
    var waarde = act === 'gaat' ? VOLGENDE[e.status] : volgendeChauffeur(e[act]);
    e[veld] = waarde; render(); bewaar('zetRit', [e.sleutel, e.titel, veld, waarde, e.datum]); return;
  }
  if (act === 'klus') {
    var c = D.klusjes.filter(function (x) { return x.id === id; })[0];
    if (!c || c.gedaan) return;
    pin = { klus: c, digits: '', fout: '', bezig: false }; render(); return;
  }
  if (act === 'item') {
    D.boodschappen.forEach(function (x) { if (x.id === id) x.gedaan = !x.gedaan; });
    render(); bewaar('wisselBoodschap', [id]); return;
  }
  if (act === 'wis') {
    D.boodschappen = D.boodschappen.filter(function (x) { return !x.gedaan; });
    render(); bewaar('wisAfgevinkteBoodschappen', []); return;
  }
});

document.addEventListener('submit', function (ev) {
  if (ev.target.matches('[data-form="wens"]')) {
    ev.preventDefault();
    var wv = document.getElementById('wens'), wt = wv.value.trim();
    if (!wt || !wensKind) return;
    wv.value = '';
    D.wensen = [{ id: 'tijdelijk' + Date.now(), datum: D.vandaag, kind: wensKind, wens: wt }].concat(D.wensen || []);
    var wk = wensKind; wensKind = null;
    zegt('Wens doorgegeven!', (persoon(wk) || {}).kleur);
    bewaar('voegWensToe', [wk, wt]); return;
  }
  if (ev.target.matches('[data-form="slot"]')) {
    ev.preventDefault();
    var c = document.getElementById('slotcode').value.trim();
    if (c && !slotBezig) probeerCode(c);
    return;
  }
  if (ev.target.matches('[data-form="spaar"]')) {
    ev.preventDefault();
    var sf = spaarForm; if (!sf) return;
    sf.doel = document.getElementById('s-doel').value.trim();
    sf.punten = Math.round(Number(document.getElementById('s-punten').value));
    sf.fout = !sf.doel ? 'Vul in waar je voor spaart' : !(sf.punten >= 1 && sf.punten <= 10000) ? 'Kies 1 tot 10.000 punten' : '';
    if (sf.fout) { render(); return; }
    bewaarSpaar(sf.doel, sf.punten); return;
  }
  if (ev.target.matches('[data-form="extra"]')) {
    ev.preventDefault();
    var f = extraForm; if (!f) return;
    f.wat = document.getElementById('x-wat').value.trim();
    f.voorstel = Math.round(Number(document.getElementById('x-punten').value));
    f.fout = !f.wat ? 'Vul in wat je gedaan hebt' : !(f.voorstel >= 1 && f.voorstel <= 50) ? 'Kies 1 tot 50 punten' : '';
    if (f.fout) { render(); return; }
    var datum = f.datum === 'gisteren' ? gisteren() : D.vandaag;
    extraForm = null;
    vraagKindPin(f.kind, f.wat + ' · voorstel ' + f.voorstel + ' punten', 'meldExtra', [f.kind, f.wat, datum, f.voorstel], 'Aangemeld! Papa of mama kijkt ernaar');
    return;
  }
  if (ev.target.matches('[data-form="afspraak"]')) { ev.preventDefault(); bewaarAfspraak(); return; }
  if (ev.target.matches('[data-form="mee"]')) { ev.preventDefault(); voegMeeToe(document.getElementById('meeveld').value); return; }
  if (ev.target.matches('[data-form="klus"]')) { ev.preventDefault(); if (klusForm) bewaarKlus(); return; }
  if (ev.target.matches('[data-form="menu"]')) {
    ev.preventDefault();
    if (menuEdit) opslaanMenu(menuEdit.dag, document.getElementById('menuveld').value.trim().slice(0, 60));
    return;
  }
  if (!ev.target.matches('[data-form="toevoegen"]')) return;
  ev.preventDefault();
  var veld = document.getElementById('nieuw');
  var tekst = veld.value.trim();
  if (!tekst) return;
  veld.value = '';
  D.boodschappen.unshift({ id: 'tijdelijk' + Date.now(), item: tekst, gedaan: false });
  render(); document.getElementById('nieuw').focus();
  bewaar('voegBoodschapToe', [tekst]);
});

document.addEventListener('keydown', function (ev) {
  if ((keuze || detail || menuEdit || klusForm || helpDag || meeForm || extraForm || beoordeel || spaarForm) && !pin && ev.key === 'Escape') { keuze = null; detail = null; bewerkA = null; menuEdit = null; klusForm = null; helpDag = null; meeForm = null; extraForm = null; beoordeel = null; spaarForm = null; render(); return; }
  if (!pin) return;
  if (/^[0-9]$/.test(ev.key)) druk(ev.key);
  else if (ev.key === 'Backspace') druk('Wis');
  else if (ev.key === 'Escape') druk('Annuleer');
});

document.addEventListener('input', function (ev) {
  if (ev.target.id === 'menuveld' && menuEdit) menuEdit.waarde = ev.target.value;
  if (ev.target.id === 'a-notitie' && bewerkA) bewerkA.notitie = ev.target.value;
  if (extraForm && ev.target.id === 'x-wat') extraForm.wat = ev.target.value;
  if (spaarForm && ev.target.id === 's-doel') spaarForm.doel = ev.target.value;
  if (spaarForm && ev.target.id === 's-punten') { spaarForm.punten = ev.target.value; var se = document.getElementById('s-euro'); if (se) se.textContent = '= ' + euro(Number(ev.target.value) || 0); }
  if (extraForm && ev.target.id === 'x-punten') extraForm.voorstel = Number(ev.target.value);
  if (beoordeel && ev.target.getAttribute('data-bp')) beoordeel.punten[ev.target.getAttribute('data-bp')] = Number(ev.target.value);
  if (beoordeel && ev.target.getAttribute('data-br')) beoordeel.reden[ev.target.getAttribute('data-br')] = ev.target.value;
  if (beoordeel && ev.target.id === 'g-wat') beoordeel.geef.wat = ev.target.value;
  if (beoordeel && ev.target.id === 'g-punten') beoordeel.geef.punten = Number(ev.target.value);
  if (ev.target.id === 'kf-klus' && klusForm) klusForm.klus = ev.target.value;
  if (ev.target.id === 'kf-datum' && klusForm) klusForm.datum = ev.target.value;
});

document.addEventListener('visibilitychange', function () { if (!document.hidden) { ververs(); houdSchermAan(); } });
// In de nachtstand: elke tik houdt het gewone dashboard nog even open; daarna terug naar de nachtstand.
['pointerdown', 'keydown'].forEach(function (soort) {
  document.addEventListener(soort, function () { if (tabletStand && isNacht() && Date.now() < wakkerTot) wakkerTot = Date.now() + WAKKER_MS; }, true);
});
var wasNacht = toonNacht();
setInterval(function () {
  var nu = toonNacht();
  if (nu || nu !== wasNacht) render();   // klok bijwerken, of wisselen tussen dag- en nachtstand
  wasNacht = nu;
}, 20000);
houdSchermAan();
setInterval(ververs, 60000);          // elke minuut verversen, zodat tablet en telefoons gelijk lopen
setInterval(function () { if (!toast) render(); }, 5 * 60000); // "volgende melding" bijwerken

var wasMobiel = isMobiel();
window.addEventListener('resize', function () {
  if (isMobiel() !== wasMobiel) { wasMobiel = isMobiel(); render(); }
});
if (vergrendeld && gezinscode) probeerCode(gezinscode, true);
if (uitGeheugen) setTimeout(ververs, 50);   // meteen tonen wat er was, en direct bijwerken
if (!vergrendeld && isMobiel() && !ik) wieKiezen = true;
render();
</script>
