<html lang="nl">
<head>

<style>
:root{--bg:#101218;--card:#191C24;--card2:#20242E;--line:#2A2E39;--text:#ECEEF3;--muted:#A3AABA;--dim:#8F97A8;--ja:#4ADE80;--nee:#FF8A7A;--onb:#B4BAC8;--warn:#F2C14E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #9CC2FF;outline-offset:2px}
.app{max-width:1400px;margin:0 auto;padding:22px 28px 28px;display:flex;flex-direction:column;gap:18px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.datum{font-size:30px;font-weight:900;letter-spacing:-.5px}
.kopblok{display:flex;align-items:center;gap:16px;min-width:0}
.hklok{font-size:40px;font-weight:900;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums;padding-right:16px;border-right:2px solid var(--line)}
@media (min-width:761px) and (max-width:1400px){.kopblok .datum{font-size:22px;white-space:nowrap}.kopblok .sub{font-size:13px}.hklok{font-size:34px}}
@media (max-width:760px){.hklok{font-size:26px;padding-right:10px}.kopblok{gap:10px}.kopblok .datum{font-size:19px}}
.nulijn{display:flex;align-items:center;gap:8px;margin:2px 0}
.nutijd{flex:0 0 auto;height:22px;padding:0 8px;border-radius:11px;background:var(--nu,#FF6B6B);color:#101218;font-size:12px;font-weight:900;display:inline-flex;align-items:center}
.nustreep{flex:1;height:2px;border-radius:1px;background:var(--nu,#FF6B6B);position:relative}
.nustreep::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--nu,#FF6B6B)}
.event.voorbij{opacity:.45}
.event.bezig{background:rgba(255,255,255,.04);border-radius:12px;box-shadow:inset 3px 0 0 var(--nu,#FF6B6B);padding-left:10px !important;margin-left:-10px}
.bezigtag{display:block;font-size:11px;font-weight:900;color:var(--nu,#FF8A8A);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.sub{font-size:15px;color:var(--muted);font-weight:700}
nav{display:flex;gap:8px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 18px;border-radius:26px;border:none;background:#1E222C;color:#C9CEDA;font-size:16px;font-weight:800}

.status{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:190px}
.toast{font-size:18px;font-weight:900;padding:10px 16px;border-radius:14px}
.card{background:var(--card);border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:22px;font-weight:900}
.kop{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.klein{font-size:13px;color:var(--muted);font-weight:700}
.grid-vandaag{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start}
.kolom{display:flex;flex-direction:column;gap:20px;min-width:0}
.event{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.tijd{width:72px;font-size:18px;font-weight:900}
.etitel{flex:1 1 160px;min-width:0}

.wie{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);font-weight:700;margin-top:4px;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:44px;padding:0 14px;border-radius:22px;border:1.5px solid;font-size:14px;font-weight:800;white-space:nowrap}

.eter{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:16px;border:1.5px solid}

.wkop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wkop h1{margin:0;font-size:28px;font-weight:900}
.wklok{font-size:34px;font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums}

.wuren{display:flex}
.wuur{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px}

.wuur b{font-size:14px;font-weight:900}
.wgrafiek{width:100%;height:110px;display:block}
.wkwartier{display:flex;align-items:flex-end;gap:4px;height:110px}
.wkwartier>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.wkwartier .b{width:60%;border-radius:4px 4px 0 0;background:#2A2E39}
.wkwartier .b.nat{background:#64A8FF}

.wfietsen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wfiets{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:#20242E}
.wfiets .kk{font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.wfiets b{font-size:24px;font-weight:900}
@media (max-width:900px){.wgrid{grid-template-columns:1fr}.wgrid>.kolom{display:contents}.wkaart.o1{order:1}.wkaart.o2{order:2}.wkaart.o3{order:3}.wkaart.o4{order:4}.wkaart.o5{order:5}.weerscherm{padding:14px 12px 24px}.wkop h1{font-size:22px}.wklok{font-size:24px}.wfietsen{grid-template-columns:1fr}.wuur:nth-child(n+7){display:none}.wgrafiek{display:none}.wnu b{font-size:46px}}

.okcats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
.okcat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;padding:8px 4px;border-radius:14px;border:1.5px solid #323745;background:#20242E;color:var(--text);font-size:12px;font-weight:800}

.mdagnaam{font-size:13px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:0 4px;display:flex;align-items:center}
.mweek{display:flex;flex-direction:column;justify-content:center;gap:2px;border:none;border-radius:14px;background:transparent;color:var(--text);text-align:left;padding:4px}

.mweek span{font-size:12px;font-weight:700;color:var(--dim)}
.mcel{min-height:112px;min-width:0;background:var(--card);border-radius:12px;border-top:3px solid transparent;padding:6px 6px 8px;display:flex;flex-direction:column;gap:3px}

.mkop{display:flex;align-items:baseline;gap:5px;padding:0 2px 2px}

 .mlrij{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line)}.mld{width:62px;flex:0 0 auto;font-size:14px;font-weight:900;display:flex;align-items:center}
 .mlev{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.mlev .mev{font-size:14px;padding:6px 8px}}

.okkop{font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--dim);padding:10px 0 4px}

  return {
    withSuccessHandler: function (f) { return maak(f, mislukt); },
    withFailureHandler: function (f) { return maak(gelukt, f); },

      }

      var stop = window.AbortController ? new AbortController() : null;
      var wekker = setTimeout(function () { if (stop) stop.abort(); }, 30000);
      fetch(WEBAPP_LINK, {
        method: 'POST', redirect: 'follow', credentials: 'omit', signal: stop ? stop.signal : undefined,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ code: code, fn: fn, args: args || [] })

}

    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ---------------- tabletstand: scherm aan houden + nachtstand ---------------- */
var tabletStand = (function () { try { return localStorage.getItem('gezinsdashboard-tablet') === '1'; } catch (e) { return false; } })();
var wekker = null;            // de 'scherm aan'-vergrendeling van de browser

var KLOK_NA_MS = 5 * 60000;

function houdSchermAan(klaar) {
  if (!tabletStand || document.hidden) return;
  if (wekker) { if (klaar) klaar(true); return; }
  if (!navigator.wakeLock) { if (klaar) klaar(false); return; }
  navigator.wakeLock.request('screen').then(function (l) {
    wekker = l;
    l.addEventListener('release', function () { wekker = null; });
    if (klaar) klaar(true);
  }, function () { if (klaar) klaar(false); });   // niet toegestaan: dan geldt de gewone time-out van de tablet
}
function laatSchermLos() { if (wekker) { try { wekker.release(); } catch (e) {} wekker = null; } }
function zetTabletStand(aan) {
  tabletStand = aan;
  try { localStorage.setItem('gezinsdashboard-tablet', aan ? '1' : '0'); } catch (e) {}
  if (!aan) { laatSchermLos(); zegt('Tabletstand uit', '#C9B8FF'); return; }
  houdSchermAan(function (gelukt) {
    zegt(gelukt ? 'Tabletstand aan: scherm blijft aan' : 'Tabletstand aan (scherm aan houden lukt niet in deze browser: zet "Actief blijven" aan op de tablet)', '#C9B8FF');
  });
}

function nachtTijden() { return (D && D.nacht) || { van: '20:00', tot: '07:00' }; }

  var n = new Date(), nu = n.getHours() * 60 + n.getMinutes();
  var van = minuten(nachtTijden().van), tot = minuten(nachtTijden().tot);

/** Klokscherm (screensaver): overdag met wat er vandaag nog komt, 's nachts gedimd met de dag erna. */
function renderNacht() {
  var n = new Date();
  var klok = ('0' + n.getHours()).slice(-2) + ':' + ('0' + n.getMinutes()).slice(-2);
  var nu = klok;

  var weerTekst = function (w) {
    return w ? '<span class="nacht-weer">' + svg(w.icoon, 18) + esc(w.tekst) + ' · ' + w.min + '–' + w.max + '°' + (w.kans >= 30 ? ' · ' + w.kans + '% regen' : '') + '</span>' : '';
  };
  if (nacht) {
    // 's Avonds de dag van morgen; na middernacht de dag die dan begint.
    var datum = n.getHours() < 12 ? D.vandaag : D.morgen;
    var dag = dagen.filter(function (d) { return d.datum === datum; })[0];
    var ev = dag ? dag.events : [];
    blokken += '<div class="nacht-blok"><div class="nacht-kop">' + (n.getHours() < 12 ? 'Vandaag' : 'Morgen') + (dag ? ' · ' + esc(dag.dag + ' ' + dag.nr) : '') + ' ' + weerTekst(weerVoor(datum)) + '</div>' +
      (ev.slice(0, 5).map(nachtRij).join('') || '<div class="nacht-rij">Geen afspraken</div>') +
      (ev.length > 5 ? '<div class="nacht-hint">en nog ' + (ev.length - 5) + ' meer</div>' : '') + '</div>';
    var mee = (D.meenemen || []).filter(function (x) { return x.datum === datum && !x.ingepakt; });
    if (mee.length) blokken += '<div class="nacht-blok"><div class="nacht-kop">' + svg('tas', 16) + 'Mee naar school</div>' +
      mee.map(function (x) { var k = persoon(x.kind) || { naam: '', kleur: '#555' }; return '<div class="nacht-rij"><span><span class="nacht-dot" style="background:' + esc(k.kleur) + '"></span>' + esc(k.naam) + ': ' + esc(x.wat) + '</span></div>'; }).join('') + '</div>';
  } else {
    var w = D.weer && D.weer.nu ? D.weer.nu : null;
    var vd = weerVoor(D.vandaag);
    var nog = vandaagEvents().filter(function (e) { return e.heleDag || e.tijd >= nu; });
    blokken += '<div class="nacht-blok"><div class="nacht-kop">Nog vandaag' +
      (w ? ' <span class="nacht-weer">' + svg(w.icoon, 18) + w.temp + '° · ' + esc(w.tekst) + (vd ? ' · ' + vd.min + '–' + vd.max + '°' : '') + '</span>' : '') + '</div>' +
      (nog.slice(0, 5).map(nachtRij).join('') || '<div class="nacht-rij">Geen afspraken meer</div>') +
      (nog.length > 5 ? '<div class="nacht-hint">en nog ' + (nog.length - 5) + ' meer</div>' : '') + '</div>';
    var m = menuItem(D.vandaag);
    var eters = D.gezin.filter(function (p) { return D.eten[p.id] === 'ja'; }).length;
    if (m && m.gerecht) blokken += '<div class="nacht-blok"><div class="nacht-rij">' + svg('eten', 18) + '<span>Vanavond: ' + esc(m.gerecht) +
      '<div class="w">' + eters + (eters === 1 ? ' eter' : ' eters') + ' aangemeld</div></span></div></div>';
  }
  document.getElementById('app').innerHTML = '<div class="nacht' + (nacht ? ' donker' : '') + '" data-act="nachtWakker" role="button" aria-label="Klokscherm. Tik om het dashboard te openen">' +
    '<div class="nacht-in"><div class="nacht-klok">' + klok + '</div><div class="nacht-datum">' + dagStip(D.vandaag, 12) + esc(hoofdletter(D.datumTekst || '')) + '</div>' +
    afvalKlok() + aftelKlok() + blokken + '<div class="nacht-hint">Tik om het dashboard te openen</div></div></div>';
  document.getElementById('laag').innerHTML = '';

/* Tegen inbranden: het hele klokscherm zwerft langzaam over het scherm (elke minuut een stukje verder),
   zodat geen pixel urenlang hetzelfde toont. */
function verschuifKlok() {
  var box = document.querySelector('.nacht-in');
  if (!box) return;
  var vrijX = Math.max(0, window.innerWidth - box.offsetWidth - 48), vrijY = Math.max(0, window.innerHeight - box.offsetHeight - 48);
  var t = Math.floor(Date.now() / 60000);
  var fx = (Math.sin(t * 0.37) + 1) / 2, fy = (Math.sin(t * 0.23 + 1) + 1) / 2;
  box.style.transform = 'translate(' + Math.round(fx * vrijX - vrijX / 2) + 'px,' + Math.round(fy * vrijY - vrijY / 2) + 'px)';
}

function versieCheck() {
  if (!D || !D.versie || D.versie === VERSIE || D.versie < VERSIE) return;

/* De afspraken van vandaag met een lijn op het huidige tijdstip. Voorbije afspraken worden lichter,
   een afspraak die nu bezig is krijgt een markering. */
function nuTijd() { var n = new Date(); return ('0' + n.getHours()).slice(-2) + ':' + ('0' + n.getMinutes()).slice(-2); }
function metNuLijn(lijst) {
  var nu = nuTijd(), html = '', lijnGezet = false;
  var kl = dagKleur(D.vandaag);   // de lijn heeft de schoolkleur van vandaag
  var lijn = '<div class="nulijn" style="--nu:' + kl + '" aria-label="Nu ' + nu + '"><span class="nutijd">' + nu + '</span><span class="nustreep"></span></div>';
  lijst.forEach(function (e) {
    if (!e.heleDag && !lijnGezet && e.tijd > nu) { html += lijn; lijnGezet = true; }
    var overNacht = e.eind && e.eind < e.tijd;   // loopt door na middernacht
    var status = e.heleDag ? '' : (e.eind && !overNacht && e.eind <= nu) ? 'voorbij' : (e.tijd <= nu) ? 'bezig' : '';
    html += status === 'bezig' ? afspraakRij(e, false, status).replace('<div class="event', '<div style="--nu:' + kl + '" class="event') : afspraakRij(e, false, status);
  });
  if (!lijnGezet) html += lijn;
  return html;
}

/** Wat er nu over afval te melden is. Kampen: bak op de ophaaldag tussen 6:00 en 7:30 buiten, vóór 20:00 weer binnen. */

/* ---------------- aftelkalender ---------------- */

  return '<button type="button" class="weerbalk weerknop" data-act="weerOpen" aria-label="Weer in ' + esc(w.plaats) + ', tik voor meer"><span class="nu">' + svg(w.nu.icoon, 24) + w.nu.temp + '°</span>' +
    '<span>' + esc(w.nu.tekst) + ' · ' + d.min + '–' + d.max + '°</span>' +
    (h < 12 ? deel('ochtend', d.ochtend) : '') + (h < 18 ? deel('middag', d.middag) : '') + deel('avond', d.avond) +
    d.tips.map(function (t) { return '<span class="weertip">' + esc(t) + '</span>'; }).join('') + '<span class="weermeer">Meer ›</span></button>';
}

function doelBlok(k, tegoed) {
  var s = (D.spaardoelen || {}), d = (s.doelen || {})[k.id];
  if (!d) return '<div class="doelblok"><button type="button" class="doelknop" data-act="doelOpen" data-id="' + esc(k.id) + '">' + svg('doel', 16) + 'Spaardoel kiezen</button></div>';
  var pct = Math.max(0, Math.min(100, tegoed / d.punten * 100));
  var nog = d.punten - tegoed, tempo = (s.perDag || {})[k.id] || 0;
  var tekst = nog <= 0 ? '<b style="color:var(--ja)">Doel bereikt!</b>' :
    'Nog ' + nog + ' punten' + (tempo > 0 ? ' · ' + (Math.ceil(nog / tempo) > 365 ? 'nog meer dan een jaar sparen' : 'ongeveer ' + Math.ceil(nog / tempo) + (Math.ceil(nog / tempo) === 1 ? ' dag' : ' dagen')) : '');
  return '<div class="doelblok"><button type="button" class="doelknop" data-act="doelOpen" data-id="' + esc(k.id) + '" style="border:none;padding:0;min-height:30px;color:var(--text)" aria-label="Spaardoel aanpassen: ' + esc(d.doel) + '">' +
    '<span class="titel">' + svg('doel', 16) + esc(d.doel) + '</span></button>' +
    '<div class="balk" style="height:8px;flex:none"><div style="width:' + pct + '%;background:' + esc(k.kleur) + '"></div></div>' +
    '<div class="klein" style="font-size:12px">' + tegoed + ' van ' + d.punten + ' punten (' + euro(d.punten) + ') · ' + tekst + '</div></div>';
}

function renderSpaar(laag) {
  var f = spaarForm, k = persoon(f.kind) || { naam: '?', kleur: '#ECEEF3' };
  var heeft = !!((D.spaardoelen || {}).doelen || {})[f.kind];
  laag.innerHTML = '<div class="overlay"><form class="detailbox klusform" data-form="spaar" role="dialog" aria-modal="true" aria-label="Spaardoel">' +
    '<div class="rij" style="gap:12px">' + av(k, 48) + '<h2>Waar spaar jij voor?</h2></div>' +
    '<div class="invoer"><label class="sr" for="s-doel">Spaardoel</label><input id="s-doel" type="text" maxlength="60" autocomplete="off" placeholder="Bijv. LEGO-set" value="' + esc(f.doel) + '"></div>' +
    '<div class="veldlabel">Hoeveel punten heb je nodig? <span class="klein">25 punten = € 1</span></div>' +
    '<div class="invoer" style="align-items:center"><label class="sr" for="s-punten">Punten</label><input id="s-punten" class="puntveld" style="width:120px!important" type="number" inputmode="numeric" min="1" max="10000" value="' + esc(f.punten) + '">' +
    '<span class="klein" id="s-euro">= ' + euro(Number(f.punten) || 0) + '</span></div>' +
    '<div class="fout" style="text-align:left">' + esc(f.fout || '') + '</div>' +
    '<div class="chips"><button type="submit" class="knop">Opslaan</button>' +
    (heeft ? '<button type="button" class="knop2" data-act="doelWeg" style="align-self:center">Doel weghalen</button>' : '') +
    '<button type="button" class="knop2" data-act="doelSluit" style="align-self:center">Annuleren</button></div></form></div>';
  if (f.focus) { f.focus = false; document.getElementById('s-doel').focus(); }
}

function bewaarSpaar(doel, punten) {
  var f = spaarForm; spaarForm = null;
  var k = persoon(f.kind) || {};
  if (ouderActief()) {
    zegt(punten ? 'Spaardoel opgeslagen' : 'Spaardoel weggehaald', k.kleur);
    bewaar('zetSpaardoel', [f.kind, doel, punten, ouderSessie.pin]); return;
  }
  vraagKindPin(f.kind, punten ? 'Spaardoel: ' + doel + ' (' + punten + ' punten)' : 'Spaardoel weghalen', 'zetSpaardoel', [f.kind, doel, punten],
    punten ? 'Spaardoel opgeslagen!' : 'Spaardoel weggehaald');
}

function pil(kleur, tekst, open) {
  return '<span class="pil' + (open ? ' open' : '') + '" style="color:' + esc(kleur) + ';border-color:' + esc(kleur) + (open ? ';background:rgba(242,193,78,.10)' : '') + '">' + esc(tekst) + '</span>';
}

/** Eén afspraak op Vandaag: alleen tonen, aanpassen via het potlood. */
function afspraakRij(e, morgen, status) {
  var wie = e.wie.map(persoon).filter(Boolean);
  var wieHtml = wie.length ? wie.map(function (p) { return '<span class="dot" style="background:' + esc(p.kleur) + '"></span>'; }).join('') +
    '<span>' + esc(wie.map(function (p) { return p.naam; }).join(' & ')) + '</span>' : '<span>Gezin</span>';
  var cat = e.categorie ? '<span class="cat">' + svg(e.categorie, 12) + esc(catNaam(e.categorie)) + '</span>' : '';
  var notitie = e.notitie ? '<span class="notitie" title="' + esc(e.notitie) + '">' + svg('notitie', 13) + '<span>' + esc(e.notitie) + '</span></span>' : '';
  var pillen = '';
  if (e.kind && !e.heleDag) {
    var b = e.breng && persoon(e.breng), h = e.haal && persoon(e.haal);
    pillen = '<div class="pillen">' + (morgen ? '' : pil(ST[e.status].c, GAAT_L[e.status])) +
      pil(b ? b.kleur : '#F2C14E', 'Breng: ' + (b ? b.naam : '?'), !b) + pil(h ? h.kleur : '#F2C14E', 'Haal: ' + (h ? h.naam : '?'), !h) + '</div>';
  }
  return '<div class="event' + (morgen ? ' morgen' : '') + (status ? ' ' + status : '') + '"><div class="tijd">' + esc(e.heleDag ? 'Hele dag' : e.tijd) +
    (status === 'bezig' ? '<span class="bezigtag">nu bezig</span>' : '') + '</div>' +
    '<div class="etitel"><b>' + esc(e.titel) + '</b><div class="wie">' + wieHtml + cat + notitie + '</div></div>' + pillen +
    '<button type="button" class="potloodknop" data-act="detail" data-id="' + esc(e.sleutel) + '" aria-label="' + esc(e.titel) + ' bewerken">' + svg('potlood', 18) + '</button></div>';
}

function ritChip(e, veld, label) {
  var p = e[veld] ? persoon(e[veld]) : null;
  var stijl = p ? 'color:' + esc(p.kleur) + ';border-color:' + esc(p.kleur) + ';background:rgba(255,255,255,.04)' :
    'color:var(--warn);border-color:var(--warn);background:rgba(242,193,78,.10)';
  return '<button type="button" class="chip' + (p ? '' : ' open') + '" data-act="' + veld + '" data-id="' + esc(e.sleutel) + '" style="' + stijl +
    '" aria-label="' + (veld === 'breng' ? 'Wie brengt' : 'Wie haalt') + ': ' + (p ? esc(p.naam) : 'nog niemand') + ', tik om te wisselen">' + label + ': ' + (p ? esc(p.naam) : '?') + '</button>';
}

function klusjes() {
  if (beheer && ouderBeheer()) return klusBeheer();
  beheer = false;
  var kaarten = zichtbareKinderen().map(function (k) {
    var pts = D.punten[k.id] || 0;
    var rest = pts < 0 ? 25 - pts : 25 - (pts % 25);
    var maat = k.leeftijd && k.leeftijd < 6 ? 52 : k.leeftijd && k.leeftijd < 8 ? 46 : 36;
    var lijst = D.klusjes.filter(function (c) { return c.kind === k.id; });
    var knoppen = lijst.map(function (c) {
      var dots = ''; for (var i = 0; i < c.punten; i++) dots += '<span style="background:' + (c.gedaan ? '#4A5060' : esc(k.kleur)) + '"></span>';
      var af = c.afgekeurd;
      return '<button type="button" class="klus' + (c.gedaan ? ' isaf' : '') + (af ? ' afgekeurd' : '') + '" data-act="' + (c.gedaan ? 'klusStraf' : 'klus') + '" data-id="' + esc(c.id) + '"' + (af ? ' disabled' : '') +
        ' aria-label="' + esc(c.klus) + ', ' + c.punten + (c.punten === 1 ? ' punt' : ' punten') + (af ? ', niet echt gedaan' : c.gedaan ? ', gedaan. Ouder of oppas: tik als hij niet echt gedaan is' : '') + '">' +
        '<span class="icoon" style="width:' + maat + 'px;height:' + maat + 'px;background:' + (af ? 'rgba(255,138,122,.16)' : c.gedaan ? 'rgba(74,222,128,.16)' : esc(k.kleur) + '26') + ';color:' + (af ? 'var(--nee)' : c.gedaan ? 'var(--ja)' : esc(k.kleur)) + '">' +
        svg(af ? 'kruis' : c.gedaan ? 'vink' : c.icoon, maat > 40 ? 28 : 22, c.gedaan ? 2.5 : 2) + '</span>' +
        '<span class="ktekst' + (maat === 52 ? ' klein-label' : '') + '"><span class="kt">' + esc(c.klus) + '</span>' +
        (af ? '<span class="kmeta straf">niet echt gedaan · −' + af + '</span>' :
          c.aanbod ? '<span class="kmeta wacht">wacht op ' + esc((persoon(c.aanbod.naar) || {}).naam || '') + '</span>' :
          c.van ? '<span class="kmeta">van ' + esc((persoon(c.van) || {}).naam || '') + '</span>' : '') +
        '</span><span class="pdots">' + dots + '</span></button>';
    }).join('');
    return '<section class="card" style="padding:18px"><div class="rij" style="gap:10px">' + av(k, 44) +
      '<div><div style="font-size:18px;font-weight:900">' + esc(k.naam) + '</div><div class="klein">' + (k.leeftijd ? k.leeftijd + ' jaar' : '') + '</div></div></div>' +
      '<div class="spaar"><div><span class="pts" style="color:' + esc(k.kleur) + '">' + pts + '</span> <span class="klein" style="font-size:14px">punten</span></div>' +
      '<div style="font-size:15px;font-weight:800">' + euro(pts) + ' tegoed</div>' +
      '<div class="klein" style="font-size:12px">Verdiend ' + euro((D.verdiend || {})[k.id] || 0) + ' · uitbetaald ' + euro((D.uitbetaald || {})[k.id] || 0) + '</div>' +
      '<div class="balk"><div style="width:' + (pts < 0 ? 0 : (25 - rest) / 25 * 100) + '%;background:' + esc(k.kleur) + '"></div></div>' +
      '<div class="klein" style="font-size:12px">Nog ' + rest + ' punten tot de volgende euro</div>' + doelBlok(k, pts) + '</div>' +
      aanbodBlok(k) + (knoppen || '<div class="leegtekst">Vandaag geen klusjes</div>') + extraLijst(k) + '</section>';
  }).join('');
  var metOuders = !mijnKind();
  return '<main style="display:flex;flex-direction:column;gap:14px">' + wachtBalk() + '<div class="kids">' + kaarten + '</div>' + (metOuders ? ouderKolom() : '') +
    '<div class="voet" style="align-items:center"><span>Tik op een klus en typ je pincode om hem af te vinken. 1–3 punten per klus · 25 punten = € 1</span>' +
    '<span class="chips"><button type="button" class="knop2" data-act="beoordeelOpen">+ Extra punten geven</button>' +
    '<button type="button" class="knop2" data-act="beheerAan" style="display:inline-flex;align-items:center;gap:8px">' + svg('potlood', 18) + 'Klusjes beheren</button></span></div></main>';
}

/** Klusjes die een broer of zus aan dit kind wil geven. */
function aanbodVoor(k) { return D.klusjes.filter(function (c) { return c.aanbod && c.aanbod.naar === k.id && !c.gedaan; }); }
function aanbodBlok(k) {
  return aanbodVoor(k).map(function (c) {
    var van = persoon(c.kind) || { naam: '', kleur: '#9AA1B2' };
    return '<div class="aanbod">' + av(van, 32) + '<div class="at"><b>' + esc(van.naam) + ' geeft je ' + esc(c.klus) + '</b>' +
      '<span class="klein">+' + c.punten + (c.punten === 1 ? ' punt' : ' punten') + ' als jij hem doet</span></div>' +
      '<div class="ak"><button type="button" class="knop" data-act="aanbodJa" data-id="' + esc(c.id) + '">Overnemen</button>' +
      '<button type="button" class="knop2" data-act="aanbodNee" data-id="' + esc(c.id) + '">Nee</button></div></div>';
  }).join('');
}

function wachtend() { return (D.extra || []).filter(function (x) { return x.status === 'wacht'; }); }

function wachtBalk() {
  var w = wachtend();
  var mk = mijnKind();
  if (mk) w = w.filter(function (x) { return x.kind === mk.id; });
  if (!w.length || mk) return '';
  return '<div class="wachtbalk"><span>' + w.length + (w.length === 1 ? ' extra klus wacht' : ' extra klusjes wachten') + ' op goedkeuring</span>' +
    '<button type="button" class="knop" data-act="beoordeelOpen" style="height:44px">Beoordelen</button></div>';
}

function gisteren() {
  var p = D.vandaag.split('-').map(Number);
  var d = new Date(Date.UTC(p[0], p[1] - 1, p[2] - 1));
  return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2);
}

function dagLabel(d) { return d === D.vandaag ? 'vandaag' : datumKort(d); }

/** Extra klusjes van één kind (laatste 14 dagen) + knop om er een aan te melden. */
function extraLijst(k) {
  var mag = (D.extraKinderen || []).indexOf(k.id) >= 0;
  var mijn = (D.extra || []).filter(function (x) { return x.kind === k.id; });
  var lijst = mijn.filter(function (x) { return x.status === 'wacht'; }).concat(mijn.filter(function (x) { return x.status !== 'wacht'; })).slice(0, 5);
  var rijen = lijst.map(function (x) {
    var st = x.status === 'goed' ? '<span class="klein" style="color:var(--ja)">✓ Goedgekeurd: +' + x.punten + ' punten</span>' :
      x.status === 'afgewezen' ? '<span class="klein" style="color:var(--nee)">Afgewezen' + (x.reden ? ': ' + esc(x.reden) : '') + '</span>' :
      '<span class="klein">Wacht op goedkeuring · voorstel ' + x.voorstel + ' punten</span>';
    return '<div class="xrij ' + esc(x.status) + '"><span class="xw">' + esc(x.wat) + ' <span class="klein" style="display:inline;color:var(--muted)">(' + dagLabel(x.datum) + ')</span>' + st + '</span>' +
      (x.status === 'wacht' ? '<button type="button" class="xknop" data-act="extraIntrek" data-id="' + esc(x.id) + '" aria-label="Aanmelding ' + esc(x.wat) + ' intrekken">×</button>' : '') + '</div>';
  }).join('');
  if (!mag && !rijen) return '';
  return '<div class="maal" style="background:transparent;padding:4px 0 0"><div class="kop"><span class="mtitel">Extra gedaan</span></div>' + rijen +
    (mag ? '<button type="button" class="snee plus" data-act="extraNieuw" data-id="' + esc(k.id) + '">+ Ik heb iets extra gedaan</button>' : '') + '</div>';
}

function puntKeuze(act, id, huidig) {
  return '<div class="chips">' + EXTRA_SNEL.map(function (n) {
    return '<button type="button" class="keuze" data-act="' + act + '" data-id="' + esc(id + '|' + n) + '" aria-pressed="' + (Number(huidig) === n) + '">' + n + '</button>';
  }).join('') + '</div>';
}

function renderExtraForm(laag) {
  var f = extraForm, k = persoon(f.kind) || { naam: '?', kleur: '#ECEEF3' };
  laag.innerHTML = '<div class="overlay"><form class="detailbox klusform" data-form="extra" role="dialog" aria-modal="true" aria-label="Extra klus aanmelden">' +
    '<div class="rij" style="gap:12px">' + av(k, 48) + '<h2>Wat heb je extra gedaan?</h2></div>' +
    '<div class="invoer"><label class="sr" for="x-wat">Wat heb je gedaan?</label><input id="x-wat" type="text" maxlength="80" autocomplete="off" placeholder="Bijv. auto gewassen, oppassen op Iselin" value="' + esc(f.wat) + '"></div>' +
    '<div class="veldlabel">Wanneer?</div><div class="chips">' + [['vandaag', 'Vandaag'], ['gisteren', 'Gisteren']].map(function (o) {
      return '<button type="button" class="keuze" data-act="xDatum" data-id="' + o[0] + '" aria-pressed="' + (f.datum === o[0]) + '">' + o[1] + '</button>';
    }).join('') + '</div>' +
    '<div class="veldlabel">Hoeveel punten vind jij het waard? <span class="klein">Papa of mama beslist (25 punten = € 1)</span></div>' +
    puntKeuze('xPunt', 'x', f.voorstel) +
    '<div class="invoer" style="align-items:center"><label class="sr" for="x-punten">Ander aantal punten</label><input id="x-punten" class="puntveld" type="number" inputmode="numeric" min="1" max="50" value="' + esc(f.voorstel) + '"><span class="klein">punten (1–50)</span></div>' +
    '<div class="fout" style="text-align:left">' + esc(f.fout || '') + '</div>' +
    '<div class="chips"><button type="submit" class="knop">Verder</button><button type="button" class="knop2" data-act="xSluit" style="align-self:center">Annuleren</button></div></form></div>';
  if (f.focus) { f.focus = false; document.getElementById('x-wat').focus(); }
}

function renderBeoordeel(laag) {
  var b = beoordeel;
  var items = wachtend().map(function (x) {
    var k = persoon(x.kind) || { naam: x.kind, kleur: '#9AA1B2' };
    var p = b.punten[x.id] !== undefined ? b.punten[x.id] : x.voorstel;
    return '<div class="bkaart"><div class="rij" style="gap:10px">' + av(k, 36) + '<div><b style="font-size:16px">' + esc(x.wat) + '</b>' +
      '<div class="klein">' + esc(k.naam) + ' · ' + dagLabel(x.datum) + ' · voorstel ' + x.voorstel + ' punten</div></div></div>' +
      puntKeuze('bPunt', x.id, p) +
      '<div class="invoer" style="align-items:center"><label class="sr" for="bp-' + esc(x.id) + '">Punten</label>' +
      '<input id="bp-' + esc(x.id) + '" data-bp="' + esc(x.id) + '" class="puntveld" type="number" inputmode="numeric" min="1" max="50" value="' + esc(p) + '">' +
      '<label class="sr" for="br-' + esc(x.id) + '">Reden (optioneel)</label><input id="br-' + esc(x.id) + '" data-br="' + esc(x.id) + '" type="text" maxlength="120" placeholder="Opmerking (optioneel)" value="' + esc(b.reden[x.id] || '') + '"></div>' +
      '<div class="chips"><button type="button" class="knop" data-act="bGoed" data-id="' + esc(x.id) + '">Goedkeuren</button>' +
      '<button type="button" class="knop2" data-act="bAf" data-id="' + esc(x.id) + '" style="align-self:center">Afwijzen</button></div></div>';
  }).join('');
  var g = b.geef;
  var kids = kinderen().map(function (k) {
    var aan = g.kind === k.id;
    return '<button type="button" class="keuze" data-act="gKind" data-id="' + esc(k.id) + '" aria-pressed="' + aan + '"' +
      (aan ? ' style="background:' + esc(k.kleur) + ';border-color:' + esc(k.kleur) + ';color:#101218"' : '') + '>' + esc(k.naam) + '</button>';
  }).join('');
  laag.innerHTML = '<div class="overlay"><div class="detailbox klusform" role="dialog" aria-modal="true" aria-label="Extra klusjes beoordelen">' +
    '<div class="rij" style="justify-content:space-between;width:100%"><h2>Extra klusjes</h2><span class="klein">Als ' + esc(ouderSessie.naam) + '</span></div>' +
    (items || '<div class="leegtekst">Er wacht niets op goedkeuring.</div>') +
    '<div class="veldlabel" style="margin-top:8px">Zelf extra punten geven <span class="klein">bijv. voor de jongsten</span></div>' +
    '<div class="chips">' + kids + '</div>' +
    '<div class="invoer" style="align-items:center"><label class="sr" for="g-wat">Waarvoor?</label><input id="g-wat" type="text" maxlength="80" placeholder="Waarvoor?" value="' + esc(g.wat) + '">' +
    '<label class="sr" for="g-punten">Punten</label><input id="g-punten" class="puntveld" type="number" inputmode="numeric" min="1" max="50" value="' + esc(g.punten) + '"></div>' +
    '<div class="fout" style="text-align:left">' + esc(b.fout || '') + '</div>' +
    '<div class="chips"><button type="button" class="knop" data-act="gGeef">Punten geven</button>' +
    '<button type="button" class="knop2" data-act="bSluit" style="align-self:center">Klaar</button></div></div></div>';
}

function openBeoordeel() {
  var open = function () { beoordeel = { punten: {}, reden: {}, geef: { kind: '', wat: '', punten: 5 }, fout: '' }; render(); };
  if (ouderActief()) open(); else vraagOuderPin(open, 'Extra klusjes');
}

/** Pincodevenster dat een serverfunctie aanroept met de pincode als laatste argument. */
function vraagKindPin(kind, sub, fn, args, gelukt) {
  pin = { server: { fn: fn, args: args }, kind: kind, sub: sub, gelukt: gelukt, digits: '', fout: '', bezig: false };
  render();
}

var MAAND_KORT = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
function datumKort(d) { var p = String(d).split('-'); return p.length === 3 ? Number(p[2]) + ' ' + MAAND_KORT[Number(p[1]) - 1] : d; }
function wanneerTekst(c) {
  return c.datum ? 'eenmalig ' + datumKort(c.datum) : c.dagen.length ? c.dagen.join(', ') : 'elke dag';
}

function klusBeheer() {
  var alle = D.alleKlusjes || [];
  var rij = function (c, kleur) {
    var sub = c.punten + (c.punten === 1 ? ' punt' : ' punten') + ' · ' + wanneerTekst(c) +
      (c.kinderen.length > 1 ? ' · ' + c.kinderen.map(function (id) { var p = persoon(id); return p ? p.naam : id; }).join(' → ') : '') +
      (c.actief ? '' : ' · staat uit');

/* ---------------- schooltijden en gym ---------------- */
var schoolWeek = 0;     // 0 = deze week, 1 = volgende week (in het weekend: komende en de week erna)
var dagForm = null;     // {kind, datum, b, u, vrij, n, gym, andersB, andersU}
var weekForm = null;    // {kind, week, rijen: {datum: {b, u, vrij, n, andersB, andersU}}}
var vastForm = null;    // {kind, dagen: {ma: {b, u, gym}}}
var WD_KORT = ['ma', 'di', 'wo', 'do', 'vr'];
function SD() { return D.school || null; }
function schoolKindInfo(id) { var s = SD(); return s ? s.kinderen.filter(function (k) { return k.id === id; })[0] || null : null; }
function schoolVan(id) {
  var k = schoolKindInfo(id), s = SD();
  return k ? s.scholen.filter(function (x) { return x.naam === k.school; })[0] || { begin: [], uit: [], soort: k.soort } : null;
}
function schoolOp(datum, id) { var s = SD(); return s && s.dagen[datum] ? s.dagen[datum][id] || null : null; }
function tijdKort(t) { return t ? t.replace(/^0/, '') : ''; }
function wdVan(datum) { var p = datum.split('-').map(Number); return (new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay() + 6) % 7; }
function dagLabelKort(datum) { return WD_KORT[wdVan(datum)] + ' ' + Number(datum.slice(8, 10)); }
function celTekst(x) {
  if (!x) return '';
  if (x.vrij) return x.vak && x.vak !== 'vrij' ? x.vak.replace(/vakantie/i, 'vak.') : 'vrij';
  if (x.leeg) return '?';
  return (x.b ? tijdKort(x.b) + '–' : 'uit ') + tijdKort(x.u);
}
function gymKnop(k, datum, x) {
  if (!x || x.vrij || !x.gym) return '';
  return '<button type="button" class="gymlabel" data-act="gymNiet" data-id="' + esc(k.id + '|' + datum) + '" aria-label="' + esc(k.naam) + ' heeft gym. Tik als gym niet doorgaat">👟 Gymtas mee</button>';
}
function schoolKop(k, datum) {
  var x = schoolOp(datum, k.id);
  if (!x) return '';
  var info = schoolKindInfo(k.id);
  var tijd = x.vrij ? '<span class="uit">vrij</span><small>' + esc(x.vak && x.vak !== 'vrij' ? x.vak : 'geen school') + '</small>' :
    x.leeg ? '<span class="uit" style="color:#B28DFF">?</span><small>nog invullen</small>' :
    '<span class="uit">uit ' + esc(tijdKort(x.u) || '?') + '</span><small>' + esc((x.b ? tijdKort(x.b) + ' – ' + tijdKort(x.u) : '') + (x.n ? ' · ' + x.n : '')) + '</small>';
  return gymKnop(k, datum, x) + (x.gw ? '<span class="wijzlabel">gewijzigd</span>' : '') +
    '<button type="button" class="schooltijd" data-act="schoolCel" data-id="' + esc(k.id + '|' + datum) + '" aria-label="Schooltijden ' + esc(k.naam) + ' aanpassen">' + tijd + '</button>';
}
function teInvullen(id) {
  var s = SD(), info = schoolKindInfo(id);
  if (!s || !info || info.soort !== 'middelbaar') return null;
  var n = new Date(), wd = (n.getDay() + 6) % 7;
  if (!(wd === 6 || wd === 5 && n.getHours() >= 12 || (wd === 0 && n.getHours() < 12))) return null;
  var week = s.weken[0];
  return week.some(function (d) { var x = s.dagen[d][id]; return x && x.leeg; }) ? 0 : null;
}
function roosterHerinnering() {
  var s = SD();
  if (!s) return '';
  var mk = mijnKind();
  return s.kinderen.filter(function (k) { return (!mk || mk.id === k.id) && teInvullen(k.id) !== null; }).map(function (k) {
    var p = persoon(k.id) || { naam: k.id };
    return '<button type="button" class="roosterherin" data-act="roosterWeek" data-id="' + esc(k.id + '|0') + '">📅 ' + esc(p.naam) + ', vul je rooster voor ' +
      (new Date().getDay() === 1 ? 'deze' : 'volgende') + ' week in ›</button>';
  }).join('');
}
function schoolOverzicht() {
  var s = SD();
  if (!s) return '';
  var week = s.weken[schoolWeek] || s.weken[0];
  var kids = s.kinderen.map(function (k) { return persoon(k.id); }).filter(Boolean);
  var mk = mijnKind();
  if (mk) kids = kids.filter(function (k) { return k.id === mk.id; });
  var kopRij = '<tr><th></th>' + week.map(function (d) {
    return '<th' + (d === D.vandaag ? ' class="vd"' : '') + '>' + dagStip(d, 8) + esc(dagLabelKort(d)) + '</th>';
  }).join('') + '</tr>';
  var rijen = kids.map(function (k) {
    var info = schoolKindInfo(k.id);
    return '<tr><td class="n">' + av(k, 22) + ' ' + esc(k.naam) + '</td>' + week.map(function (d) {
      var x = s.dagen[d][k.id] || {};

        esc(celTekst(x)) + (x.gym && !x.vrij ? ' <span aria-label="gym">👟</span>' : '') + (x.n ? ' <span class="snote" title="' + esc(x.n) + '">✎</span>' : '') + '</button></td>';
    }).join('') + '</tr>';
  }).join('');
  var knoppen = '<div class="chips" role="group" aria-label="Week kiezen">' + ['Deze week', 'Volgende week'].map(function (t, i) {
    var label = i === 0 && wdVan(s.weken[0][0]) === 0 && s.weken[0][0] > D.vandaag ? 'Komende week' : i === 0 ? t : (s.weken[0][0] > D.vandaag ? 'Week erna' : t);
    return '<button type="button" class="tab" data-act="schoolWeek" data-id="' + i + '" aria-pressed="' + (schoolWeek === i) + '">' + esc(label) + '</button>';
  }).join('') + '</div>';
  return '<section class="card schoolkaart"><div class="kop" style="flex-wrap:wrap;gap:8px"><h2>Schooltijden</h2>' + knoppen + '</div>' +
    '<div class="stabelwrap"><table class="stabel">' + kopRij + rijen + '</table></div>' +
    '<div class="rij" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><span class="klein">Oranje = afwijkend · 👟 = gym · tik op een vakje om aan te passen</span>' +
    (mk ? '' : '<button type="button" class="knop2" data-act="vastOpen">Vaste tijden en gym</button>') + '</div></section>';
}
function tijdKeuze(act, lijst, waarde, anders, veldId) {
  var inLijst = lijst.indexOf(waarde) >= 0;
  var chips = lijst.map(function (t) {
    return '<button type="button" class="keuze" data-act="' + act + '" data-id="' + esc(t) + '" aria-pressed="' + (waarde === t && !anders) + '">' + esc(tijdKort(t)) + '</button>';

function isoWeek(datum) {
  var p = datum.split('-').map(Number);
  var dt = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
  var dag = dt.getUTCDay() || 7;
  dt.setUTCDate(dt.getUTCDate() + 4 - dag);
  return Math.ceil(((dt - new Date(Date.UTC(dt.getUTCFullYear(), 0, 1))) / 86400000 + 1) / 7);
}

          '<span class="mt">' + (e.heleDag ? '' : esc(e.tijd) + ' ') + '</span><span class="mn">' + esc(e.titel) + '</span></button>';
      }).join('');
      var meer = ev.length > max ? '<button type="button" class="mmeer" data-act="weekNr" data-id="' + w + '">+' + (ev.length - max) + ' meer</button>' : '';
      return '<div class="mcel' + (d.vandaag ? ' nu' : '') + (voorbij ? ' voorbij' : '') + '" style="border-top-color:' + dagKleur(d.datum) + (d.vandaag ? ';outline-color:' + dagKleur(d.datum) : '') + '">' +
        '<div class="mkop"><b>' + d.nr + '</b>' + (d.nr === 1 || (w === 0 && d === wk[0]) ? '<span>' + esc(d.maand) + '</span>' : '') + (d.vandaag ? '<span class="mvandaag">vandaag</span>' : '') + afvalLabels(d.datum, true) + '</div>' +
        items + meer + '</div>';
    }).join('');
    var eerste = wk[0], laatste = wk[wk.length - 1];
    rijen.push('<button type="button" class="mweek" data-act="weekNr" data-id="' + w + '" aria-label="Week ' + isoWeek(eerste.datum) + ' openen">' +
      '<b>wk ' + isoWeek(eerste.datum) + '</b><span>' + eerste.nr + '–' + laatste.nr + ' ' + esc(laatste.maand.slice(0, 3)) + '</span></button>' + cellen);
  }
  var koppen = '<div></div>' + ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'].map(function (d, i) {
    return '<div class="mdagnaam">' + '<span class="dagstip" style="width:8px;height:8px;background:' + DAGKLEUR[i] + '"></span>' + d + '</div>';
  }).join('');
  // Telefoon: een lijst per week met alleen de dagen waarop iets gepland staat.
  var lijst = [];
  for (var v = 0; v * 7 < dagen.length; v++) {
    var wd = dagen.slice(v * 7, v * 7 + 7).filter(function (d) { return d.events.length && d.datum >= D.vandaag; });
    lijst.push('<div class="okkop">Week ' + isoWeek(dagen[v * 7].datum) + '</div>' + (wd.map(function (d) {
      return '<div class="mlrij"><span class="mld">' + dagStip(d.datum, 8) + esc(d.dag.slice(0, 2)) + ' ' + d.nr + '</span><div class="mlev">' + d.events.map(function (e) {
        var p = e.wie.map(persoon).filter(Boolean)[0];
        return '<button type="button" class="mev" data-act="detail" data-id="' + esc(e.sleutel) + '"><span class="dot" style="width:7px;height:7px;background:' + (p ? esc(p.kleur) : '#5A6070') + '"></span>' +
          '<span class="mt">' + (e.heleDag ? '' : esc(e.tijd) + ' ') + '</span><span class="mn">' + esc(e.titel) + '</span></button>';
      }).join('') + '</div></div>';
    }).join('') || '<div class="klein">Niets gepland</div>'));
  }
  return '<main style="display:flex;flex-direction:column;gap:14px">' +
    '<div class="weekkop">' + weekSchakel() + '<span class="klein" style="font-size:15px">Komende 4 weken · tik op een week voor de details</span></div>' +
    (a.fout ? '<div class="melding">' + esc(a.fout) + '</div>' : '') +
    '<div class="maandgrid">' + koppen + rijen.join('') + '</div>' +
    '<div class="maandlijst">' + lijst.join('') + '</div></main>';
}

function week() {
  if (weekNr === 'maand') return vierWeken();
  var a = D.agenda || {};
  var dagen = (a.dagen || []).slice(weekNr * 7, weekNr * 7 + 7).filter(function (d) { return !isMobiel() || weekNr > 0 || d.datum >= D.vandaag; });
  if (!dagen.length) return '<main><div class="melding">De weekagenda kon niet geladen worden.</div></main>';
  var schakel = weekSchakel();
  var eerste = dagen[0], laatste = dagen[dagen.length - 1];
  var bereik = eerste.nr + (eerste.maand !== laatste.maand ? ' ' + eerste.maand : '') + ' – ' + laatste.nr + ' ' + laatste.maand;
  var open = 0;

  var kolommen = dagen.map(function (d) {
    var voorbij = d.datum < D.vandaag;
    var items = d.events.map(function (e) {
      var wie = e.wie.map(persoon).filter(Boolean);
      var dots = wie.map(function (p) { return '<span class="dot" style="width:8px;height:8px;background:' + esc(p.kleur) + '"></span>'; }).join('');
      var regel = '';
      if (e.kind && !e.heleDag) {
        var b = e.breng && persoon(e.breng), h = e.haal && persoon(e.haal);
        if (!voorbij) open += (b ? 0 : 1) + (h ? 0 : 1);
        regel = '<span class="r">' + mini(ST[e.status].c, GAAT_L[e.status].charAt(0)) +
          mini(b ? b.kleur : '#F2C14E', 'B: ' + (b ? b.naam : '?')) + mini(h ? h.kleur : '#F2C14E', 'H: ' + (h ? h.naam : '?')) + '</span>';
      }
      return '<button type="button" class="wev" data-act="detail" data-id="' + esc(e.sleutel) + '" aria-label="' + esc(e.tijd + ', ' + e.titel) + ', details openen">' +
        '<span class="t">' + (e.categorie ? svg(e.categorie, 12) : '') + esc(e.tijd) + (e.eind ? '–' + esc(e.eind) : '') + (e.notitie ? svg('notitie', 12) : '') + '</span><span class="n">' + esc(e.titel) + '</span>' +
        (dots ? '<span style="display:flex;gap:3px">' + dots + '</span>' : '') + regel + '</button>';
    }).join('');
    return '<section class="dagkol' + (d.vandaag ? ' nu' : '') + (voorbij ? ' voorbij' : '') + '" style="border-top-color:' + dagKleur(d.datum) + (d.vandaag ? ';outline-color:' + dagKleur(d.datum) : '') + '" aria-label="' + esc(d.dag + ' ' + d.nr + ' ' + d.maand) + '">' +
      '<div class="dagkop"><b>' + dagStip(d.datum, 9) + esc(d.dag) + ' ' + d.nr + '</b><span>' + (d.vandaag ? 'vandaag' : '') + '</span>' +
      dagWeer(d) + '</div>' + (afvalOp(d.datum).length ? '<div class="aflabels">' + afvalLabels(d.datum) + '</div>' : '') +
      (items || '<div class="klein" style="padding:2px">Niets gepland</div>') + '</section>';
  }).join('');

  return '<main style="display:flex;flex-direction:column;gap:14px">' +
    '<div class="weekkop">' + schakel + '<span class="klein" style="font-size:15px">Week ' + isoWeek(eerste.datum) + ' · ' + esc(bereik) +
    ' · ' + open + (open === 1 ? ' rit' : ' ritten') + ' zonder chauffeur</span></div>' +
    (a.fout ? '<div class="melding">' + esc(a.fout) + '</div>' : '') +
    '<div class="weekgrid">' + kolommen + '</div>' +
    '<div class="klein" style="font-size:14px">Tik op een afspraak om hem te bewerken: gaat het kind, wie brengt (B) en haalt (H), categorie en notitie.</div>' + oppasKaart() + '</main>';
}

function renderDetail(laag) {
  var e = vindEvent(detail);
  if (!e) { detail = null; bewerkA = null; laag.innerHTML = ''; return; }
  if (!bewerkA) bewerkA = { status: e.status, breng: e.breng || '', haal: e.haal || '', notitie: e.notitie || '', categorie: e.categorie || '' };
  var f = bewerkA;
  var dag = ((D.agenda || {}).dagen || []).filter(function (d) { return d.datum === e.datum; })[0] || { dag: '', nr: '', maand: '' };
  var wie = e.wie.map(persoon).filter(Boolean);
  var kids = wie.filter(function (p) { return p.rol === 'kind'; });
  var wieHtml = wie.length ? wie.map(function (p) { return '<span class="dot" style="background:' + esc(p.kleur) + '"></span>'; }).join('') +
    '<span>' + esc(wie.map(function (p) { return p.naam; }).join(' & ')) + '</span>' : '<span>Gezin</span>';
  var keuzes = function (act, opties, huidig) {
    return '<div class="chips">' + opties.map(function (o) {

        (aan && o.kleur ? ' style="background:' + esc(o.kleur) + ';border-color:' + esc(o.kleur) + ';color:#101218"' : '') + '>' + (o.icoon ? svg(o.icoon, 18) : '') + esc(o.naam) + '</button>';
    }).join('') + '</div>';
  };
  var chauffeurs = [{ id: '', naam: 'Nog niemand' }].concat(ouders().map(function (p) { return { id: p.id, naam: p.naam, kleur: p.kleur }; }),
    [{ id: OPA_OMA.id, naam: OPA_OMA.naam, kleur: OPA_OMA.kleur }, { id: ZELF.id, naam: 'Zelf', kleur: '#C9CED8' }]);
  var ritten = e.kind && !e.heleDag ?
    '<div class="veldlabel">Gaat ' + esc(kids.map(function (p) { return p.naam; }).join(' & ')) + '?</div>' +
    keuzes('aStatus', [{ id: 'ja', naam: 'Gaat', kleur: ST.ja.c }, { id: 'nee', naam: 'Gaat niet', kleur: ST.nee.c }, { id: 'onb', naam: 'Weet nog niet', kleur: ST.onb.c }], f.status) +
    '<div class="veldlabel">Wie brengt? <span class="klein">Zelf = gaat er zelf heen</span></div>' + keuzes('aBreng', chauffeurs, f.breng) +
    '<div class="veldlabel">Wie haalt? <span class="klein">Zelf = komt zelf terug</span></div>' + keuzes('aHaal', chauffeurs, f.haal) :
    (e.kind ? '' : '<div class="klein" style="font-size:14px">Zet de naam van een kind in de afspraak, dan kun je hier ook Gaat, Breng en Haal invullen.</div>');
  laag.innerHTML = '<div class="overlay"><form class="detailbox klusform" data-form="afspraak" role="dialog" aria-modal="true" aria-label="Afspraak bewerken">' +
    '<div class="klein" style="font-size:15px">' + esc(hoofdletter(dag.dag) + ' ' + dag.nr + ' ' + dag.maand) + ' · ' + esc(e.tijd) + (e.eind ? '–' + esc(e.eind) : '') + '</div>' +
    '<h2>' + esc(e.titel) + '</h2><div class="wie" style="margin:0">' + wieHtml + '</div>' + ritten +
    '<div class="veldlabel">Categorie' + (e.categorieGeraden && f.categorie === e.categorie && f.categorie ? ' <span class="klein">voorstel op basis van de titel</span>' : '') + '</div>' +
    keuzes('aCat', CATEGORIEEN.map(function (c) { return { id: c[0], naam: c[1], icoon: c[0] === 'overig' ? '' : c[0] }; }), f.categorie) +
    '<label class="veldlabel" for="a-notitie">Notitie</label>' +
    '<textarea id="a-notitie" class="veld" maxlength="200" placeholder="Bijv. gymtas mee, ophalen bij de achteringang">' + esc(f.notitie) + '</textarea>' +
    '<div class="chips"><button type="submit" class="knop">Opslaan</button>' +
    '<button type="button" class="knop2" data-act="sluitDetail" style="align-self:center">Annuleren</button></div></form></div>';
}

function bewaarAfspraak() {
  var e = vindEvent(detail);
  if (!e || !bewerkA) { detail = null; bewerkA = null; render(); return; }
  var f = bewerkA, w = { notitie: f.notitie.trim().slice(0, 200), categorie: f.categorie };
  if (e.kind && !e.heleDag) { w.status = f.status; w.breng = f.breng; w.haal = f.haal; }
  Object.keys(w).forEach(function (k) { e[k] = w[k]; });
  e.categorieGeraden = false;
  detail = null; bewerkA = null;
  zegt('Afspraak opgeslagen', '#9CC2FF');
  bewaar('zetAfspraak', [e.sleutel, e.titel, e.datum, w]);
}

var DAG_VOL = { ma: 'maandag', di: 'dinsdag', wo: 'woensdag', do: 'donderdag', vr: 'vrijdag', za: 'zaterdag', zo: 'zondag' };
function volDag(dag) { return DAG_VOL[String(dag).toLowerCase().slice(0, 2)] || dag; }

function ouderActief() {
  if (ouderSessie && Date.now() > ouderSessie.tot) ouderSessie = null;
  return !!ouderSessie;
}

function ouderBeheer() { return ouderActief() && ouderSessie.rol !== 'oppas'; }
function vraagOuderPin(daarna, titel, alleenOuders) {
  if (alleenOuders && ouderActief() && ouderSessie.rol === 'oppas') ouderSessie = null;
  pin = { ouder: true, alleenOuders: !!alleenOuders, titel: titel || 'Weekmenu aanpassen', digits: '', fout: '', bezig: false, daarna: daarna || null };
  render();
}

function renderMenuEdit(laag) {
  laag.innerHTML = '<div class="overlay"><form class="detailbox" data-form="menu" role="dialog" aria-modal="true" aria-label="Gerecht aanpassen">' +
    '<h2>Wat eten we op ' + esc(menuItem(menuEdit.datum) ? menuTitel(menuItem(menuEdit.datum)) : menuEdit.datum) + '?</h2>' +
    '<div class="invoer"><label class="sr" for="menuveld">Gerecht</label>' +
    '<input id="menuveld" type="text" autocomplete="off" maxlength="60" placeholder="Bijv. pannenkoeken" value="' + esc(menuEdit.waarde) + '"></div>' +
    '<div class="kiesknoppen" style="justify-content:flex-start"><button type="submit" class="knop">Opslaan</button>' +
    (menuEdit.waarde ? '<button type="button" class="knop2" data-act="menuLeeg" style="align-self:center">Leegmaken</button>' : '') +
    '<button type="button" class="knop2" data-act="menuSluit" style="align-self:center">Annuleren</button></div></form></div>';
  var veld = document.getElementById('menuveld');
  veld.focus();
  veld.setSelectionRange(veld.value.length, veld.value.length);
}

function opslaanMenu(datum, waarde) {
  if (!ouderActief()) { menuEdit = null; vraagOuderPin(function () { opslaanMenu(datum, waarde); }); return; }
  ouderSessie.tot = Date.now() + 5 * 60000;
  (D.menu || []).forEach(function (m) { if (m.datum === datum) m.gerecht = waarde; });
  menuEdit = null; render();
  bewaar('zetMenu', [datum, waarde, ouderSessie.pin]);
}

function renderHelp(laag) {
  var dag = ((D.agenda || {}).dagen || []).filter(function (d) { return d.datum === helpDag; })[0] || { dag: '', nr: '', maand: '' };
  var m = menuItem(helpDag);
  var nu = (D.helpers || {})[helpDag] || [];
  var kids = kinderen().map(function (k) {
    var aan = nu.indexOf(k.id) >= 0;
    return '<button type="button" class="keuze" data-act="helpKind" data-id="' + esc(k.id) + '" aria-pressed="' + aan + '"' +
      (aan ? ' style="background:' + esc(k.kleur) + ';border-color:' + esc(k.kleur) + ';color:#101218"' : '') + '>' + (aan ? '✓ ' : '') + esc(k.naam) + '</button>';
  }).join('');
  laag.innerHTML = '<div class="overlay"><div class="detailbox" role="dialog" aria-modal="true" aria-label="Helpen koken">' +
    '<div class="klein" style="font-size:15px">' + esc(hoofdletter(dag.dag) + ' ' + dag.nr + ' ' + dag.maand) + (m && m.gerecht ? ' · ' + esc(m.gerecht) : '') + '</div>' +
    '<h2>Wie helpt koken?</h2>' +
    '<div class="klein" style="font-size:15px">Tik op je naam. Je krijgt <b style="color:var(--text)">3 punten</b> als je de klus <i>Helpen met koken</i> later die dag afvinkt bij Klusjes, met je pincode.</div>' +
    '<div class="chips">' + kids + '</div>' +
    '<button type="button" class="knop" data-act="helpSluit" style="align-self:flex-start">Klaar</button></div></div>';
}

  var laag = document.getElementById('laag');
  if (!pin && keuze) { renderKeuze(laag); return; }

  if (!pin && spaarForm) { renderSpaar(laag); return; }
  if (!pin && beoordeel) { renderBeoordeel(laag); return; }

  if (!pin && weerScherm) { renderWeer(laag); return; }

  if (!pin && vastForm) { renderVastForm(laag); return; }
  if (!pin && kpiScherm) { renderKpi(laag); return; }
  if (!pin && broodWeek) { renderBroodWeek(laag); return; }
  if (!pin) { laag.innerHTML = ''; return; }
  var k = pin.ouder ? { naam: '', kleur: '#ECEEF3' } : (persoon(pin.server ? pin.kind : pin.klus.kind) || { naam: '?', kleur: '#ECEEF3' });
  var dots = ''; for (var i = 0; i < 4; i++) dots += '<span style="border-color:' + esc(k.kleur) + ';background:' + (i < pin.digits.length ? esc(k.kleur) : 'transparent') + '"></span>';
  var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'Annuleer', '0', 'Wis'].map(function (t) {
    var s = t === 'Annuleer' || t === 'Wis';
    return '<button type="button" class="key' + (s ? ' s' : '') + '" data-act="key" data-id="' + t + '"' + (pin.bezig ? ' disabled' : '') +
      ' aria-label="' + (t === 'Wis' ? 'Laatste cijfer wissen' : t === 'Annuleer' ? 'Annuleren' : 'Cijfer ' + t) + '">' + t + '</button>';
  }).join('');
  laag.innerHTML = '<div class="overlay"><div class="pinbox' + (pin.schud ? ' shake' : '') + '" role="dialog" aria-modal="true" aria-label="Pincode invoeren">' +
    (pin.ouder ?
      '<span class="av" style="width:64px;height:64px;background:#ECEEF3">' + svg('potlood', 30) + '</span><h2>' + esc(pin.titel || 'Ouderpincode') + '</h2>' +
      '<div style="font-size:15px;color:#C9CEDA;font-weight:700;text-align:center">Pincode van ' + esc(ouders().map(function (o) { return o.naam; }).concat(pin.alleenOuders ? [] : actieveOppas().map(function (o) { return o.naam + ' (oppas)'; })).join(' of ')) + '</div>' :
      av(k, 64) + '<h2>Hoi ' + esc(k.naam) + '!</h2>' +
      '<div style="font-size:15px;color:#C9CEDA;font-weight:700;text-align:center">' + (pin.server ? esc(pin.sub) + '<br><span style="font-size:13px;color:var(--muted)">Pincode van ' + esc(k.naam) + ' of van een ouder</span>' : esc(pin.klus.klus) + ' · +' + pin.klus.punten + (pin.klus.punten === 1 ? ' punt' : ' punten')) + '</div>') +
    '<div class="pindots" aria-label="' + pin.digits.length + ' van 4 cijfers">' + dots + '</div>' +
    '<div class="fout" aria-live="assertive">' + esc(pin.bezig ? 'Even controleren…' : pin.fout || '') + '</div>' +
    '<div class="keys">' + keys + '</div>' +
    (pin.klus && !pin.klus.gedaan && !pin.bezig ? (pin.klus.aanbod ?
      '<button type="button" class="knop2 geefknop" data-act="klusIntrekken">Toch zelf doen (aanbod aan ' + esc((persoon(pin.klus.aanbod.naar) || {}).naam || '') + ' intrekken)</button>' :
      '<button type="button" class="knop2 geefknop" data-act="klusGeven">' + svg('pijl', 18) + 'Geef aan iemand anders</button>') : '') +
    '</div></div>';
  pin.schud = false;
}

function renderStraf(laag) {
  var c = straf.klus, k = persoon(c.kind) || { naam: '' };

    '<div class="rij" style="gap:12px;justify-content:center"><span style="font-size:16px;font-weight:800">Strafpunten</span>' +

}

      '<h2>' + esc(o.naam) + ' kan oppassen</h2>' +
      '<div class="oppascodes"><div><span class="klein">Code om het dashboard te openen</span><b>' + esc(o.code) + '</b></div>' +

/* ---------------- weerscherm (pop-up over het hele scherm) ---------------- */
function regenConclusie(kw) {
  if (!kw || !kw.length) return null;
  var nat = function (k) { return k.mm >= 0.1; };
  if (!kw.some(nat)) return { tekst: 'Droog de komende 2 uur', kleur: 'var(--ja)' };
  if (nat(kw[0])) {
    var droog = kw.filter(function (k, i) { return i > 0 && !nat(k) && kw.slice(i).every(function (x) { return !nat(x); }); })[0];
    return { tekst: droog ? 'Nu regen, droog vanaf ongeveer ' + droog.tijd : 'Regen de komende 2 uur', kleur: '#F2A65A' };
  }
  return { tekst: 'Droog tot ongeveer ' + kw.filter(nat)[0].tijd, kleur: 'var(--ja)' };
}
function fietsAdvies(x) {
  if (!x) return null;
  var regels = [], kleur = 'var(--ja)';
  if (x.kans >= 60) { regels.push('Regenpak aan'); kleur = '#F2A65A'; }
  else if (x.kans >= 30) { regels.push('Regenjas mee voor de zekerheid'); kleur = '#F2C94C'; }
  if (x.wind >= 35) { regels.push('harde wind: iets eerder weg'); kleur = '#F2A65A'; }
  if (x.temp <= 3) regels.push('handschoenen aan');
  if (!regels.length) regels.push('Waarschijnlijk droog');
  var t = regels.join(', ');
  return { tekst: t.charAt(0).toUpperCase() + t.slice(1), kleur: kleur };
}
function renderWeer(laag) {
  var w = D.weer;
  if (!w || w.fout || !w.nu) { weerScherm = null; zegt((w && w.fout) || 'Geen weer beschikbaar', '#FF8A7A'); return; }
  var n = new Date(), klok = ('0' + n.getHours()).slice(-2) + ':' + ('0' + n.getMinutes()).slice(-2);
  var nu = w.nu;
  var feit = function (ic, t) { return '<span class="wf">' + svg(ic, 16) + esc(t) + '</span>'; };
  var vd = weerVoor(D.vandaag) || { tips: [] };
  var feiten = [];
  if (nu.wind != null) feiten.push(feit('windje', (nu.richting ? nu.richting + ' ' : '') + nu.wind + ' km/u' + (nu.stoten ? ', stoten ' + nu.stoten : '')));
  if (vd.kans != null) feiten.push(feit('druppel', 'Vandaag ' + vd.kans + '% kans op regen'));
  if (w.zon && w.zon.op) feiten.push(feit('zonop', 'Zon op ' + w.zon.op));
  if (w.zon && w.zon.onder) feiten.push(feit('zonop', 'Zon onder ' + w.zon.onder));
  var morgen = weerVoor(D.morgen);
  var tips = (n.getHours() < 15 ? vd.tips : (morgen ? morgen.tips.map(function (t) { return 'Morgen: ' + t.charAt(0).toLowerCase() + t.slice(1); }) : [])) || [];
  var nuKaart = '<section class="card wkaart o1"><div class="wnu">' + svg(nu.icoon, 72, 1.6) + '<div><b>' + nu.temp + '°</b><span>' + esc(nu.tekst) +
    (nu.gevoel != null && nu.gevoel !== nu.temp ? ' · voelt als ' + nu.gevoel + '°' : '') + '</span></div></div>' +
    '<div class="wfeiten">' + feiten.join('') + '</div>' +
    (tips.length ? '<div class="chips">' + tips.map(function (t) { return '<span class="wtip">' + esc(t) + '</span>'; }).join('') + '</div>' : '') + '</section>';

  var dagen = (w.dagen || []).filter(function (d) { return d.datum >= D.vandaag; }).slice(0, 7);
  var lo = Math.min.apply(null, dagen.map(function (d) { return d.min; }).concat([0])), hi = Math.max.apply(null, dagen.map(function (d) { return d.max; }).concat([lo + 1]));
  var dagRijen = dagen.map(function (d) {
    var p = d.datum.split('-').map(Number);
    var naam = d.datum === D.vandaag ? 'Vandaag' : hoofdletter(DAG_KORT[(new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay() + 6) % 7]) + ' ' + p[2];
    return '<div class="wdag">' + '<span class="wn">' + dagStip(d.datum, 9) + esc(naam) + '</span>' + svg(d.icoon, 24) +
      '<span class="wk">' + (d.kans >= 10 ? svg('druppel', 12) + d.kans + '%' : '') + '</span><span class="wmin">' + d.min + '°</span>' +
      '<span class="wbalk"><span style="left:' + ((d.min - lo) / (hi - lo) * 100) + '%;width:' + Math.max(4, (d.max - d.min) / (hi - lo) * 100) + '%"></span></span>' +
      '<span class="wmax">' + d.max + '°</span></div>';
  }).join('');
  var dagKaart = '<section class="card wkaart o5"><h2>Komende 7 dagen</h2>' + dagRijen + '</section>';

  var uren = w.komend || [];
  var uurKaart = '';
  if (uren.length) {
    var W = 760, H = 150, st = W / uren.length;
    var tl = Math.min.apply(null, uren.map(function (u) { return u.temp; })), th = Math.max.apply(null, uren.map(function (u) { return u.temp; }));
    if (th === tl) th = tl + 1;
    var pts = uren.map(function (u, i) { return [st * i + st / 2, 34 + (th - u.temp) / (th - tl) * 56]; });
    var grafiek = '<svg class="wgrafiek" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Temperatuur en kans op regen per uur">' +
      uren.map(function (u, i) { var hgt = u.kans / 100 * 46; return '<rect x="' + (st * i + st * .25) + '" y="' + (H - hgt) + '" width="' + (st * .5) + '" height="' + hgt + '" rx="3" fill="#64A8FF" opacity="' + (.35 + u.kans / 200) + '"/>'; }).join('') +
      '<path d="M' + pts.map(function (p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' L') + '" fill="none" stroke="#F2C94C" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>';
    var kol = uren.map(function (u, i) {
      return '<div class="wuur"><span class="t">' + ('0' + u.uur).slice(-2) + ':00</span>' + svg(u.icoon, 20) + '<span class="k">' + (u.kans ? u.kans + '%' : '&nbsp;') + '</span>' +
        '<b>' + u.temp + '°</b></div>';
    }).join('');
    uurKaart = '<section class="card wkaart o4"><div class="kop"><h2>Komende 12 uur</h2><span class="klein">geel = temperatuur · blauw = kans op regen</span></div>' +
      '<div class="wuren">' + kol + '</div>' + grafiek + '</section>';
  }

  var kw = w.kwartier || [];
  var regenKaart = '';
  if (kw.length) {
    var c = regenConclusie(kw), mx = Math.max.apply(null, kw.map(function (k) { return k.mm; }).concat([1]));
    regenKaart = '<section class="card wkaart o2"><div class="kop"><h2>Regen komende 2 uur</h2><span style="font-weight:800;color:' + c.kleur + '">' + esc(c.tekst) + '</span></div>' +
      '<div class="wkwartier">' + kw.map(function (k) {
        return '<div><span class="b' + (k.mm >= 0.1 ? ' nat' : '') + '" style="height:' + Math.max(3, k.mm / mx * 80) + 'px" title="' + k.mm + ' mm"></span><span class="t">' + esc(k.tijd) + '</span></div>';
      }).join('') + '</div></section>';
  }

  var fietsKaart = '';
  var fd = (D.dagen || []).filter(function (d) { return d.school && (d.datum !== D.vandaag || n.getHours() < 15); })[0];
  var fw = fd && weerVoor(fd.datum);
  if (fw && (fw.heen || fw.terug)) {
    var moment = function (titel, x) {
      if (!x) return '';
      var a = fietsAdvies(x);
      return '<div class="wfiets"><span class="kk">' + titel + '</span><div class="rij" style="gap:10px">' + svg(x.icoon, 28) + '<b>' + x.temp + '°</b>' +
        '<span class="wk">' + svg('druppel', 13) + x.kans + '%</span><span class="wf">' + svg('windje', 14) + x.wind + ' km/u</span></div>' +
        '<span style="font-weight:800;color:' + a.kleur + '">' + esc(a.tekst) + '</span></div>';
    };
    fietsKaart = '<section class="card wkaart o3"><div class="rij" style="gap:10px">' + svg('fiets', 22) + '<h2>Fietsen naar school · ' + esc(fd.label === 'Vandaag' || fd.label === 'Morgen' ? fd.label.toLowerCase() : fd.dag) + '</h2></div>' +

var bezigSinds = 0;
function bewaar(fn, args) {

    .withSuccessHandler(function (res) {

    })

  run.api(gezinscode, fn, args);
}

function ververs() {
  // Een opslag-actie die na 90 seconden nog geen antwoord heeft, is verloren gegaan: dan niet blijven wachten.
  if (bezig && Date.now() - bezigSinds > 90000) bezig = 0;
  // Het weerscherm is alleen om te kijken: dat mag gewoon bijgewerkt worden terwijl het openstaat.
  var bezigMetInvoer = function () { var w = weerScherm; weerScherm = null; var b = iemandBezig(); weerScherm = w; return b; };
  if (vergrendeld || bezigMetInvoer() || bezig) return;
  var teller0 = dataTeller;
  google.script.run.withSuccessHandler(function (res) {
    if (res && res.slot) { toonSlot(res); return; }
    if (!bezigMetInvoer() && !bezig && !pin && dataTeller === teller0 && res && res.gezin) { nieuweData(res); render(); }

function alleEvents() {

/* Pincode meteen op het scherm controleren met de vingerafdrukken uit de data (de server controleert bij het
   opslaan altijd nog een keer). Geeft de persoon terug bij een goede pincode, false bij een foute, en null als
   het hier niet kan (oude browser of oude serverversie): dan gaat het zoals vroeger via de server. */
var pinHashGeheugen = {};
function pinHash(id, digits, klaar) {
  var tekst = D.pinZout + '|' + id + '|' + digits;
  if (pinHashGeheugen[tekst]) { klaar(pinHashGeheugen[tekst]); return; }
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(tekst)).then(function (buf) {
    var hex = Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    pinHashGeheugen[tekst] = hex; klaar(hex);
  }, function () { klaar(null); });
}
function oppasMet(id) { return (D.oppas || []).filter(function (o) { return o.id === id && o.actief; })[0]; }
function actieveOppas() { return (D.oppas || []).filter(function (o) { return o.actief; }); }
function controleerLokaal(ids, digits, klaar) {
  var mensen = ids.map(function (id) { return persoon(id) || oppasMet(id); }).filter(Boolean);
  if (!D.pinZout || !window.crypto || !crypto.subtle || !window.TextEncoder || !mensen.some(function (p) { return p.ph; })) { klaar(null); return; }
  var open = mensen.length, gevonden = false, kapot = false;
  mensen.forEach(function (p) {
    pinHash(p.id, digits, function (h) {
      if (h === null) kapot = true;
      if (!gevonden && h && p.ph && h === p.ph) gevonden = p;
      if (--open === 0) klaar(gevonden || (kapot ? null : false));
    });
  });
}
function ouderIds(alleenOuders) {
  return ouders().map(function (o) { return o.id; }).concat(alleenOuders ? [] : actieveOppas().map(function (o) { return o.id; }));
}

function druk(t) {
  if (!pin || pin.bezig) return;
  if (t === 'Annuleer') { pin = null; render(); return; }
  if (t === 'Wis') { pin.digits = pin.digits.slice(0, -1); renderPin(); return; }
  if (pin.digits.length >= 4) return;
  pin.digits += t; pin.fout = '';
  if (pin.digits.length < 4) { renderPin(); return; }
  pin.bezig = true;
  var p1 = pin, digits = pin.digits;
  var wie = pin.ouder ? ouderIds(pin.alleenOuders) : [pin.server ? pin.kind : pin.klus.kind].concat(ouderIds());
  controleerLokaal(wie, digits, function (wieGoed) {
    if (pin !== p1) return;
    if (wieGoed === null) { renderPin(); drukServer(); return; }
    if (wieGoed === false) {
      pin.bezig = false; pin.digits = ''; pin.schud = true; pin.fout = 'Verkeerde pincode, probeer het nog eens';
      renderPin(); return;
    }
    pinMeteenGoed(wieGoed, digits);
  });
}

/** Pincode klopt: venster meteen dicht, opslaan gebeurt op de achtergrond. */
function pinMeteenGoed(wieGoed, digits) {
  var p0 = pin;
  pin = null;
  if (p0.ouder) {
    ouderSessie = { pin: digits, naam: wieGoed.naam, rol: oppasMet(wieGoed.id) ? 'oppas' : 'ouder', tot: Date.now() + 5 * 60000 };
    render();
    if (p0.daarna) p0.daarna(); else zegt('Hoi ' + wieGoed.naam + '!', '#9CC2FF');
    return;
  }
  if (p0.server) {
    if (p0.lokaal) p0.lokaal();
    render();
    zegt(p0.gelukt, (persoon(p0.kind) || {}).kleur || '#9CC2FF');
    bewaar(p0.server.fn, p0.server.args.concat([digits]));
    return;
  }
  var klus = p0.klus;
  var c = D.klusjes.filter(function (x) { return x.id === klus.id; })[0];
  if (c && !c.gedaan) {
    c.gedaan = true;
    if (D.punten) D.punten[klus.kind] = (D.punten[klus.kind] || 0) + klus.punten;
    if (D.verdiend) D.verdiend[klus.kind] = (D.verdiend[klus.kind] || 0) + klus.punten;
  }
  render();
  var k = persoon(klus.kind) || { naam: '', kleur: '#ECEEF3' };
  zegt('+' + klus.punten + (klus.punten === 1 ? ' punt' : ' punten') + ' voor ' + k.naam + '!', k.kleur);
  bewaar('vinkAf', [klus.id, digits]);

/** Zoals vroeger: de server controleert de pincode (als het op het scherm zelf niet kan). */
function drukServer() {
  if (pin.server) {
    var p0 = pin;
    var runner = google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.slot) { toonSlot(res); return; }
        if (res && res.fout) {
          p0.bezig = false; p0.digits = ''; p0.schud = res.fout === 'Verkeerde pincode';
          p0.fout = res.fout === 'Verkeerde pincode' ? 'Verkeerde pincode, probeer het nog eens' : res.fout;
          renderPin(); return;
        }
        pin = null; if (res && res.gezin) nieuweData(res);
        zegt(p0.gelukt, (persoon(p0.kind) || {}).kleur || '#9CC2FF');
      })
      .withFailureHandler(function (err) { p0.bezig = false; p0.digits = ''; p0.fout = (err && err.message) || 'Opslaan mislukt, probeer opnieuw'; renderPin(); });
    runner.api(gezinscode, p0.server.fn, p0.server.args.concat([p0.digits]));
    return;
  }
  if (pin.ouder) {
    var code = pin.digits;
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.slot) { toonSlot(res); return; }
        if (!res || !res.ok) {
          pin.bezig = false; pin.digits = ''; pin.schud = true;
          pin.fout = res && res.fout && res.fout !== 'Verkeerde pincode' ? res.fout : 'Verkeerde pincode, probeer het nog eens';
          renderPin(); return;
        }
        var daarna = pin.daarna;
        ouderSessie = { pin: code, naam: res.naam, tot: Date.now() + 5 * 60000 };
        pin = null;
        if (daarna) daarna(); else zegt('Hoi ' + res.naam + '!', '#9CC2FF');
      })
      .withFailureHandler(function () { pin.bezig = false; pin.digits = ''; pin.fout = 'Controleren mislukt, probeer opnieuw'; renderPin(); })
      .api(gezinscode, 'controleerOuderPin', [code]);
    return;
  }
  var klus = pin.klus;
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.slot) { toonSlot(res); return; }
      if (res && res.fout) {
        pin.bezig = false; pin.digits = ''; pin.fout = res.fout === 'Verkeerde pincode' ? 'Verkeerde pincode, probeer het nog eens' : res.fout; pin.schud = true;
        renderPin(); return;
      }
      pin = null; nieuweData(res);
      var k = persoon(klus.kind) || { naam: '', kleur: '#ECEEF3' };
      zegt('+' + klus.punten + (klus.punten === 1 ? ' punt' : ' punten') + ' voor ' + k.naam + '!', k.kleur);
    })
    .withFailureHandler(function () { pin.bezig = false; pin.digits = ''; pin.fout = 'Opslaan mislukt, probeer opnieuw'; renderPin(); })
    .api(gezinscode, 'vinkAf', [klus.id, pin.digits]);
}
