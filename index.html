    if (ouderBeheer()) stop(); else vraagOuderPin(stop, 'Oppas stoppen', true);
    return;
  }
  if (act === 'klusGeven' && pin && pin.klus) { geven = { klus: pin.klus }; pin = null; render(); return; }
  if (act === 'geefSluit') { geven = null; render(); return; }
  if (act === 'geefAan' && geven) {
    var gk = geven.klus, naarP = persoon(id) || { naam: '' };
    geven = null;
    vraagKindPin(gk.kind, gk.klus + ' geven aan ' + naarP.naam, 'geefKlus', [gk.id, id], 'Gevraagd aan ' + naarP.naam + '! Die moet hem nog overnemen.');
    pin.lokaal = function () { gk.aanbod = { id: 'tijdelijk', naar: id }; };
    return;
  }
  if (act === 'klusIntrekken' && pin && pin.klus && pin.klus.aanbod) {
    var ik2 = pin.klus;
    vraagKindPin(ik2.kind, 'Aanbod intrekken: ' + ik2.klus, 'weigerKlus', [ik2.aanbod.id], 'Ingetrokken, je doet hem zelf');
    pin.lokaal = function () { ik2.aanbod = null; };
    return;
  }
  if (act === 'aanbodJa' || act === 'aanbodNee') {
    var ac = D.klusjes.filter(function (x) { return x.id === id; })[0];
    if (!ac || !ac.aanbod) return;
    var ontvanger = ac.aanbod.naar, gever = ac.kind;
    if (act === 'aanbodJa') {
      vraagKindPin(ontvanger, 'Overnemen: ' + ac.klus + ' (van ' + ((persoon(gever) || {}).naam || '') + ')', 'neemKlusOver', [ac.aanbod.id], 'Overgenomen! Vink hem af als hij klaar is');
      pin.lokaal = function () { ac.van = gever; ac.kind = ontvanger; ac.aanbod = null; };
    } else {
      vraagKindPin(ontvanger, 'Nee bedankt: ' + ac.klus, 'weigerKlus', [ac.aanbod.id], 'Oké, ' + ((persoon(gever) || {}).naam || '') + ' doet hem zelf');
      pin.lokaal = function () { ac.aanbod = null; };
    }
    return;
  }
  if (act === 'klus') {
    var c = D.klusjes.filter(function (x) { return x.id === id; })[0];
    if (!c || c.gedaan) return;
    pin = { klus: c, digits: '', fout: '', bezig: false }; render(); return;
  }
  if (act === 'item') {
    D.boodschappen.forEach(function (x) { if (x.id === id) x.gedaan = !x.gedaan; });
    render(); bewaar('wisselBoodschap', [id]); return;
  }
  if (act === 'wis') {
    D.boodschappen = D.boodschappen.filter(function (x) { return !x.gedaan; });
    render(); bewaar('wisAfgevinkteBoodschappen', []); return;
  }
});

document.addEventListener('submit', function (ev) {
  if (ev.target.matches('[data-form="wens"]')) {
    ev.preventDefault();
    var wv = document.getElementById('wens'), wt = wv.value.trim();
    if (!wt || !wensKind) return;
    wv.value = '';
    D.wensen = [{ id: 'tijdelijk' + Date.now(), datum: D.vandaag, kind: wensKind, wens: wt }].concat(D.wensen || []);
    var wk = wensKind; wensKind = null;
    zegt('Wens doorgegeven!', (persoon(wk) || {}).kleur);
    bewaar('voegWensToe', [wk, wt]); return;
  }
  if (ev.target.matches('[data-form="aftel"]')) {
    ev.preventDefault();
    aftelVelden();
    var af = aftelScherm; if (!af) return;
    af.wat = af.wat.trim();
    if (!af.wat) { af.fout = 'Vul in waar jullie naar uitkijken'; render(); return; }
    if (!af.datum || af.datum < D.vandaag) { af.fout = 'Kies een datum vanaf vandaag'; render(); return; }
    var opslaanAf = function () {
      ouderSessie.tot = Date.now() + 5 * 60000;
      var n = Math.round((Date.UTC.apply(null, af.datum.split('-').map(function (v, i) { return i === 1 ? v - 1 : +v; })) - Date.UTC.apply(null, D.vandaag.split('-').map(function (v, i) { return i === 1 ? v - 1 : +v; }))) / 86400000);
      D.aftellen = (D.aftellen || []).concat([{ sleutel: 'tijdelijk' + Date.now(), wat: af.wat, datum: af.datum, icoon: af.icoon, voor: af.voor.join(','), bron: 'eigen', aan: true, nachtjes: n, voortgang: 0 }])
        .sort(function (a, b) { return a.datum < b.datum ? -1 : a.datum > b.datum ? 1 : 0; });
      bewaar('voegAftellenToe', [{ wat: af.wat, datum: af.datum, icoon: af.icoon, voor: af.voor.join(',') }, ouderSessie.pin]);
      af.wat = ''; af.datum = ''; af.fout = ''; af.voor = []; af.icoon = '⭐';
      zegt('Staat op de aftelkalender', '#9CC2FF'); render();
    };
    if (ouderBeheer()) opslaanAf(); else { aftelScherm = null; vraagOuderPin(function () { aftelScherm = af; opslaanAf(); }, 'Aftellen beheren', true); }
    return;
  }
  if (ev.target.matches('[data-form="ouderklus"]')) {
    ev.preventDefault();
    okVeldenLezen();
    var kf = okForm; if (!kf) return;
    kf.wat = kf.wat.trim();
    if (!kf.wat) { kf.fout = 'Vul in wat er gedaan is'; render(); return; }
    var opslaanOk = function () {
      ouderSessie.tot = Date.now() + 5 * 60000;
      okForm = null;
      D.ouderklussen = D.ouderklussen || { lijst: [], gedaan: [] };
      if (kf.id) {
        D.ouderklussen.lijst.forEach(function (o) { if (o.id === kf.id) { o.wat = kf.wat; o.wie = kf.wie; o.icoon = kf.icoon; o.datum = kf.datum; } });
        zegt('Aangepast', '#9CC2FF');
        bewaar('zetOuderklus', [{ id: kf.id, wat: kf.wat, wie: kf.wie, icoon: kf.icoon, status: 'plan', datum: kf.datum }, ouderSessie.pin]);
        return;
      }
      var nieuw = { id: 'tijdelijk' + Date.now(), wat: kf.wat, wie: kf.wie, icoon: kf.icoon, datum: kf.status === 'plan' ? kf.datum : D.vandaag, bedankt: 0 };
      if (kf.status === 'plan') D.ouderklussen.lijst.push(nieuw);
      else { D.ouderklussen.gedaan.unshift(nieuw); if (D.samen) { D.samen.totaal++; D.samen.per[kf.wie] = (D.samen.per[kf.wie] || 0) + 1; } }
      zegt(kf.status === 'plan' ? 'Op de lijst gezet' : 'Mooi! Staat erbij', '#9CC2FF');
      bewaar('zetOuderklus', [{ wat: kf.wat, wie: kf.wie, icoon: kf.icoon, status: kf.status, datum: kf.datum }, ouderSessie.pin]);
    };
    if (ouderBeheer()) opslaanOk(); else { okForm = null; vraagOuderPin(function () { okForm = kf; opslaanOk(); }, 'Ouderklus opslaan', true); }
    return;
  }
  if (ev.target.matches('[data-form="oppas"]')) {
    ev.preventDefault();
    var of = oppasForm; if (!of || of.bezig) return;
    of.naam = document.getElementById('op-naam').value.trim();
    of.van = document.getElementById('op-van').value; of.tot = document.getElementById('op-tot').value;
    of.fout = !of.naam ? 'Vul een naam in' : !of.van || !of.tot ? 'Kies de datums' : of.tot < of.van ? 'De einddatum ligt voor de begindatum' : '';
    if (of.fout) { render(); return; }
    if (!ouderBeheer()) { oppasForm = null; vraagOuderPin(function () { oppasForm = of; render(); }, 'Oppas regelen', true); return; }
    of.bezig = true; render();
    google.script.run
      .withSuccessHandler(function (res) {
        of.bezig = false;
        if (res && res.slot) { toonSlot(res); return; }
        if (!res || res.fout || !res.nieuweOppas) { of.fout = (res && res.fout) || 'Er ging iets mis'; render(); return; }
        nieuweData(res); oppasForm = { klaar: res.nieuweOppas }; render();
      })
      .withFailureHandler(function (err) { of.bezig = false; of.fout = (err && err.message) || 'Er ging iets mis'; render(); })
      .api(gezinscode, 'maakOppas', [of.naam, of.van, of.tot, ouderSessie.pin]);
    return;
  }
  if (ev.target.matches('[data-form="slot"]')) {
    ev.preventDefault();
    var c = document.getElementById('slotcode').value.trim();
    if (c && !slotBezig) probeerCode(c);
    return;
  }
  if (ev.target.matches('[data-form="spaar"]')) {
    ev.preventDefault();
    var sf = spaarForm; if (!sf) return;
    sf.doel = document.getElementById('s-doel').value.trim();
    sf.punten = Math.round(Number(document.getElementById('s-punten').value));
    sf.fout = !sf.doel ? 'Vul in waar je voor spaart' : !(sf.punten >= 1 && sf.punten <= 10000) ? 'Kies 1 tot 10.000 punten' : '';
    if (sf.fout) { render(); return; }
    bewaarSpaar(sf.doel, sf.punten); return;
  }
  if (ev.target.matches('[data-form="extra"]')) {
    ev.preventDefault();
    var f = extraForm; if (!f) return;
    f.wat = document.getElementById('x-wat').value.trim();
    f.voorstel = Math.round(Number(document.getElementById('x-punten').value));
    f.fout = !f.wat ? 'Vul in wat je gedaan hebt' : !(f.voorstel >= 1 && f.voorstel <= 50) ? 'Kies 1 tot 50 punten' : '';
    if (f.fout) { render(); return; }
    var datum = f.datum === 'gisteren' ? gisteren() : D.vandaag;
    extraForm = null;
    vraagKindPin(f.kind, f.wat + ' · voorstel ' + f.voorstel + ' punten', 'meldExtra', [f.kind, f.wat, datum, f.voorstel], 'Aangemeld! Papa of mama kijkt ernaar');
    return;
  }
  if (ev.target.matches('[data-form="afspraak"]')) { ev.preventDefault(); bewaarAfspraak(); return; }
  if (ev.target.matches('[data-form="mee"]')) { ev.preventDefault(); voegMeeToe(document.getElementById('meeveld').value); return; }
  if (ev.target.matches('[data-form="klus"]')) { ev.preventDefault(); if (klusForm) bewaarKlus(); return; }
  if (ev.target.matches('[data-form="menu"]')) {
    ev.preventDefault();
    if (menuEdit) opslaanMenu(menuEdit.datum, document.getElementById('menuveld').value.trim().slice(0, 60));
    return;
  }
  if (!ev.target.matches('[data-form="toevoegen"]')) return;
  ev.preventDefault();
  var veld = document.getElementById('nieuw');
  var tekst = veld.value.trim();
  if (!tekst) return;
  veld.value = '';
  D.boodschappen.unshift({ id: 'tijdelijk' + Date.now(), item: tekst, gedaan: false });
  render(); document.getElementById('nieuw').focus();
  bewaar('voegBoodschapToe', [tekst]);
});

document.addEventListener('keydown', function (ev) {
  if ((keuze || detail || menuEdit || klusForm || helpDag || meeForm || extraForm || beoordeel || spaarForm) && !pin && ev.key === 'Escape') { keuze = null; detail = null; bewerkA = null; menuEdit = null; klusForm = null; helpDag = null; meeForm = null; extraForm = null; beoordeel = null; spaarForm = null; render(); return; }
  if (!pin) return;
  if (/^[0-9]$/.test(ev.key)) druk(ev.key);
  else if (ev.key === 'Backspace') druk('Wis');
  else if (ev.key === 'Escape') druk('Annuleer');
});

document.addEventListener('input', function (ev) {
  if (ev.target.id === 'menuveld' && menuEdit) menuEdit.waarde = ev.target.value;
  if (ev.target.id === 'a-notitie' && bewerkA) bewerkA.notitie = ev.target.value;
  if (extraForm && ev.target.id === 'x-wat') extraForm.wat = ev.target.value;
  if (spaarForm && ev.target.id === 's-doel') spaarForm.doel = ev.target.value;
  if (spaarForm && ev.target.id === 's-punten') { spaarForm.punten = ev.target.value; var se = document.getElementById('s-euro'); if (se) se.textContent = '= ' + euro(Number(ev.target.value) || 0); }
  if (extraForm && ev.target.id === 'x-punten') extraForm.voorstel = Number(ev.target.value);
  if (beoordeel && ev.target.getAttribute('data-bp')) beoordeel.punten[ev.target.getAttribute('data-bp')] = Number(ev.target.value);
  if (beoordeel && ev.target.getAttribute('data-br')) beoordeel.reden[ev.target.getAttribute('data-br')] = ev.target.value;
  if (beoordeel && ev.target.id === 'g-wat') beoordeel.geef.wat = ev.target.value;
  if (beoordeel && ev.target.id === 'g-punten') beoordeel.geef.punten = Number(ev.target.value);
  if (ev.target.id === 'kf-klus' && klusForm) klusForm.klus = ev.target.value;
  if (ev.target.id === 'kf-datum' && klusForm) klusForm.datum = ev.target.value;
});

document.addEventListener('visibilitychange', function () { if (!document.hidden) { ververs(); houdSchermAan(); } });
// Elke aanraking stelt het klokscherm weer 5 minuten uit.
['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (soort) {
  document.addEventListener(soort, function () { if (!document.querySelector('.nacht')) laatsteAanraking = Date.now(); }, true);
});
var wasNacht = toonNacht();
setInterval(function () {
  if (weerScherm) {
    if (Date.now() - laatsteAanraking > 2 * 60000) { weerScherm = null; render(); }
    else if (!pin) renderWeer(document.getElementById('laag'));
  }
  var nu = toonNacht();
  if (nu || nu !== wasNacht) render();   // klok bijwerken, of wisselen tussen dag- en nachtstand
  wasNacht = nu;
}, 20000);
houdSchermAan();
setInterval(ververs, 60000);          // elke minuut verversen, zodat tablet en telefoons gelijk lopen

/* Nieuwe dag (na middernacht): zorg dat het scherm echt meegaat. Staat er nog een venster open en heeft
   niemand het scherm 5 minuten aangeraakt, dan gaat dat dicht. Lukt verversen een kwartier lang niet,
   dan wordt de hele pagina opnieuw geladen. */
function lokaleDatum() {
  var n = new Date();
  return n.getFullYear() + '-' + ('0' + (n.getMonth() + 1)).slice(-2) + '-' + ('0' + n.getDate()).slice(-2);
}
function dagWachter() {
  if (vergrendeld || !D || !D.vandaag || lokaleDatum() === D.vandaag) return;
  if (!dagWisselSinds) dagWisselSinds = Date.now();
  if (Date.now() - laatsteAanraking > 5 * 60000) {
    pin = null; keuze = null; detail = null; bewerkA = null; menuEdit = null; klusForm = null; helpDag = null; meeForm = null;
    wieKiezen = false; extraForm = null; beoordeel = null; spaarForm = null; geven = null; straf = null; oppasForm = null; okForm = null; weerScherm = null; afvalScherm = null; aftelScherm = null; dagForm = null; weekForm = null; vastForm = null; kpiScherm = null; broodWeek = null;
    bezig = 0;
  }
  ververs();
  // Pagina opnieuw laden (niet in de Google-versie: daar zit het scherm in een kader dat zichzelf niet kan herladen).
  if (Date.now() - dagWisselSinds > 15 * 60000 && Date.now() - laatsteAanraking > 5 * 60000 && !/googleusercontent/.test(location.hostname)) {
    try { location.reload(); } catch (e) {}
  }
}
setInterval(dagWachter, 60000);

/* Klok bovenin elke paar seconden bijwerken; op een nieuwe minuut ook de nu-lijn in de agenda verplaatsen. */
var laatsteMinuut = nuTijd();
setInterval(function () {
  var t = nuTijd();
  var k = document.querySelector('.hklok'); if (k) k.textContent = t;
  if (t !== laatsteMinuut) {
    laatsteMinuut = t;
    if (tab === 'vandaag' && !iemandBezig() && !document.querySelector('.nacht')) render();
  }
}, 5000);
setInterval(function () { if (!toast) render(); }, 5 * 60000); // "volgende melding" bijwerken

var wasMobiel = isMobiel();
window.addEventListener('resize', function () {
  if (isMobiel() !== wasMobiel) { wasMobiel = isMobiel(); render(); }
});
if (vergrendeld && gezinscode) probeerCode(gezinscode, true);
if (uitGeheugen) setTimeout(ververs, 50);   // meteen tonen wat er was, en direct bijwerken
if (!vergrendeld && isMobiel() && !ik) wieKiezen = true;
render();
</script>
