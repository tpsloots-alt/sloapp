<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gezinsdashboard</title>
<meta name="theme-color" content="#101218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gezin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#101218;--card:#191C24;--card2:#20242E;--line:#2A2E39;--text:#ECEEF3;--muted:#A3AABA;--dim:#8F97A8;--ja:#4ADE80;--nee:#FF8A7A;--onb:#B4BAC8;--warn:#F2C14E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #9CC2FF;outline-offset:2px}
.app{max-width:1400px;margin:0 auto;padding:22px 28px 28px;display:flex;flex-direction:column;gap:18px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.datum{font-size:30px;font-weight:900;letter-spacing:-.5px}
.sub{font-size:15px;color:var(--muted);font-weight:700}
nav{display:flex;gap:8px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 18px;border-radius:26px;border:none;background:#1E222C;color:#C9CEDA;font-size:16px;font-weight:800}
.tab[aria-selected="true"]{background:var(--text);color:var(--bg)}
.status{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:190px}
.toast{font-size:18px;font-weight:900;padding:10px 16px;border-radius:14px}
.card{background:var(--card);border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:22px;font-weight:900}
.kop{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.klein{font-size:13px;color:var(--muted);font-weight:700}
.grid-vandaag{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start}
.kolom{display:flex;flex-direction:column;gap:20px;min-width:0}
.event{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.tijd{width:72px;font-size:18px;font-weight:900}
.etitel{flex:1 1 160px;min-width:0}
.etitel b{display:block;font-size:18px;font-weight:800}
.wie{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);font-weight:700;margin-top:4px;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:44px;padding:0 14px;border-radius:22px;border:1.5px solid;font-size:14px;font-weight:800;white-space:nowrap}
.chip.open{border-style:dashed}
.eters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.eter{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:16px;border:1.5px solid}
.eter .n{font-size:14px;font-weight:800;color:var(--text);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.eter .s{font-size:13px;font-weight:800}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;color:var(--bg);flex:0 0 auto}
.rij{display:flex;align-items:center;gap:12px}
.rij .n{width:100px;font-size:15px;font-weight:800}
.balk{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.balk>div{height:100%;border-radius:5px}
.frac{width:40px;text-align:right;font-size:14px;font-weight:800;color:var(--muted)}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;align-items:start}
.spaar{background:#12141A;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.spaar .pts{font-size:34px;font-weight:900;line-height:1}
.spaar .balk{height:8px;flex:none}
.klus{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:8px 10px;border-radius:14px;border:1.5px solid #323745;background:var(--card2);color:var(--text);text-align:left}
.klus[disabled]{background:transparent;border-color:#262A34;cursor:default}
.klus[disabled] .ktekst{text-decoration:line-through;color:var(--dim)}
.icoon{border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.ktekst{flex:1;min-width:0;font-size:15px;font-weight:800;line-height:1.2}
.ktekst.klein-label{font-size:13px;color:var(--muted)}
.pdots{display:flex;gap:3px;flex:0 0 auto}
.pdots span{width:8px;height:8px;border-radius:50%}
.grid-eten{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.menu{display:flex;align-items:center;gap:14px;min-height:56px;padding:0 16px;border-radius:14px;border:1.5px solid transparent}
.menu.vandaag{background:#232838;border-color:#5B9DFF}
.menu .d{width:36px;font-size:16px;font-weight:900;color:var(--muted)}
.menu .g{flex:1;font-size:18px;font-weight:800}
.menu .g.leeg{color:var(--dim);font-weight:700;font-size:15px}
.invoer{display:flex;gap:10px}
.invoer input{flex:1;min-width:0;height:52px;padding:0 16px;border-radius:14px;border:1.5px solid #3A3F4C;background:#12141A;color:var(--text);font-size:17px;font-weight:700}
.knop{height:52px;padding:0 20px;border-radius:14px;border:none;background:var(--text);color:var(--bg);font-size:16px;font-weight:900}
.knop2{height:44px;padding:0 16px;border-radius:12px;border:1.5px solid #3A3F4C;background:transparent;color:var(--muted);font-size:14px;font-weight:800;align-self:flex-start}
.lijst{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:0 14px;border-radius:12px;border:none;background:var(--card2);color:var(--text);text-align:left}
.vak{width:26px;height:26px;border-radius:8px;border:2px solid #5A6072;display:inline-flex;align-items:center;justify-content:center;color:var(--ja);flex:0 0 auto}
.item.gedaan .vak{border-color:var(--ja);background:rgba(74,222,128,.16)}
.item.gedaan .itekst{text-decoration:line-through;color:var(--dim)}
.itekst{flex:1;font-size:17px;font-weight:800}
.overlay{position:fixed;inset:0;background:rgba(6,7,10,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.pinbox{width:360px;max-width:100%;background:#1E222C;border-radius:24px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:12px}
.pinbox h2{margin:0;font-size:24px;font-weight:900}
.pindots{display:flex;gap:14px;margin:6px 0}
.pindots span{width:18px;height:18px;border-radius:50%;border:2px solid}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.key{height:60px;border-radius:16px;border:none;background:#323846;color:var(--text);font-size:24px;font-weight:800}
.key.s{background:#2A2E39;font-size:15px}
.key[disabled]{opacity:.5}
.fout{color:var(--nee);font-weight:800;font-size:15px;min-height:20px;text-align:center}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.melding{background:rgba(242,193,78,.10);border:1.5px dashed var(--warn);color:var(--warn);border-radius:14px;padding:12px 14px;font-weight:800;font-size:14px}
.leegtekst{color:var(--dim);font-weight:700;font-size:15px;padding:8px 0}
.voet{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-weight:700}
.tab[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.maal{display:flex;flex-direction:column;gap:8px;background:#12141A;border-radius:14px;padding:12px}
.mtitel{font-size:16px;font-weight:900}
.snee{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 12px;border-radius:12px;border:1.5px solid #323745;background:var(--card2);color:var(--text);font-size:15px;font-weight:800;text-align:left}
.snee.plus{border-style:dashed;color:var(--muted);background:transparent;justify-content:center}
.kiesbox{width:600px;max-width:100%;background:#1E222C;border-radius:24px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;max-height:92vh;overflow:auto}
.kiesbox h2{margin:0;font-size:22px;font-weight:900;text-align:center}
.kiesgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:100%}
.kies{min-height:62px;border-radius:14px;border:2px solid #3A3F4C;background:#2A2E39;color:var(--text);font-size:17px;font-weight:800;padding:8px}
.kiesknoppen{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.weekkop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:start}
.dagkol{background:var(--card);border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;gap:8px;min-height:180px;min-width:0}
.dagkol.nu{outline:2px solid #5B9DFF}
.dagkol.voorbij{opacity:.6}
.dagkop{display:flex;align-items:baseline;gap:2px 6px;padding:0 2px 4px;flex-wrap:wrap}
.dagkop b{font-size:17px;font-weight:900;text-transform:capitalize;white-space:nowrap}
.dagkop span{font-size:13px;color:var(--muted);font-weight:700}
.wev{display:flex;flex-direction:column;gap:3px;width:100%;padding:8px 9px;border-radius:12px;border:1.5px solid #323745;background:var(--card2);color:var(--text);text-align:left;min-height:44px}
.wev .t{font-size:12px;font-weight:800;color:var(--muted)}
.wev .n{font-size:14px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.wev .r{display:flex;gap:4px;flex-wrap:wrap;font-size:11px;font-weight:800}
.wev .r span{padding:1px 6px;border-radius:8px;border:1px solid}
.detailbox{width:520px;max-width:100%;background:#1E222C;border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:14px}
.detailbox h2{margin:0;font-size:24px;font-weight:900}
@media (max-width:900px){.weekgrid{grid-template-columns:1fr}.dagkol{min-height:0}}
button.menu{width:100%;background:var(--card2);border:1.5px solid #323745;color:var(--text);text-align:left;cursor:pointer;font-family:inherit}
.menu .potlood{color:var(--muted);display:inline-flex}
.krij{display:flex;flex-direction:column;gap:3px;padding:9px 0;border-top:1px solid var(--line)}
.knog{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:24px}
.knog.klaar{color:var(--ja)}
.kgeld{display:flex;gap:4px 14px;font-size:13px;color:var(--muted);font-weight:700;padding-left:24px;flex-wrap:wrap}
.kgeld b{color:var(--text);font-weight:900}
.kgeld .tegoed{margin-left:auto}
.krij{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px solid var(--line)}
.knog{font-size:13px;font-weight:700;color:var(--muted);padding-left:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.knog.klaar{color:var(--ja)}
.kgeld{display:flex;gap:2px 14px;flex-wrap:wrap;padding-left:24px;font-size:13px;font-weight:700;color:var(--muted)}
.kgeld b{color:var(--text);font-weight:900}
.klusform{width:660px;align-items:stretch;max-height:92vh;overflow:auto}
.veldlabel{font-size:15px;font-weight:900;margin-top:4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.keuze{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid #3A3F4C;background:#2A2E39;color:var(--text);font-size:15px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.keuze[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.knop-rood{height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--nee);background:rgba(255,138,122,.12);color:var(--nee);font-size:14px;font-weight:900}
input[type=date]{color-scheme:dark}
.beheer .klus{min-height:54px}
.beheer .sub{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:2px}
.helpers{display:inline-flex;gap:3px}
.helpers .av{font-size:11px!important}
.helpt-niet{font-size:13px;font-weight:800;color:var(--muted);border:1.5px dashed #3A3F4C;border-radius:12px;padding:3px 8px;white-space:nowrap}
.menu.voorbij{opacity:.6}
.wens{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 8px 6px 12px;border-radius:12px;background:var(--card2)}
.wtekst{flex:1;display:flex;flex-direction:column;min-width:0}
.wtekst b{font-size:16px;font-weight:800}
.wis{width:44px;height:44px;border-radius:12px;border:none;background:transparent;color:var(--muted);font-size:24px;font-weight:700}
.invoer input:disabled,.knop:disabled{opacity:.45;cursor:not-allowed}
.vakantie{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:48px 24px}
.vakantie b{font-size:26px;font-weight:900}
.mee{display:flex;align-items:center;gap:6px;min-height:46px;padding:0 2px 0 6px;border-radius:12px;background:var(--card2)}
.mee .vak{cursor:pointer}
.mee .mtekst{flex:1;font-size:15px;font-weight:800;min-width:0;overflow-wrap:break-word;hyphens:auto}
.mee.ingepakt .mtekst{text-decoration:line-through;color:var(--dim)}
.mee .wis{width:30px;height:44px;flex:0 0 auto;border-radius:10px;border:none;background:transparent;color:var(--muted);font-size:20px;font-weight:900}
.mee .vakknop{border:none;background:transparent;padding:4px 2px;min-height:44px;display:inline-flex;align-items:center}
.event{flex-wrap:nowrap;align-items:flex-start}
.event .tijd{padding-top:1px}
.pillen{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.pil{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:14px;border:1.5px solid;font-size:13px;font-weight:800;white-space:nowrap}
.pil.open{border-style:dashed}
.cat{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:10px;background:#262B37;color:#C9CEDA;font-size:12px;font-weight:800}
.notitie{display:flex;gap:6px;align-items:flex-start;margin-top:5px;font-size:13px;font-weight:700;color:#C9CEDA}
.notitie svg{flex:0 0 auto;margin-top:1px;color:var(--muted)}
.potloodknop{flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:1.5px solid #323745;background:var(--card2);color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.morgenkop{margin-top:10px;padding-top:12px;border-top:2px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:900;color:var(--muted)}
.event.morgen{opacity:.7;padding:9px 0}
.event.morgen b{font-size:15px}
.event.morgen .tijd{font-size:15px}
.event.morgen .potloodknop{width:40px;height:40px}
.wev .t{display:flex;align-items:center;gap:4px}
textarea.veld{width:100%;min-height:84px;box-sizing:border-box;padding:12px 14px;border-radius:14px;border:1.5px solid #3A3F4C;background:#12141A;color:var(--text);font:inherit;font-size:16px;font-weight:700;resize:vertical}
.status{display:none}
.status.heeft-toast{display:flex;position:fixed;top:14px;right:20px;z-index:20}
.status.heeft-toast .toast{background:#1E222C!important;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.kort{display:none}
@media (min-width:1181px){
  header{flex-wrap:nowrap}
  header>div:first-child{flex:1 1 auto;min-width:0}
  header nav{flex:0 0 auto;flex-wrap:nowrap}
}
.xrij{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:12px;background:#12141A;font-size:14px;font-weight:800}
.xrij .xw{flex:1;min-width:0}
.xrij .klein{display:block;font-size:12px;margin-top:2px}
.xrij.wacht{border:1.5px dashed #3A3F4C}
.xrij.goed{border:1.5px solid rgba(74,222,128,.4)}
.xrij.afgewezen{border:1.5px solid rgba(255,138,122,.35);opacity:.8}
.xknop{width:32px;height:32px;flex:0 0 auto;border:none;border-radius:8px;background:transparent;color:var(--muted);font-size:18px;font-weight:900}
.wachtbalk{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:rgba(156,194,255,.10);border:1.5px solid rgba(156,194,255,.45);color:#C7DCFF;font-weight:800;font-size:15px}
.bkaart{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:#262B37}
.bkaart .invoer input{height:46px;font-size:16px}
.puntveld{width:90px!important;flex:0 0 auto!important;text-align:center}
.weerbalk{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:#20242E;font-size:14px;font-weight:800;color:#C9CEDA}
.weerbalk .nu{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:900;color:var(--text)}
.weerbalk .deel{display:flex;align-items:center;gap:5px;color:var(--muted)}
.weertip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:12px;background:rgba(156,194,255,.14);color:#C7DCFF;font-size:13px;font-weight:900}
.rkind{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.rtegels{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.rtegel{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;min-height:76px;padding:6px 2px;border-radius:16px;border:2px solid #323745;background:var(--card2);color:var(--text);font-size:11px;font-weight:800;line-height:1.1;text-align:center}
.rtegel.af{border-color:var(--ja);background:rgba(74,222,128,.14);color:var(--dim)}
.rtegel .vinkje{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--ja);color:#101218;display:flex;align-items:center;justify-content:center}
.doelblok{display:flex;flex-direction:column;gap:5px;margin-top:6px;padding-top:8px;border-top:1px solid #262A34}
.doelblok .titel{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:900}
.doelknop{align-self:flex-start;min-height:36px;padding:0 10px;border-radius:10px;border:1.5px dashed #3A3F4C;background:transparent;color:var(--muted);font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.dagweer{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:800;color:#C9CEDA;white-space:nowrap}
.dagweer .regen{color:#9CC2FF;margin-left:3px}
.slotscherm{display:flex;justify-content:center;padding-top:10vh}
.slotscherm .card{width:420px;max-width:100%;align-items:center;text-align:center;gap:14px}
.slotscherm form{display:flex;flex-direction:column;gap:12px;width:100%}
.slotscherm input{height:56px;border-radius:14px;border:1.5px solid #3A3F4C;background:#12141A;color:var(--text);font:inherit;font-size:20px;font-weight:800;text-align:center;letter-spacing:2px;padding:0 14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:900px){
  .grid-vandaag,.grid-eten{grid-template-columns:1fr}
  .app{padding:16px;gap:14px}
  .datum{font-size:24px}
  .status{align-items:flex-start;min-width:0}
  .card{padding:18px}
}
@media (max-width:480px){
  .eters{grid-template-columns:repeat(3,minmax(0,1fr))}
  main .tab{height:46px;padding:0 14px;font-size:15px}
}
/* ---------- tabletstand & nachtstand ---------- */
.tabletknop{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;border:1.5px solid #323745;background:transparent;color:var(--muted);font-size:14px;font-weight:800}
.tabletknop[aria-pressed="true"]{color:#C9B8FF;border-color:#6E5BB8;background:rgba(155,130,255,.10)}
.nacht{position:fixed;inset:0;background:#000;color:#6B7180;display:flex;align-items:center;justify-content:center;padding:40px;z-index:30;cursor:pointer}
.nacht-in{display:flex;flex-direction:column;align-items:center;gap:22px;max-width:760px;width:100%;transition:transform 2s ease}
.nacht-klok{font-size:clamp(90px,16vw,170px);font-weight:800;line-height:1;letter-spacing:-3px;color:#7A8090;font-variant-numeric:tabular-nums}
.nacht-datum{font-size:22px;font-weight:800;margin-top:-10px}
.nacht-blok{width:100%;border-top:1px solid #1A1C22;padding-top:16px;display:flex;flex-direction:column;gap:10px}
.nacht-kop{font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:#545A68;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nacht-rij{display:flex;gap:14px;align-items:baseline;font-size:19px;font-weight:800}
.nacht-rij .t{min-width:58px;color:#5C6272}
.nacht-rij .w{font-size:15px;font-weight:700;color:#4F5562}
.nacht-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;opacity:.55}
.nacht-hint{font-size:13px;font-weight:700;color:#3E434E}
.nacht svg{opacity:.7}
@media (max-width:1399px){.tabletknop{width:44px;padding:0;justify-content:center}.tabletknop span{display:none}}
@media (max-width:760px){.tabletknop{display:none}}
/* ---------- telefoon ---------- */
.ikknop{display:none}
@media (max-width:760px){
  .app{padding:12px 12px calc(92px + env(safe-area-inset-bottom));gap:12px}
  header{flex-wrap:nowrap;gap:10px}
  header .datum{font-size:22px}
  header .sub{font-size:13px}
  .ikknop{display:inline-flex;align-items:center;gap:8px;margin-left:auto;min-height:44px;padding:0 12px 0 4px;border-radius:24px;border:1.5px solid #323745;background:var(--card2);color:var(--text);font-size:14px;font-weight:800;flex:0 0 auto}
  header nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:#151821;border-top:1px solid var(--line)}
  header nav .tab{flex-direction:column;justify-content:center;height:58px;padding:0 2px;gap:3px;font-size:11px;border-radius:14px;background:transparent;color:var(--muted)}
  header nav .tab svg{display:block}
  header nav .lang{display:none}
  header nav .kort{display:inline}
  .sub .volgende{display:none}
  header nav .tab[aria-selected="true"]{background:#262B37;color:var(--text)}
  .status{display:none}
  .status.heeft-toast{display:flex;position:fixed;top:10px;left:12px;right:12px;align-items:center;z-index:20}
  .status.heeft-toast .toast{background:#1E222C!important;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  .card{padding:16px;border-radius:18px}
  .card h2{font-size:20px}
  .event{gap:8px 12px}
  .tijd{width:auto;min-width:48px;font-size:16px}
  .chips .chip{height:44px;padding:0 12px;font-size:13px}
  .kids{grid-template-columns:1fr}
  .weekkop{gap:8px}
  .dagkol{padding:10px}
  .kgeld{gap:2px 10px}
  .overlay{align-items:flex-end;padding:0}
  .pinbox,.kiesbox,.detailbox{width:100%;max-width:none;border-radius:24px 24px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
  .kiesgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.wiegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;width:100%}
.wie-k{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;border:1.5px solid #3A3F4C;background:#2A2E39;color:var(--text);font-size:14px;font-weight:800;min-height:44px}
.wie-k[aria-pressed="true"]{border-color:var(--text)}
</style>

<script>
/* De web-app-link staat in config.js, zodat je index.html later kunt vervangen zonder hem opnieuw in te vullen. */
var WEBAPP_LINK = window.WEBAPP_LINK || '';

/* Dit doet hetzelfde als google.script.run in Apps Script, maar dan via internet. */
window.google = { script: { run: (function maak(gelukt, mislukt) {
  return {
    withSuccessHandler: function (f) { return maak(f, mislukt); },
    withFailureHandler: function (f) { return maak(gelukt, f); },
    api: function (code, fn, args) {
      var fout = function (tekst, toonbaar) { var e = new Error(tekst); e.toonbaar = !!toonbaar; if (mislukt) mislukt(e); };
      if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(WEBAPP_LINK)) {
        fout('De webapp-link ontbreekt nog in config.js (zie het stappenplan, stap 8).', true); return;
      }
      fetch(WEBAPP_LINK, {
        method: 'POST', redirect: 'follow', credentials: 'omit',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ code: code, fn: fn, args: args || [] })
      }).then(function (r) { return r.json(); })
        .then(function (res) { if (res && res.__fout) fout(res.__fout); else if (gelukt) setTimeout(function () { gelukt(res); }, 0); })
        .catch(function () { fout('Geen verbinding'); });
    }
  };
})() } };
</script>
<script>

/* Laatst bekende data van dit apparaat: het dashboard staat dan meteen op het scherm en wordt op de
   achtergrond bijgewerkt (alleen op apparaten die de gezinscode al hebben). */
var uitGeheugen = false;
if (D.slot && gezinscode) {
  try {
    var bewaard = JSON.parse(localStorage.getItem(DATA_SLEUTEL) || 'null');
    if (bewaard && bewaard.gezin) { D = bewaard; uitGeheugen = true; }
  } catch (e) {}
}

function nieuweData(res) {
  D = res;
  try { if (gezinscode) localStorage.setItem(DATA_SLEUTEL, JSON.stringify(res)); } catch (e) {}
}
/** Alleen als de server zegt dat de code echt niet klopt, vergeet dit apparaat hem. */
function codeEchtFout(res) {
  return res && (res.reden === 'fout' || (!res.reden && res.fout === 'Deze code klopt niet.'));
}
function vergeetCode() {

function svg(naam, maat, dikte) {
  return '<svg width="' + maat + '" height="' + maat + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' +
    (dikte || 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[naam] || ICONS.overig) + '</svg>';
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
var CATEGORIEEN = [['sport', 'Sport'], ['spelen', 'Spelen'], ['muziek', 'Muziek'], ['scouting', 'Scouting'],
  ['school', 'School'], ['zorg', 'Arts/zorg'], ['feest', 'Feest'], ['overig', 'Overig']];
function catNaam(c) { var x = CATEGORIEEN.filter(function (k) { return k[0] === c; })[0]; return x ? x[1] : ''; }
var bewerkA = null;
var spaarForm = null;    // {kind, doel, punten}
var routineMoment = new Date().getHours() < 12 ? 'ochtend' : 'avond';
var extraForm = null;    // {kind, wat, datum: 'vandaag'|'gisteren', voorstel}
var beoordeel = null;    // {punten: {id: n}, reden: {id: tekst}, geef: {kind, wat, punten}}
var EXTRA_SNEL = [1, 2, 3, 5, 10, 25];      // formulier 'afspraak bewerken'
var ZELF = { id: 'zelf', naam: 'Zelf', kleur: '#8F97A8', rol: 'extra' };
var OPA_OMA = { id: 'opa_oma', naam: 'Opa/Oma', kleur: '#C9CED8', rol: 'extra' };
function persoon(id) {
  if (id === OPA_OMA.id) return OPA_OMA;
  if (id === ZELF.id) return ZELF;
  return D.gezin.filter(function (p) { return p.id === id; })[0];
}
function kinderen() { return D.gezin.filter(function (p) { return p.rol === 'kind'; }); }
function isMobiel() { return window.matchMedia('(max-width: 760px)').matches; }
/** Op een telefoon van een kind: alleen dat kind. Op de tablet en bij ouders: alle kinderen. */
function mijnKind() {
  if (!isMobiel() || !ik) return null;
  var p = persoon(ik);
  return p && p.rol === 'kind' ? p : null;
}
function zichtbareKinderen() { var k = mijnKind(); return k ? [k] : kinderen(); }
function zetIk(id) {
  ik = id || 'gezin';
  try { localStorage.setItem('gezinsdashboard-ik', ik); } catch (e) {}
}
function renderWie(laag) {
  var knoppen = D.gezin.map(function (p) {
    return '<button type="button" class="wie-k" data-act="ikKies" data-id="' + esc(p.id) + '" aria-pressed="' + (ik === p.id) + '">' + av(p, 48) + esc(p.naam) + '</button>';
  }).join('');
  laag.innerHTML = '<div class="overlay"><div class="detailbox" role="dialog" aria-modal="true" aria-label="Wie ben jij?">' +
    '<h2>Wie ben jij?</h2><div class="klein" style="font-size:15px">Deze telefoon onthoudt het. Kinderen zien dan alleen hun eigen klusjes en schooldag.</div>' +
    '<div class="wiegrid">' + knoppen + '</div>' +
    '<button type="button" class="knop2" data-act="ikKies" data-id="gezin">Hele gezin tonen</button></div></div>';
}
function ouders() { return D.gezin.filter(function (p) { return p.rol === 'ouder'; }); }
function av(p, maat) {
  return '<span class="av" style="width:' + maat + 'px;height:' + maat + 'px;font-size:' + Math.round(maat * .42) +
    'px;background:' + esc(p.kleur) + '">' + esc(p.naam.charAt(0)) + '</span>';
}
function euro(pts) { return '€ ' + (Math.max(0, pts) / 25).toFixed(2).replace('.', ','); }
function hoofdletter(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

/* ---------------- weergave ---------------- */

/* ---------------- tabletstand: scherm aan houden + nachtstand ---------------- */
var tabletStand = (function () { try { return localStorage.getItem('gezinsdashboard-tablet') === '1'; } catch (e) { return false; } })();
var wekker = null;            // de 'scherm aan'-vergrendeling van de browser
var wakkerTot = 0;            // in de nachtstand: tot wanneer het gewone dashboard open blijft na een tik
var WAKKER_MS = 3 * 60000;

function houdSchermAan(klaar) {
  if (!tabletStand || document.hidden) return;
  if (wekker) { if (klaar) klaar(true); return; }
  if (!navigator.wakeLock) { if (klaar) klaar(false); return; }
  navigator.wakeLock.request('screen').then(function (l) {
    wekker = l;
    l.addEventListener('release', function () { wekker = null; });
    if (klaar) klaar(true);
  }, function () { if (klaar) klaar(false); });   // niet toegestaan: dan geldt de gewone time-out van de tablet
}
function laatSchermLos() { if (wekker) { try { wekker.release(); } catch (e) {} wekker = null; } }
function zetTabletStand(aan) {
  tabletStand = aan;
  try { localStorage.setItem('gezinsdashboard-tablet', aan ? '1' : '0'); } catch (e) {}
  if (!aan) { laatSchermLos(); zegt('Tabletstand uit', '#C9B8FF'); return; }
  houdSchermAan(function (gelukt) {
    zegt(gelukt ? 'Tabletstand aan: scherm blijft aan' : 'Tabletstand aan (scherm aan houden lukt niet in deze browser: zet "Actief blijven" aan op de tablet)', '#C9B8FF');
  });
}

function nachtTijden() { return (D && D.nacht) || { van: '20:00', tot: '07:00' }; }
function minuten(hhmm) { var p = String(hhmm).split(':'); return Number(p[0]) * 60 + Number(p[1] || 0); }
function isNacht() {
  var n = new Date(), nu = n.getHours() * 60 + n.getMinutes();
  var van = minuten(nachtTijden().van), tot = minuten(nachtTijden().tot);
  return van > tot ? (nu >= van || nu < tot) : (nu >= van && nu < tot);
}
function iemandBezig() {
  return !!(pin || keuze || detail || menuEdit || klusForm || helpDag || meeForm || wieKiezen || extraForm || beoordeel || spaarForm);
}
function toonNacht() {
  return tabletStand && !isMobiel() && isNacht() && Date.now() > wakkerTot && !iemandBezig();
}

function renderNacht() {
  var n = new Date();
  var klok = ('0' + n.getHours()).slice(-2) + ':' + ('0' + n.getMinutes()).slice(-2);
  // Na middernacht gaat 'morgen' over vandaag; daarvoor over morgen.
  var naMiddernacht = n.getHours() < 12;
  var dagDatum = naMiddernacht ? D.vandaag : D.morgen;
  var dag = ((D.agenda || {}).dagen || []).filter(function (d) { return d.datum === dagDatum; })[0];
  var titel = naMiddernacht ? 'Vandaag' : 'Morgen';
  var w = weerVoor(dagDatum);
  var weer = w ? '<span style="display:inline-flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-weight:800">' + svg(w.icoon, 18) + esc(w.tekst) + ' · ' + w.min + '–' + w.max + '°' +
    (w.kans >= 30 ? ' · ' + w.kans + '% regen' : '') + '</span>' : '';
  var lijst = dag ? dag.events.slice(0, 6).map(function (e) {
    var wie = e.wie.map(persoon).filter(Boolean);
    var rit = '';
    if (e.kind && !e.heleDag) {
      var b = e.breng && persoon(e.breng), h = e.haal && persoon(e.haal);
      rit = ' · breng ' + (b ? b.naam : '?') + ' · haal ' + (h ? h.naam : '?');
    }
    return '<div class="nacht-rij"><span class="t">' + esc(e.tijd) + '</span><span>' + esc(e.titel) +
      '<div class="w">' + wie.map(function (p) { return '<span class="nacht-dot" style="background:' + esc(p.kleur) + '"></span>' + esc(p.naam); }).join(' ') + esc(rit) + '</div></span></div>';
  }).join('') : '';
  if (dag && dag.events.length > 6) lijst += '<div class="nacht-hint">en nog ' + (dag.events.length - 6) + ' meer</div>';
  var mee = (D.meenemen || []).filter(function (x) { return x.datum === dagDatum && !x.ingepakt; });
  var meeHtml = mee.length ? '<div class="nacht-blok"><div class="nacht-kop">' + svg('tas', 16) + 'Mee naar school</div>' +
    mee.map(function (x) { var k = persoon(x.kind) || { naam: '', kleur: '#555' }; return '<div class="nacht-rij"><span><span class="nacht-dot" style="background:' + esc(k.kleur) + '"></span>' + esc(k.naam) + ': ' + esc(x.wat) + '</span></div>'; }).join('') + '</div>' : '';
  // Elke minuut een paar pixels verschuiven, zodat er niets in het scherm inbrandt.
  var m = n.getMinutes(), dx = ((m * 7) % 21) - 10, dy = ((m * 11) % 21) - 10;
  document.getElementById('app').innerHTML = '<div class="nacht" data-act="nachtWakker" role="button" aria-label="Nachtstand. Tik om het dashboard te openen">' +
    '<div class="nacht-in" style="transform:translate(' + dx + 'px,' + dy + 'px)">' +
    '<div class="nacht-klok">' + klok + '</div><div class="nacht-datum">' + esc(hoofdletter(D.datumTekst || '')) + '</div>' +
    '<div class="nacht-blok"><div class="nacht-kop">' + titel + (dag ? ' · ' + esc(dag.dag + ' ' + dag.nr) : '') + ' ' + weer + '</div>' +
    (lijst || '<div class="nacht-rij" style="color:#4F5562">Geen afspraken</div>') + '</div>' + meeHtml +
    '<div class="nacht-hint">Tik om het dashboard te openen</div></div></div>';
  document.getElementById('laag').innerHTML = '';
}

function render() {
  if (vergrendeld) { renderSlot(); return; }
  if (toonNacht()) { renderNacht(); return; }
  var bewaard = ['nieuw', 'wens'].map(function (id) {
    var el = document.getElementById(id);
    return el ? { id: id, v: el.value, f: document.activeElement === el } : null;
  }).filter(Boolean);

  document.getElementById('app').innerHTML = kop() +
    (tab === 'vandaag' ? vandaag() : tab === 'week' ? week() : tab === 'klusjes' ? klusjes() : tab === 'brood' ? brood() : eten());

  bewaard.forEach(function (b) {
    var el = document.getElementById(b.id);
    if (el) { el.value = b.v; if (b.f) el.focus(); }
  });
  renderPin();
}

function kop() {
  var tabs = [['vandaag', 'Vandaag', 'agenda'], ['week', 'Week', 'week'], ['klusjes', 'Klusjes', 'taken'], ['brood', 'Schooldag', 'tas'], ['eten', 'Eten & boodschappen', 'kar', 'Eten']];
  var h = new Date().getHours();
  var volgende = h < D.meldingEten ? D.meldingEten + ':00 · mee-eten' :
    h < D.meldingOverig ? D.meldingOverig + ':00 · ritten en klusjes' : 'morgen ' + D.meldingEten + ':00 · mee-eten';
  var rechts = toast ? '<div class="toast" role="status" style="color:' + toast.kleur + '">' + esc(toast.tekst) + '</div>' : '';
  var mij = ik && ik !== 'gezin' ? persoon(ik) : null;
  var ikKnop = '<button type="button" class="ikknop" data-act="ikOpen" aria-label="Wie ben jij? Nu: ' + esc(mij ? mij.naam : 'hele gezin') + '">' +
    (mij ? av(mij, 34) : '<span class="av" style="width:34px;height:34px;background:#9CC2FF;font-size:13px">' + svg('agenda', 18) + '</span>') +
    '<span>' + esc(mij ? mij.naam : 'Gezin') + '</span></button>';
  var tabletKnop = '<button type="button" class="tabletknop" data-act="tabletStand" aria-pressed="' + tabletStand + '" title="Scherm blijft aan; van ' + esc(nachtTijden().van) + ' tot ' + esc(nachtTijden().tot) + ' rustige nachtstand">' +
    svg('pyjama', 18) + '<span>Tabletstand' + (tabletStand ? ' aan' : '') + '</span></button>';
  return '<header><div><div class="datum">' + esc(hoofdletter(D.datumTekst)) + '</div><div class="sub">Ons gezin · week ' + D.week +
    '<span class="volgende"> · volgende melding ' + esc(volgende) + '</span></div></div>' + ikKnop + '<nav aria-label="Onderdelen" role="tablist">' + tabs.map(function (t) {
      return '<button type="button" class="tab" role="tab" aria-selected="' + (tab === t[0]) + '" data-act="tab" data-id="' + t[0] + '">' +
        svg(t[2], 22) + (t[3] ? '<span class="lang">' + t[1] + '</span><span class="kort">' + t[3] + '</span>' : '<span>' + t[1] + '</span>') + '</button>';
    }).join('') + '</nav>' + tabletKnop + '<div class="status' + (toast ? ' heeft-toast' : '') + '" aria-live="polite">' + rechts + '</div></header>';
}

function vandaag() {
  var mk = mijnKind();
  var a = { fout: (D.agenda || {}).fout, lijst: vandaagEvents().filter(function (e) { return !mk || !e.wie.length || e.wie.indexOf(mk.id) >= 0; }) };
  var events = a.fout ? '<div class="melding">' + esc(a.fout) + '</div>' :
    !a.lijst.length ? '<div class="leegtekst">Geen afspraken vandaag.</div>' :
    a.lijst.map(function (e) { return afspraakRij(e, false); }).join('');
  var morgenDag = ((D.agenda || {}).dagen || []).filter(function (d) { return d.datum === D.morgen; })[0];
  var morgenLijst = morgenDag ? morgenDag.events.filter(function (e) { return !mk || !e.wie.length || e.wie.indexOf(mk.id) >= 0; }) : [];
  var morgenHtml = a.fout || !morgenDag ? '' : '<div class="morgenkop"><span>Morgen · ' + esc(morgenDag.dag + ' ' + morgenDag.nr) + '</span>' +
    '<span class="klein">' + morgenLijst.length + (morgenLijst.length === 1 ? ' afspraak' : ' afspraken') + '</span></div>' +
    (function () {
      var w = weerVoor(D.morgen);
      if (!w) return '';
      var deel = function (naam, x) { return x ? '<span class="deel">' + svg(x.icoon, 15) + naam + ' ' + x.temp + '°' + (x.kans >= 20 ? ' · ' + x.kans + '% regen' : '') + '</span>' : ''; };
      return '<div class="weerbalk" style="opacity:.8;margin-top:6px;font-size:13px"><span class="nu" style="font-size:15px">' + svg(w.icoon, 20) + esc(w.tekst) + ' · ' + w.min + '–' + w.max + '°</span>' +
        deel('ochtend', w.ochtend) + deel('middag', w.middag) +
        w.tips.map(function (t) { return '<span class="weertip">' + esc(t) + '</span>'; }).join('') + '</div>';
    })() +
    (morgenLijst.map(function (e) { return afspraakRij(e, true); }).join('') || '<div class="leegtekst" style="opacity:.7">Nog niets gepland.</div>');

  var tel = { ja: 0, nee: 0, onb: 0 };
  var eters = D.gezin.map(function (p) {
    var st = D.eten[p.id] || 'onb'; tel[st]++;
    var s = ST[st];
    return '<button type="button" class="eter" data-act="eet" data-id="' + esc(p.id) + '" style="border-color:' + (st === 'onb' ? '#3A3F4C' : s.c + '66') + ';background:' + s.bg + '" aria-label="' + esc(p.naam) + ': ' + ETEN_L[st] + ', tik om te wijzigen">' +
      '<span style="opacity:' + (st === 'nee' ? .45 : 1) + '">' + av(p, 38) + '</span><span class="n">' + esc(p.naam) + '</span><span class="s" style="color:' + s.c + '">' + ETEN_L[st] + '</span></button>';
  }).join('');

  var verdiend = 0;
  var samenvatting = zichtbareKinderen().map(function (k) {
    var lijst = D.klusjes.filter(function (c) { return c.kind === k.id; });
    var open = lijst.filter(function (c) { return !c.gedaan; });
    lijst.forEach(function (c) { if (c.gedaan) verdiend += c.punten; });
    var klaar = lijst.length - open.length;
    var verd = (D.verdiend || {})[k.id] || 0, uit = (D.uitbetaald || {})[k.id] || 0;
    var nog = !lijst.length ? 'Vandaag geen klusjes' : !open.length ? '✓ Alles gedaan' :
      'Nog: ' + open.map(function (c) { return c.klus; }).join(', ');
    return '<div class="krij"><div class="rij"><span class="dot" style="width:12px;height:12px;background:' + esc(k.kleur) + '"></span><span class="n">' + esc(k.naam) + '</span>' +
      '<div class="balk"><div style="width:' + (lijst.length ? klaar / lijst.length * 100 : 0) + '%;background:' + esc(k.kleur) + '"></div></div>' +
      '<span class="frac">' + (lijst.length ? klaar + '/' + lijst.length : '–') + '</span></div>' +
      '<div class="knog' + (lijst.length && !open.length ? ' klaar' : '') + '" title="' + esc(nog) + '">' + esc(nog) + '</div>' +
      '<div class="kgeld"><span>Verdiend <b>' + euro(verd) + '</b></span><span>Uitbetaald <b>' + euro(uit) + '</b></span>' +
      '<span class="tegoed">Tegoed <b style="color:' + esc(k.kleur) + '">' + euro(verd - uit) + '</b></span></div></div>';
  }).join('');
  var openRitten = (a.lijst || []).filter(function (e) { return e.kind && !e.heleDag; })
    .reduce(function (n, e) { return n + (e.breng ? 0 : 1) + (e.haal ? 0 : 1); }, 0);

  return '<main class="grid-vandaag">' +
    '<section class="card"><div class="kop"><h2>Agenda vandaag</h2><span class="klein">Google Agenda · Gezin</span></div>' + weerBalk() + events + morgenHtml +
    '<div class="klein" style="margin-top:6px">Tik op ✏️ om aan te passen wie er gaat, brengt of haalt, of om een notitie of categorie toe te voegen.</div></section>' +
    '<div class="kolom">' + routineKaart() +
    '<section class="card"><div class="kop"><h2>Wie eet er mee?</h2><span class="klein">Melding om ' + D.meldingEten + ':00</span></div>' +
    '<div class="eters">' + eters + '</div><div style="font-size:15px;font-weight:800;color:#C9CEDA">' + tel.ja + ' eten mee · ' + tel.nee + ' niet · ' + tel.onb + ' weet nog niet</div></section>' +
    '<section class="card" style="gap:0"><div class="kop" style="padding-bottom:8px"><h2>Klusjes</h2><span class="klein">Vandaag ' + verdiend + (verdiend === 1 ? ' punt' : ' punten') + ' verdiend · 25 punten = € 1</span></div>' +
    (mijnKind() ? '' : (wachtend().length ? '<div style="padding-top:10px">' + wachtBalk() + '</div>' : '')) + samenvatting + '</section>' +
    '</div></main>';
}

function weerVoor(datum) {
  var w = D.weer;
  return w && w.dagen ? w.dagen.filter(function (d) { return d.datum === datum; })[0] : null;
}

/** Klein weerlabel per dag in het weekoverzicht (verder dan een week vooruit iets lichter: minder zeker). */
function dagWeer(d) {
  var w = weerVoor(d.datum);
  if (!w || d.datum < D.vandaag) return '';
  var p = d.datum.split('-').map(Number), q = D.vandaag.split('-').map(Number);
  var vooruit = Math.round((Date.UTC(p[0], p[1] - 1, p[2]) - Date.UTC(q[0], q[1] - 1, q[2])) / 86400000);
  return '<span class="dagweer" title="' + esc(w.tekst + ', ' + w.min + '–' + w.max + '°' + (w.kans >= 30 ? ', ' + w.kans + '% kans op regen' : '') + (w.tips.length ? ' · ' + w.tips.join(' · ') : '')) + '"' +
    (vooruit > 7 ? ' style="opacity:.6"' : '') + '>' + svg(w.icoon, 16) + w.min + '–' + w.max + '°' + (w.kans >= 30 ? '<span class="regen">' + w.kans + '%</span>' : '') + '</span>';
}

function weerBalk() {
  var w = D.weer;
  if (!w) return '';
  if (w.fout) return '<div class="weerbalk">' + svg('wolk', 18) + '<span>' + esc(w.fout) + '</span></div>';
  var d = weerVoor(D.vandaag);
  if (!d) return '';
  var deel = function (naam, x) { return x ? '<span class="deel">' + svg(x.icoon, 16) + naam + ' ' + x.temp + '°' + (x.kans >= 20 ? ' · ' + x.kans + '% regen' : '') + '</span>' : ''; };
  var h = new Date().getHours();
  return '<div class="weerbalk" aria-label="Weer in ' + esc(w.plaats) + '"><span class="nu">' + svg(w.nu.icoon, 24) + w.nu.temp + '°</span>' +
    '<span>' + esc(w.nu.tekst) + ' · ' + d.min + '–' + d.max + '°</span>' +
    (h < 12 ? deel('ochtend', d.ochtend) : '') + (h < 18 ? deel('middag', d.middag) : '') + deel('avond', d.avond) +
    d.tips.map(function (t) { return '<span class="weertip">' + esc(t) + '</span>'; }).join('') + '</div>';
}

function routineKaart() {
  var r = D.routines;
  if (!r || !r.kinderen || !r.kinderen.length) return '';
  var mk = mijnKind();
  var kinderenR = r.kinderen.filter(function (id) { return !mk || id === mk.id; });
  if (!kinderenR.length) return '';
  var schakel = '<div class="chips">' + [['ochtend', 'Ochtend'], ['avond', 'Avond']].map(function (m) {
    return '<button type="button" class="keuze" data-act="rMoment" data-id="' + m[0] + '" aria-pressed="' + (routineMoment === m[0]) + '" style="min-height:40px">' + m[1] + '</button>';
  }).join('') + '</div>';
  var rijen = kinderenR.map(function (id) {
    var k = persoon(id); if (!k) return '';
    var lijst = (r.stappen[id] || {})[routineMoment] || [];
    var af = lijst.filter(function (s) { return s.gedaan; }).length;
    var tegels = lijst.map(function (s) {
      return '<button type="button" class="rtegel' + (s.gedaan ? ' af' : '') + '" data-act="rStap" data-id="' + esc(id + '|' + s.id) + '" aria-pressed="' + s.gedaan + '" aria-label="' + esc(k.naam + ': ' + s.stap) + (s.gedaan ? ', gedaan' : '') + '"' +
        (s.gedaan ? '' : ' style="color:' + esc(k.kleur) + '"') + '>' + svg(s.icoon, 30) + '<span style="color:var(--text)">' + esc(s.stap) + '</span>' +
        (s.gedaan ? '<span class="vinkje">' + svg('vink', 14, 3) + '</span>' : '') + '</button>';
    }).join('');
    return '<div class="rkind"><div class="rij" style="gap:10px">' + av(k, 32) + '<b style="font-size:16px">' + esc(k.naam) + '</b>' +
      '<span class="klein" style="margin-left:auto">' + (lijst.length && af === lijst.length ? '✓ Klaar! +' + r.bonus + (r.bonus === 1 ? ' punt' : ' punten') : af + '/' + lijst.length) + '</span></div>' +
      '<div class="rtegels">' + (tegels || '<span class="leegtekst">Geen stappen</span>') + '</div></div>';
  }).join('');
  return '<section class="card" style="gap:6px"><div class="kop" style="align-items:center"><h2>' + (routineMoment === 'ochtend' ? 'Ochtendroutine' : 'Avondroutine') + '</h2>' + schakel + '</div>' + rijen + '</section>';
}

function doelBlok(k, tegoed) {
  var s = (D.spaardoelen || {}), d = (s.doelen || {})[k.id];
  if (!d) return '<div class="doelblok"><button type="button" class="doelknop" data-act="doelOpen" data-id="' + esc(k.id) + '">' + svg('doel', 16) + 'Spaardoel kiezen</button></div>';
  var pct = Math.max(0, Math.min(100, tegoed / d.punten * 100));
  var nog = d.punten - tegoed, tempo = (s.perDag || {})[k.id] || 0;
  var tekst = nog <= 0 ? '<b style="color:var(--ja)">Doel bereikt!</b>' :
    'Nog ' + nog + ' punten' + (tempo > 0 ? ' · ' + (Math.ceil(nog / tempo) > 365 ? 'nog meer dan een jaar sparen' : 'ongeveer ' + Math.ceil(nog / tempo) + (Math.ceil(nog / tempo) === 1 ? ' dag' : ' dagen')) : '');
  return '<div class="doelblok"><button type="button" class="doelknop" data-act="doelOpen" data-id="' + esc(k.id) + '" style="border:none;padding:0;min-height:30px;color:var(--text)" aria-label="Spaardoel aanpassen: ' + esc(d.doel) + '">' +
    '<span class="titel">' + svg('doel', 16) + esc(d.doel) + '</span></button>' +
    '<div class="balk" style="height:8px;flex:none"><div style="width:' + pct + '%;background:' + esc(k.kleur) + '"></div></div>' +
    '<div class="klein" style="font-size:12px">' + tegoed + ' van ' + d.punten + ' punten (' + euro(d.punten) + ') · ' + tekst + '</div></div>';
}

function renderSpaar(laag) {
  var f = spaarForm, k = persoon(f.kind) || { naam: '?', kleur: '#ECEEF3' };
  var heeft = !!((D.spaardoelen || {}).doelen || {})[f.kind];
  laag.innerHTML = '<div class="overlay"><form class="detailbox klusform" data-form="spaar" role="dialog" aria-modal="true" aria-label="Spaardoel">' +
    '<div class="rij" style="gap:12px">' + av(k, 48) + '<h2>Waar spaar jij voor?</h2></div>' +
    '<div class="invoer"><label class="sr" for="s-doel">Spaardoel</label><input id="s-doel" type="text" maxlength="60" autocomplete="off" placeholder="Bijv. LEGO-set" value="' + esc(f.doel) + '"></div>' +
    '<div class="veldlabel">Hoeveel punten heb je nodig? <span class="klein">25 punten = € 1</span></div>' +
    '<div class="invoer" style="align-items:center"><label class="sr" for="s-punten">Punten</label><input id="s-punten" class="puntveld" style="width:120px!important" type="number" inputmode="numeric" min="1" max="10000" value="' + esc(f.punten) + '">' +
    '<span class="klein" id="s-euro">= ' + euro(Number(f.punten) || 0) + '</span></div>' +
    '<div class="fout" style="text-align:left">' + esc(f.fout || '') + '</div>' +
    '<div class="chips"><button type="submit" class="knop">Opslaan</button>' +
    (heeft ? '<button type="button" class="knop2" data-act="doelWeg" style="align-self:center">Doel weghalen</button>' : '') +
    '<button type="button" class="knop2" data-act="doelSluit" style="align-self:center">Annuleren</button></div></form></div>';
  if (f.focus) { f.focus = false; document.getElementById('s-doel').focus(); }
}

function bewaarSpaar(doel, punten) {
  var f = spaarForm; spaarForm = null;
  var k = persoon(f.kind) || {};
  if (ouderActief()) {
    zegt(punten ? 'Spaardoel opgeslagen' : 'Spaardoel weggehaald', k.kleur);
    bewaar('zetSpaardoel', [f.kind, doel, punten, ouderSessie.pin]); return;
  }
  vraagKindPin(f.kind, punten ? 'Spaardoel: ' + doel + ' (' + punten + ' punten)' : 'Spaardoel weghalen', 'zetSpaardoel', [f.kind, doel, punten],
    punten ? 'Spaardoel opgeslagen!' : 'Spaardoel weggehaald');
}

function pil(kleur, tekst, open) {
  return '<span class="pil' + (open ? ' open' : '') + '" style="color:' + esc(kleur) + ';border-color:' + esc(kleur) + (open ? ';background:rgba(242,193,78,.10)' : '') + '">' + esc(tekst) + '</span>';
}

/** Eén afspraak op Vandaag: alleen tonen, aanpassen via het potlood. */
function afspraakRij(e, morgen) {
  var wie = e.wie.map(persoon).filter(Boolean);
  var wieHtml = wie.length ? wie.map(function (p) { return '<span class="dot" style="background:' + esc(p.kleur) + '"></span>'; }).join('') +
    '<span>' + esc(wie.map(function (p) { return p.naam; }).join(' & ')) + '</span>' : '<span>Gezin</span>';
  var cat = e.categorie ? '<span class="cat">' + svg(e.categorie, 13) + esc(catNaam(e.categorie)) + '</span>' : '';
  var pillen = '';
  if (e.kind && !e.heleDag) {
    var b = e.breng && persoon(e.breng), h = e.haal && persoon(e.haal);
    pillen = '<div class="pillen">' + pil(ST[e.status].c, GAAT_L[e.status]) +
      pil(b ? b.kleur : '#F2C14E', 'Breng: ' + (b ? b.naam : '?'), !b) + pil(h ? h.kleur : '#F2C14E', 'Haal: ' + (h ? h.naam : '?'), !h) + '</div>';
  }
  var notitie = e.notitie ? '<div class="notitie">' + svg('notitie', 14) + '<span>' + esc(e.notitie) + '</span></div>' : '';
  return '<div class="event' + (morgen ? ' morgen' : '') + '"><div class="tijd">' + esc(e.tijd) + '</div>' +
    '<div class="etitel"><b>' + esc(e.titel) + '</b><div class="wie">' + wieHtml + cat + '</div>' + notitie + pillen + '</div>' +
    '<button type="button" class="potloodknop" data-act="detail" data-id="' + esc(e.sleutel) + '" aria-label="' + esc(e.titel) + ' bewerken">' + svg('potlood', 20) + '</button></div>';
}

function ritChip(e, veld, label) {
  var p = e[veld] ? persoon(e[veld]) : null;
  var stijl = p ? 'color:' + esc(p.kleur) + ';border-color:' + esc(p.kleur) + ';background:rgba(255,255,255,.04)' :
    'color:var(--warn);border-color:var(--warn);background:rgba(242,193,78,.10)';
  return '<button type="button" class="chip' + (p ? '' : ' open') + '" data-act="' + veld + '" data-id="' + esc(e.sleutel) + '" style="' + stijl +
    '" aria-label="' + (veld === 'breng' ? 'Wie brengt' : 'Wie haalt') + ': ' + (p ? esc(p.naam) : 'nog niemand') + ', tik om te wisselen">' + label + ': ' + (p ? esc(p.naam) : '?') + '</button>';
}

function klusjes() {
  if (beheer && ouderActief()) return klusBeheer();
  beheer = false;
  var kaarten = zichtbareKinderen().map(function (k) {
    var pts = D.punten[k.id] || 0;
    var rest = 25 - (((pts % 25) + 25) % 25);
    var maat = k.leeftijd && k.leeftijd < 6 ? 52 : k.leeftijd && k.leeftijd < 8 ? 46 : 36;
    var lijst = D.klusjes.filter(function (c) { return c.kind === k.id; });
    var knoppen = lijst.map(function (c) {
      var dots = ''; for (var i = 0; i < c.punten; i++) dots += '<span style="background:' + (c.gedaan ? '#4A5060' : esc(k.kleur)) + '"></span>';
      return '<button type="button" class="klus" data-act="klus" data-id="' + esc(c.id) + '"' + (c.gedaan ? ' disabled' : '') +
        ' aria-label="' + esc(c.klus) + ', ' + c.punten + (c.punten === 1 ? ' punt' : ' punten') + (c.gedaan ? ', gedaan' : '') + '">' +
        '<span class="icoon" style="width:' + maat + 'px;height:' + maat + 'px;background:' + (c.gedaan ? 'rgba(74,222,128,.16)' : esc(k.kleur) + '26') + ';color:' + (c.gedaan ? 'var(--ja)' : esc(k.kleur)) + '">' +
        svg(c.gedaan ? 'vink' : c.icoon, maat > 40 ? 28 : 22, c.gedaan ? 2.5 : 2) + '</span>' +
        '<span class="ktekst' + (maat === 52 ? ' klein-label' : '') + '">' + esc(c.klus) + '</span><span class="pdots">' + dots + '</span></button>';
    }).join('');
    return '<section class="card" style="padding:18px"><div class="rij" style="gap:10px">' + av(k, 44) +
      '<div><div style="font-size:18px;font-weight:900">' + esc(k.naam) + '</div><div class="klein">' + (k.leeftijd ? k.leeftijd + ' jaar' : '') + '</div></div></div>' +
      '<div class="spaar"><div><span class="pts" style="color:' + esc(k.kleur) + '">' + pts + '</span> <span class="klein" style="font-size:14px">punten</span></div>' +
      '<div style="font-size:15px;font-weight:800">' + euro(pts) + ' tegoed</div>' +
      '<div class="klein" style="font-size:12px">Verdiend ' + euro((D.verdiend || {})[k.id] || 0) + ' · uitbetaald ' + euro((D.uitbetaald || {})[k.id] || 0) + '</div>' +
      '<div class="balk"><div style="width:' + ((25 - rest) / 25 * 100) + '%;background:' + esc(k.kleur) + '"></div></div>' +
      '<div class="klein" style="font-size:12px">Nog ' + rest + ' punten tot de volgende euro</div>' + doelBlok(k, pts) + '</div>' +
      (knoppen || '<div class="leegtekst">Vandaag geen klusjes</div>') + extraLijst(k) + '</section>';
  }).join('');
  return '<main style="display:flex;flex-direction:column;gap:14px">' + wachtBalk() + '<div class="kids">' + kaarten + '</div>' +
    '<div class="voet" style="align-items:center"><span>Tik op een klus en typ je pincode om hem af te vinken. 1–3 punten per klus · 25 punten = € 1</span>' +
    '<span class="chips"><button type="button" class="knop2" data-act="beoordeelOpen">+ Extra punten geven</button>' +
    '<button type="button" class="knop2" data-act="beheerAan" style="display:inline-flex;align-items:center;gap:8px">' + svg('potlood', 18) + 'Klusjes beheren</button></span></div></main>';
}

function wachtend() { return (D.extra || []).filter(function (x) { return x.status === 'wacht'; }); }

function wachtBalk() {
  var w = wachtend();
  var mk = mijnKind();
  if (mk) w = w.filter(function (x) { return x.kind === mk.id; });
  if (!w.length || mk) return '';
  return '<div class="wachtbalk"><span>' + w.length + (w.length === 1 ? ' extra klus wacht' : ' extra klusjes wachten') + ' op goedkeuring</span>' +
    '<button type="button" class="knop" data-act="beoordeelOpen" style="height:44px">Beoordelen</button></div>';
}

function gisteren() {
  var p = D.vandaag.split('-').map(Number);
  var d = new Date(Date.UTC(p[0], p[1] - 1, p[2] - 1));
  return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2);
}

function dagLabel(d) { return d === D.vandaag ? 'vandaag' : datumKort(d); }

/** Extra klusjes van één kind (laatste 14 dagen) + knop om er een aan te melden. */
function extraLijst(k) {
  var mag = (D.extraKinderen || []).indexOf(k.id) >= 0;
  var lijst = (D.extra || []).filter(function (x) { return x.kind === k.id; }).slice(0, 4);
  var rijen = lijst.map(function (x) {
    var st = x.status === 'goed' ? '<span class="klein" style="color:var(--ja)">✓ Goedgekeurd: +' + x.punten + ' punten</span>' :
      x.status === 'afgewezen' ? '<span class="klein" style="color:var(--nee)">Afgewezen' + (x.reden ? ': ' + esc(x.reden) : '') + '</span>' :
      '<span class="klein">Wacht op goedkeuring · voorstel ' + x.voorstel + ' punten</span>';
    return '<div class="xrij ' + esc(x.status) + '"><span class="xw">' + esc(x.wat) + ' <span class="klein" style="display:inline;color:var(--muted)">(' + dagLabel(x.datum) + ')</span>' + st + '</span>' +
      (x.status === 'wacht' ? '<button type="button" class="xknop" data-act="extraIntrek" data-id="' + esc(x.id) + '" aria-label="Aanmelding ' + esc(x.wat) + ' intrekken">×</button>' : '') + '</div>';
  }).join('');
  if (!mag && !rijen) return '';
  return '<div class="maal" style="background:transparent;padding:4px 0 0"><div class="kop"><span class="mtitel">Extra gedaan</span></div>' + rijen +
    (mag ? '<button type="button" class="snee plus" data-act="extraNieuw" data-id="' + esc(k.id) + '">+ Ik heb iets extra gedaan</button>' : '') + '</div>';
}

function puntKeuze(act, id, huidig) {
  return '<div class="chips">' + EXTRA_SNEL.map(function (n) {
    return '<button type="button" class="keuze" data-act="' + act + '" data-id="' + esc(id + '|' + n) + '" aria-pressed="' + (Number(huidig) === n) + '">' + n + '</button>';
  }).join('') + '</div>';
}

function renderExtraForm(laag) {
  var f = extraForm, k = persoon(f.kind) || { naam: '?', kleur: '#ECEEF3' };
  laag.innerHTML = '<div class="overlay"><form class="detailbox klusform" data-form="extra" role="dialog" aria-modal="true" aria-label="Extra klus aanmelden">' +
    '<div class="rij" style="gap:12px">' + av(k, 48) + '<h2>Wat heb je extra gedaan?</h2></div>' +
    '<div class="invoer"><label class="sr" for="x-wat">Wat heb je gedaan?</label><input id="x-wat" type="text" maxlength="80" autocomplete="off" placeholder="Bijv. auto gewassen, oppassen op Iselin" value="' + esc(f.wat) + '"></div>' +
    '<div class="veldlabel">Wanneer?</div><div class="chips">' + [['vandaag', 'Vandaag'], ['gisteren', 'Gisteren']].map(function (o) {
      return '<button type="button" class="keuze" data-act="xDatum" data-id="' + o[0] + '" aria-pressed="' + (f.datum === o[0]) + '">' + o[1] + '</button>';
    }).join('') + '</div>' +
    '<div class="veldlabel">Hoeveel punten vind jij het waard? <span class="klein">Papa of mama beslist (25 punten = € 1)</span></div>' +
    puntKeuze('xPunt', 'x', f.voorstel) +
    '<div class="invoer" style="align-items:center"><label class="sr" for="x-punten">Ander aantal punten</label><input id="x-punten" class="puntveld" type="number" inputmode="numeric" min="1" max="50" value="' + esc(f.voorstel) + '"><span class="klein">punten (1–50)</span></div>' +
    '<div class="fout" style="text-align:left">' + esc(f.fout || '') + '</div>' +
    '<div class="chips"><button type="submit" class="knop">Verder</button><button type="button" class="knop2" data-act="xSluit" style="align-self:center">Annuleren</button></div></form></div>';
  if (f.focus) { f.focus = false; document.getElementById('x-wat').focus(); }
}

function renderBeoordeel(laag) {
  var b = beoordeel;
  var items = wachtend().map(function (x) {
    var k = persoon(x.kind) || { naam: x.kind, kleur: '#9AA1B2' };
    var p = b.punten[x.id] !== undefined ? b.punten[x.id] : x.voorstel;
    return '<div class="bkaart"><div class="rij" style="gap:10px">' + av(k, 36) + '<div><b style="font-size:16px">' + esc(x.wat) + '</b>' +
      '<div class="klein">' + esc(k.naam) + ' · ' + dagLabel(x.datum) + ' · voorstel ' + x.voorstel + ' punten</div></div></div>' +
      puntKeuze('bPunt', x.id, p) +
      '<div class="invoer" style="align-items:center"><label class="sr" for="bp-' + esc(x.id) + '">Punten</label>' +
      '<input id="bp-' + esc(x.id) + '" data-bp="' + esc(x.id) + '" class="puntveld" type="number" inputmode="numeric" min="1" max="50" value="' + esc(p) + '">' +
      '<label class="sr" for="br-' + esc(x.id) + '">Reden (optioneel)</label><input id="br-' + esc(x.id) + '" data-br="' + esc(x.id) + '" type="text" maxlength="120" placeholder="Opmerking (optioneel)" value="' + esc(b.reden[x.id] || '') + '"></div>' +
      '<div class="chips"><button type="button" class="knop" data-act="bGoed" data-id="' + esc(x.id) + '">Goedkeuren</button>' +
      '<button type="button" class="knop2" data-act="bAf" data-id="' + esc(x.id) + '" style="align-self:center">Afwijzen</button></div></div>';
  }).join('');
  var g = b.geef;
  var kids = kinderen().map(function (k) {
    var aan = g.kind === k.id;
    return '<button type="button" class="keuze" data-act="gKind" data-id="' + esc(k.id) + '" aria-pressed="' + aan + '"' +
      (aan ? ' style="background:' + esc(k.kleur) + ';border-color:' + esc(k.kleur) + ';color:#101218"' : '') + '>' + esc(k.naam) + '</button>';
  }).join('');
  laag.innerHTML = '<div class="overlay"><div class="detailbox klusform" role="dialog" aria-modal="true" aria-label="Extra klusjes beoordelen">' +
    '<div class="rij" style="justify-content:space-between;width:100%"><h2>Extra klusjes</h2><span class="klein">Als ' + esc(ouderSessie.naam) + '</span></div>' +
    (items || '<div class="leegtekst">Er wacht niets op goedkeuring.</div>') +
    '<div class="veldlabel" style="margin-top:8px">Zelf extra punten geven <span class="klein">bijv. voor de jongsten</span></div>' +
    '<div class="chips">' + kids + '</div>' +
    '<div class="invoer" style="align-items:center"><label class="sr" for="g-wat">Waarvoor?</label><input id="g-wat" type="text" maxlength="80" placeholder="Waarvoor?" value="' + esc(g.wat) + '">' +
    '<label class="sr" for="g-punten">Punten</label><input id="g-punten" class="puntveld" type="number" inputmode="numeric" min="1" max="50" value="' + esc(g.punten) + '"></div>' +
    '<div class="fout" style="text-align:left">' + esc(b.fout || '') + '</div>' +
    '<div class="chips"><button type="button" class="knop" data-act="gGeef">Punten geven</button>' +
    '<button type="button" class="knop2" data-act="bSluit" style="align-self:center">Klaar</button></div></div></div>';
}

function openBeoordeel() {
  var open = function () { beoordeel = { punten: {}, reden: {}, geef: { kind: '', wat: '', punten: 5 }, fout: '' }; render(); };
  if (ouderActief()) open(); else vraagOuderPin(open, 'Extra klusjes');
}

/** Pincodevenster dat een serverfunctie aanroept met de pincode als laatste argument. */
function vraagKindPin(kind, sub, fn, args, gelukt) {
  pin = { server: { fn: fn, args: args }, kind: kind, sub: sub, gelukt: gelukt, digits: '', fout: '', bezig: false };
  render();
}

var MAAND_KORT = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
function datumKort(d) { var p = String(d).split('-'); return p.length === 3 ? Number(p[2]) + ' ' + MAAND_KORT[Number(p[1]) - 1] : d; }
function wanneerTekst(c) {
  return c.datum ? 'eenmalig ' + datumKort(c.datum) : c.dagen.length ? c.dagen.join(', ') : 'elke dag';
}

function klusBeheer() {
  var alle = D.alleKlusjes || [];
  var rij = function (c, kleur) {
    var sub = c.punten + (c.punten === 1 ? ' punt' : ' punten') + ' · ' + wanneerTekst(c) +
      (c.kinderen.length > 1 ? ' · ' + c.kinderen.map(function (id) { var p = persoon(id); return p ? p.naam : id; }).join(' → ') : '') +
      (c.actief ? '' : ' · staat uit');
    return '<button type="button" class="klus" data-act="klusEdit" data-id="' + esc(c.id) + '" style="' + (c.actief ? '' : 'opacity:.55') + '" aria-label="' + esc(c.klus) + ', ' + esc(sub) + ', tik om aan te passen">' +
      '<span class="icoon" style="width:36px;height:36px;background:' + esc(kleur) + '26;color:' + esc(kleur) + '">' + svg(c.icoon, 22) + '</span>' +
      '<span class="ktekst">' + esc(c.klus) + '<span class="sub">' + esc(sub) + '</span></span>' +
      '<span class="potlood" style="color:var(--muted);display:inline-flex">' + svg('potlood', 18) + '</span></button>';
  };
  var kaart = function (kop, lijst, kleur) {
    return '<section class="card" style="padding:18px">' + kop + (lijst.map(function (c) { return rij(c, kleur); }).join('') ||
      '<div class="leegtekst">Nog geen klusjes</div>') + '</section>';
  };
  var kaarten = kinderen().map(function (k) {
    var lijst = alle.filter(function (c) { return c.kinderen.length === 1 && c.kinderen[0] === k.id; });
    return kaart('<div class="rij" style="gap:10px">' + av(k, 36) + '<div style="font-size:18px;font-weight:900">' + esc(k.naam) + '</div></div>', lijst, k.kleur);
  }).join('');
  var wissel = alle.filter(function (c) { return c.kinderen.length > 1; });
  kaarten += kaart('<div class="rij" style="gap:10px"><span class="av" style="width:36px;height:36px;background:#9CC2FF;font-size:18px">↻</span>' +
    '<div style="font-size:18px;font-weight:900">Wisselt per week</div></div>', wissel, '#9CC2FF');
  return '<main class="beheer" style="display:flex;flex-direction:column;gap:14px">' +
    '<div class="weekkop"><div><div style="font-size:22px;font-weight:900">Klusjes beheren</div><div class="klein" style="font-size:14px">Als ' + esc(ouderSessie.naam) +
    ' · wijzigingen gelden meteen · tik op een klus om hem aan te passen</div></div>' +
    '<div class="chips"><button type="button" class="knop" data-act="klusNieuw">+ Nieuwe klus</button>' +
    '<button type="button" class="knop2" data-act="beheerUit" style="align-self:center">Klaar</button></div></div>' +
    '<div class="kids">' + kaarten + '</div></main>';
}

function openKlusForm(c) {
  klusForm = c ? {
    id: c.id, klus: c.klus, kinderen: c.kinderen.slice(), punten: c.punten, icoon: c.icoon,
    wanneer: c.datum ? 'eenmalig' : c.dagen.length ? 'dagen' : 'elke', dagen: c.dagen.slice(), datum: c.datum || '', fout: '', bevestig: false, focus: true
  } : { id: '', klus: '', kinderen: [], punten: 1, icoon: 'opruimen', wanneer: 'elke', dagen: [], datum: D.vandaag, fout: '', bevestig: false, focus: true };
  render();
}

function renderKlusForm(laag) {
  var f = klusForm;
  var kids = kinderen().map(function (k) {
    var aan = f.kinderen.indexOf(k.id) >= 0;
    return '<button type="button" class="keuze" data-act="kfKind" data-id="' + esc(k.id) + '" aria-pressed="' + aan + '"' +
      (aan ? ' style="background:' + esc(k.kleur) + ';border-color:' + esc(k.kleur) + ';color:#101218"' : '') + '>' + esc(k.naam) + '</button>';
  }).join('');
  var punten = [1, 2, 3].map(function (n) {
    return '<button type="button" class="keuze" data-act="kfPunten" data-id="' + n + '" aria-pressed="' + (f.punten === n) + '">' + n + (n === 1 ? ' punt' : ' punten') + '</button>';
  }).join('');
  var iconen = ['opruimen', 'eten', 'was', 'kliko', 'water', 'schoon', 'dier', 'overig'].map(function (i) {
    return '<button type="button" class="keuze" data-act="kfIcoon" data-id="' + i + '" aria-pressed="' + (f.icoon === i) + '" aria-label="Icoon ' + i + '">' + svg(i, 22) + '</button>';
  }).join('');
  var wanneer = [['elke', 'Elke dag'], ['dagen', 'Vaste dagen'], ['eenmalig', 'Eenmalig']].map(function (w) {
    return '<button type="button" class="keuze" data-act="kfWanneer" data-id="' + w[0] + '" aria-pressed="' + (f.wanneer === w[0]) + '">' + w[1] + '</button>';
  }).join('');
  var extra = f.wanneer === 'dagen' ? '<div class="chips" role="group" aria-label="Dagen">' + DAG_KORT.map(function (d) {
      return '<button type="button" class="keuze" data-act="kfDag" data-id="' + d + '" aria-pressed="' + (f.dagen.indexOf(d) >= 0) + '">' + d + '</button>';
    }).join('') + '</div>' :
    f.wanneer === 'eenmalig' ? '<div class="invoer"><label class="sr" for="kf-datum">Datum</label><input id="kf-datum" type="date" value="' + esc(f.datum) + '"></div>' : '';
  var weg = f.id ? (f.bevestig ? '<button type="button" class="knop-rood" data-act="kfVerwijder">Ja, verwijderen</button>' :
    '<button type="button" class="knop2" data-act="kfVerwijder" style="align-self:center">Verwijderen</button>') : '';
  laag.innerHTML = '<div class="overlay"><form class="detailbox klusform" data-form="klus" role="dialog" aria-modal="true" aria-label="Klus">' +
    '<h2>' + (f.id ? 'Klus aanpassen' : 'Nieuwe klus') + '</h2>' +
    '<label class="veldlabel" for="kf-klus">Wat moet er gebeuren?</label>' +
    '<div class="invoer"><input id="kf-klus" type="text" maxlength="40" autocomplete="off" placeholder="Bijv. tafel dekken" value="' + esc(f.klus) + '"></div>' +
    '<div class="veldlabel">Voor wie? <span class="klein">Kies je er meer, dan wisselt de klus elke week</span></div><div class="chips">' + kids + '</div>' +
    '<div class="veldlabel">Hoeveel punten?</div><div class="chips">' + punten + '</div>' +
    '<div class="veldlabel">Icoon</div><div class="chips">' + iconen + '</div>' +
    '<div class="veldlabel">Wanneer?</div><div class="chips">' + wanneer + '</div>' + extra +
    '<div class="fout" style="text-align:left" aria-live="assertive">' + esc(f.fout || '') + '</div>' +
    '<div class="kiesknoppen" style="justify-content:space-between;width:100%"><div class="chips"><button type="submit" class="knop">Opslaan</button>' +
    '<button type="button" class="knop2" data-act="kfSluit" style="align-self:center">Annuleren</button></div>' + weg + '</div></form></div>';
  if (f.focus) { f.focus = false; if (!f.id) document.getElementById('kf-klus').focus(); }
}

function bewaarKlus() {
  var f = klusForm;
  f.klus = f.klus.trim();
  f.fout = !f.klus ? 'Geef de klus een naam' : !f.kinderen.length ? 'Kies minstens één kind' :
    f.wanneer === 'dagen' && !f.dagen.length ? 'Kies minstens één dag' : f.wanneer === 'eenmalig' && !f.datum ? 'Kies een datum' : '';
  if (f.fout) { render(); return; }
  if (!ouderActief()) { vraagOuderPin(function () { render(); bewaarKlus(); }, 'Klusjes beheren'); return; }
  ouderSessie.tot = Date.now() + 5 * 60000;
  var data = { id: f.id, klus: f.klus, kinderen: f.kinderen, punten: f.punten, icoon: f.icoon,
    dagen: f.wanneer === 'dagen' ? f.dagen : [], datum: f.wanneer === 'eenmalig' ? f.datum : '' };
  klusForm = null;
  zegt(f.id ? 'Klus aangepast' : 'Klus toegevoegd', '#9CC2FF');
  bewaar('zetKlus', [data, ouderSessie.pin]);
}

function eten() {
  var vandaagKort = DAG_KORT[D.dagIndex];
  var aantal = D.gezin.filter(function (p) { return D.eten[p.id] === 'ja'; }).length;
  var bewerk = ouderActief();
  var menu = D.menu.map(function (m) {
    var isVandaag = m.dag.toLowerCase().slice(0, 2) === vandaagKort;
    var datum = menuDatum(m.dag);
    var helpers = ((D.helpers || {})[datum] || []).map(persoon).filter(Boolean);
    var kanHelpen = datum && datum >= D.vandaag;
    var binnen = '<span class="d">' + esc(m.dag) + '</span>' +
      (m.gerecht ? '<span class="g">' + esc(m.gerecht) + '</span>' : '<span class="g leeg">Nog niets gepland</span>') +
      (isVandaag ? '<span style="font-size:14px;font-weight:800;color:#9CC2FF">Vanavond · ' + aantal + ' eters</span>' : '') +
      (helpers.length ? '<span class="helpers" title="Helpt koken">' + helpers.map(function (p) { return av(p, 24); }).join('') + '</span>' :
        !bewerk && kanHelpen ? '<span class="helpt-niet">+ helpen</span>' : '');
    if (!bewerk && kanHelpen) {
      return '<button type="button" class="menu' + (isVandaag ? ' vandaag' : '') + '" data-act="helpDag" data-id="' + esc(datum) + '" aria-label="' +
        esc(volDag(m.dag)) + ': ' + esc(m.gerecht || 'nog niets gepland') + '. Tik om te helpen koken">' + binnen + '</button>';
    }
    return bewerk ?
      '<button type="button" class="menu' + (isVandaag ? ' vandaag' : '') + '" data-act="menuDag" data-id="' + esc(m.dag) + '" aria-label="' +
        esc(volDag(m.dag)) + ': ' + esc(m.gerecht || 'nog niets gepland') + ', tik om aan te passen">' + binnen + '<span class="potlood">' + svg('potlood', 20) + '</span></button>' :
      '<div class="menu voorbij' + (isVandaag ? ' vandaag' : '') + '">' + binnen + '</div>';
  }).join('');
  var wensKinderen = kinderen().map(function (k) {
    var aan = wensKind === k.id;
    return '<button type="button" class="keuze" data-act="wensKind" data-id="' + esc(k.id) + '" aria-pressed="' + aan + '"' +
      (aan ? ' style="background:' + esc(k.kleur) + ';border-color:' + esc(k.kleur) + ';color:#101218"' : '') + '>' + esc(k.naam) + '</button>';
  }).join('');
  var wensen = (D.wensen || []).map(function (w) {
    var k = persoon(w.kind) || { naam: w.kind, kleur: '#9AA1B2' };
    return '<div class="wens">' + av(k, 32) + '<span class="wtekst"><b>' + esc(w.wens) + '</b><span class="klein">' + esc(k.naam) + ' · ' + esc(datumKort(w.datum)) + '</span></span>' +
      '<button type="button" class="wis" data-act="wensWeg" data-id="' + esc(w.id) + '" aria-label="Wens ' + esc(w.wens) + ' weghalen (ouderpincode)">×</button></div>';
  }).join('');
  var menuKop = bewerk ?
    '<span style="display:flex;align-items:center;gap:10px"><span class="klein">Bewerken als ' + esc(ouderSessie.naam) + '</span>' +
      '<button type="button" class="knop2" data-act="menuKlaar">Klaar</button></span>' :
    '<button type="button" class="knop2" data-act="menuAan" style="display:inline-flex;align-items:center;gap:8px">' + svg('potlood', 18) + 'Aanpassen</button>';
  var open = D.boodschappen.filter(function (b) { return !b.gedaan; }).length;
  var heeftGedaan = D.boodschappen.some(function (b) { return b.gedaan; });
  var items = D.boodschappen.map(function (b) {
    return '<button type="button" class="item' + (b.gedaan ? ' gedaan' : '') + '" data-act="item" data-id="' + esc(b.id) + '" aria-label="' + esc(b.item) + (b.gedaan ? ', in het mandje' : ', nog halen') + '">' +
      '<span class="vak">' + (b.gedaan ? svg('vink', 16, 3) : '') + '</span><span class="itekst">' + esc(b.item) + '</span></button>';
  }).join('');
  return '<main class="grid-eten"><div class="kolom">' +
    '<section class="card"><div class="kop" style="align-items:center"><div><h2>Weekmenu</h2>' +
    '<div class="klein" style="font-size:14px;margin-top:2px">Dit is de planning. Hebben we nog iets over dat op moet, dan kan het anders worden.</div></div>' + menuKop + '</div>' +
    menu + (bewerk ? '' : '<div class="klein" style="font-size:14px">Tik op een dag om te helpen koken: dat is een klus van 3 punten.</div>') + '</section>' +
    '<section class="card"><div class="kop"><h2>Wensen</h2><span class="klein">Wat wil jij graag eten?</span></div>' +
    '<div class="chips" role="group" aria-label="Wie heeft een wens?">' + wensKinderen + '</div>' +
    '<form class="invoer" data-form="wens"><label class="sr" for="wens">Eetwens</label>' +
    '<input id="wens" type="text" autocomplete="off" maxlength="60" placeholder="' + (wensKind ? 'Bijv. pannenkoeken' : 'Kies eerst wie je bent') + '"' + (wensKind ? '' : ' disabled') + '>' +
    '<button type="submit" class="knop"' + (wensKind ? '' : ' disabled') + '>Doorgeven</button></form>' +
    '<div class="lijst">' + (wensen || '<div class="leegtekst">Nog geen wensen.</div>') + '</div></section></div>' +
    '<section class="card"><div class="kop"><h2>Boodschappen</h2><span class="klein">' + open + ' nog te halen</span></div>' +
    '<form class="invoer" data-form="toevoegen"><label class="sr" for="nieuw">Nieuw boodschappen-item</label>' +
